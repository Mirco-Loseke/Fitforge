<script>
// Firebase-Init erst nach den deferred SDK-Skripten ausführen (DOMContentLoaded
// feuert garantiert nach allen defer-Skripten).
function __ffInitFirebase() {
  try {
    const firebaseConfig = {
      apiKey: "AIzaSyBHcrBR0fWYVDkdWWAoVfvMEaN0CeoB52M",
      authDomain: "mircos-app.firebaseapp.com",
      projectId: "mircos-app",
      storageBucket: "mircos-app.firebasestorage.app",
      messagingSenderId: "192709665118",
      appId: "1:192709665118:web:73e2bb1c9bc552bbbf2fcf"
    };

    firebase.initializeApp(firebaseConfig);
    const _auth = firebase.auth();
    const _db   = firebase.firestore();
    _db.settings({ ignoreUndefinedProperties: true });
    const _stor = firebase.storage();

    // Offline-Persistence: Firestore puffert Daten & Schreibvorgänge in IndexedDB.
    // Muss vor dem ersten Firestore-Zugriff aufgerufen werden.
    _db.enablePersistence({ synchronizeTabs: true }).catch(err => {
      // 'failed-precondition' (mehrere Tabs ohne Sync-Support) / 'unimplemented' (alter Browser)
      console.warn("Firestore Offline-Persistence nicht aktiv:", err.code || err.message);
    });

    // Auth helpers
    window.firebaseAuth = _auth;
    window.firebaseCreateUser = (auth, email, pw) => _auth.createUserWithEmailAndPassword(email, pw);
    window.firebaseSignIn    = (auth, email, pw) => _auth.signInWithEmailAndPassword(email, pw);
    window.firebaseSignOut   = () => _auth.signOut();
    window.firebaseUpdateProfile = (user, data) => user.updateProfile(data);
    window.firebaseOnAuthStateChanged = (cb) => _auth.onAuthStateChanged(cb);

    // Firestore helpers
    window.firebaseDb  = _db;
    window.firebaseDoc = (db, ...path) => {
      let ref = _db;
      for(let i=0; i<path.length; i++){
        ref = i%2===0 ? ref.collection(path[i]) : ref.doc(path[i]);
      }
      return ref;
    };
    window.firebaseGetDoc = (ref) => ref.get().then(snap => ({
      exists: () => snap.exists === true,
      data:   () => snap.data() || {}
    }));
    window.firebaseSetDoc = (ref, data) => ref.set(data);
    window.firebaseOnSnapshot = (ref, cb, err) => ref.onSnapshot(cb, err);

    // Storage helpers
    window.firebaseStorage        = _stor;
    window.firebaseRef            = (stor, path) => _stor.ref(path);
    window.firebaseUploadBytes    = (ref, file) => ref.put(file);
    window.firebaseGetDownloadURL = (ref) => ref.getDownloadURL();
    window.firebaseDeleteObject   = (ref) => ref.delete();

    // Signal ready
    window.firebaseReady = true;
    window.dispatchEvent(new Event('firebaseReady'));
    if(window.dbg) dbg('✅ Firebase bereit!', '#0f0');
  } catch(e) {
    console.warn("Firebase init failed:", e.message);
    if(window.dbg) dbg('❌ Firebase Fehler: ' + e.message, '#f55');
    window.firebaseReady = false;
  }
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', __ffInitFirebase);
else __ffInitFirebase();
</script>

    <span id="debug-arrow">▲</span> DEBUG CONSOLE
  </button>
  <div id="fb-debug"></div>

<script>
  function toggleDebug() {
    const c = document.getElementById('fb-debug-container');
    const a = document.getElementById('debug-arrow');
    c.classList.toggle('collapsed');
    a.textContent = c.classList.contains('collapsed') ? '▲' : '▼';
  }
  const dbg = (msg, color) => {
    const d = document.getElementById('fb-debug');
    if(d){ 
      const line = document.createElement('div'); 
      line.style.color = color||'#0f0'; 
      line.style.paddingBottom = '2px';
      line.textContent = new Date().toLocaleTimeString() + ' » ' + msg; 
      d.appendChild(line); 
      if (!document.getElementById('fb-debug-container').classList.contains('collapsed')) {
        d.scrollTop=d.scrollHeight; 
      }
    }
    console.log(msg);
  };
  window.dbg = dbg;
  window.onerror = (msg,src,line,col,err) => {
    dbg('JS ERROR: '+msg+' ('+src+':'+line+':'+col+')', '#f55');
    if(err && err.stack) dbg('STACK: '+err.stack.split('\n').slice(0,3).join(' | '), '#f88');
    return false;
  };
  window.addEventListener('unhandledrejection', e => {
    dbg('PROMISE ERROR: '+(e.reason?.message||e.reason||'unbekannt'), '#f55');
    if(e.reason?.stack) dbg('STACK: '+e.reason.stack.split('\n').slice(0,3).join(' | '), '#f88');
  });
  dbg('Seite geladen - warte auf Firebase...');
</script>
<script type="text/plain" id="ff-src">
const { useState, useEffect, useRef } = React;

const MediaDisplay = ({src, style, className, onClick}) => {
  if (!src) return null;
  const isVideo = src.toLowerCase().includes("video") || src.toLowerCase().endsWith(".mp4") || src.toLowerCase().endsWith(".webm") || src.toLowerCase().endsWith(".mov") || src.startsWith("data:video");
  if (isVideo) {
    return (
      <video src={src} style={style} className={className} onClick={onClick} autoPlay muted loop playsInline />
    );
  }
  return <img src={src} style={style} className={className} onClick={onClick} loading="lazy" />;
};

// ── Firebase helpers (user-scoped) ────────────────────────────────────────────
const getUid = () => window.firebaseAuth?.currentUser?.uid || null;

const fbGet = async (key, fallback) => {
  try {
    const uid = getUid();
    if (window.firebaseDb && uid) {
      const snap = await window.firebaseGetDoc(window.firebaseDoc(window.firebaseDb, "fitforge", `${uid}_${key}`));
      if (snap.exists()) {
        const val = snap.data().value;
        localStorage.setItem(`ff_${uid}_${key}`, JSON.stringify(val));
        return val;
      }
    }
    // Only fallback to user-specific localStorage, NEVER to global ff_ keys
    const r = uid ? localStorage.getItem(`ff_${uid}_${key}`) : null;
    return r ? JSON.parse(r) : fallback;
  } catch (e) {
    const uid = getUid();
    const r = uid ? localStorage.getItem(`ff_${uid}_${key}`) : null;
    return r ? JSON.parse(r) : fallback;
  }
};

const fbSet = async (key, value) => {
  try {
    const uid = getUid();
    const cleaned = stripBase64(value, key);
    if (uid) localStorage.setItem(`ff_${uid}_${key}`, JSON.stringify(cleaned));
    else localStorage.setItem("ff_" + key, JSON.stringify(cleaned));

    if (window.firebaseDb && uid) {
      await window.firebaseSetDoc(window.firebaseDoc(window.firebaseDb, "fitforge", `${uid}_${key}`), { value: cleaned });
    }
  } catch(e) { 
    console.error("fbSet error:", e);
    if(window.dbg) dbg(`❌ Cloud-Speicher Fehler: ${e.message}`, '#f55');
    window.showToast?.(`Cloud-Speicher Fehler: ${e.message}`, "error");
  }
};

// ── Freunde: öffentliche Profile + Freundschaftsanfragen ───────────────────
// Nutzt eine eigene, für eingeloggte Nutzer lesbare Collection "userProfiles"
// (getrennt von den privaten "fitforge"-Dokumenten) sowie "friendRequests".
// Erfordert passende Firestore Security Rules (siehe Doku/Chat).
const upsertUserProfile = async (uid, user) => {
  if (!window.firebaseDb || !uid) return;
  // E-Mail immer befüllen: das Profilformular-Feld kann leer sein, dann greift
  // die echte Login-E-Mail aus Firebase Auth – sonst ist man nicht per E-Mail suchbar.
  const email = ((user.email || "").trim()) || ((window.firebaseAuth?.currentUser?.email || "").trim());
  const profile = {
    uid,
    username: (user.username || "").trim(),
    usernameLower: (user.username || "").trim().toLowerCase(),
    email,
    emailLower: email.toLowerCase(),
    firstName: user.firstName || "",
    lastName: user.lastName || "",
    firstNameLower: (user.firstName || "").trim().toLowerCase(),
    lastNameLower: (user.lastName || "").trim().toLowerCase()
  };
  await window.firebaseDoc(window.firebaseDb, "userProfiles", uid).set(profile, { merge: true });
  return profile;
};

const isUsernameTaken = async (username, myUid) => {
  if (!window.firebaseDb || !username) return false;
  const snap = await window.firebaseDoc(window.firebaseDb, "userProfiles").where("usernameLower", "==", username.trim().toLowerCase()).get();
  return snap.docs.some(d => d.id !== myUid);
};

const searchUserProfiles = async (term, myUid) => {
  if (!window.firebaseDb || !term || !term.trim()) return [];
  const q = term.trim().toLowerCase();
  // Robust: gesamte (kleine) userProfiles-Collection laden und clientseitig filtern.
  // So werden auch Profile gefunden, die von aelteren Code-Versionen ohne die
  // *Lower-Felder geschrieben wurden, und Teilstring-Suche funktioniert ueberall.
  const snap = await window.firebaseDoc(window.firebaseDb, "userProfiles").limit(500).get();
  const matches = [];
  snap.docs.forEach(d => {
    const data = d.data() || {};
    const p = { ...data, uid: data.uid || d.id };
    if (p.uid === myUid) return;
    const hay = [p.username, p.email, p.firstName, p.lastName]
      .filter(Boolean).map(s => String(s).toLowerCase());
    if (hay.some(s => s.includes(q))) matches.push(p);
  });
  return matches.slice(0, 20);
};
const friendReqId = (fromUid, toUid) => `${fromUid}_${toUid}`;

const sendFriendRequest = async (myUid, myProfile, otherProfile) => {
  const reverse = await window.firebaseDoc(window.firebaseDb, "friendRequests", friendReqId(otherProfile.uid, myUid)).get();
  if (reverse.exists) throw new Error("Es gibt bereits eine Anfrage von dieser Person.");
  await window.firebaseDoc(window.firebaseDb, "friendRequests", friendReqId(myUid, otherProfile.uid)).set({
    from: myUid, to: otherProfile.uid,
    fromUsername: myProfile.username || myProfile.email, toUsername: otherProfile.username || otherProfile.email,
    fromEmail: myProfile.email, toEmail: otherProfile.email,
    status: "pending", createdAt: Date.now()
  });
};

const getUserProfile = async (uid) => {
  if (!window.firebaseDb || !uid) return null;
  try {
    const snap = await window.firebaseDoc(window.firebaseDb, "userProfiles", uid).get();
    if (!snap.exists) return null;
    return snap.data();
  } catch (e) { return null; }
};

const getIncomingRequests = async (myUid) => {
  if (!window.firebaseDb || !myUid) return [];
  const snap = await window.firebaseDoc(window.firebaseDb, "friendRequests").where("to", "==", myUid).where("status", "==", "pending").get();
  const reqs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  // Aktuelles Profil der anfragenden Person nachladen, damit Name & E-Mail
  // auch für ältere Anfragen (die nur fromUsername/fromEmail gespeichert haben) da sind.
  await Promise.all(reqs.map(async r => {
    const prof = await getUserProfile(r.from);
    const fullName = prof ? `${prof.firstName || ""} ${prof.lastName || ""}`.trim() : "";
    r.displayUsername = (prof && prof.username) || r.fromUsername || "";
    r.displayName = fullName;
    r.displayEmail = (prof && prof.email) || r.fromEmail || "";
  }));
  return reqs;
};

const getOutgoingRequests = async (myUid) => {
  if (!window.firebaseDb || !myUid) return [];
  const snap = await window.firebaseDoc(window.firebaseDb, "friendRequests").where("from", "==", myUid).where("status", "==", "pending").get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
};

const getFriends = async (myUid) => {
  if (!window.firebaseDb || !myUid) return [];
  const [asFrom, asTo] = await Promise.all([
    window.firebaseDoc(window.firebaseDb, "friendRequests").where("from", "==", myUid).where("status", "==", "accepted").get(),
    window.firebaseDoc(window.firebaseDb, "friendRequests").where("to", "==", myUid).where("status", "==", "accepted").get()
  ]);
  const fromFriends = asFrom.docs.map(d => ({ id: d.id, uid: d.data().to, username: d.data().toUsername, email: d.data().toEmail }));
  const toFriends = asTo.docs.map(d => ({ id: d.id, uid: d.data().from, username: d.data().fromUsername, email: d.data().fromEmail }));
  return [...fromFriends, ...toFriends];
};

const acceptFriendRequest = async (reqId) => {
  await window.firebaseDoc(window.firebaseDb, "friendRequests", reqId).update({ status: "accepted" });
};

const removeFriendRequest = async (reqId) => {
  await window.firebaseDoc(window.firebaseDb, "friendRequests", reqId).delete();
};

// ── Teilen: Trainings-/Wochenpläne an Freunde senden ───────────────────────
// Landet in der Collection "sharedItems"; der Empfänger sieht sie oben in den
// Benachrichtigungen und kann sie importieren.
const shareItemWithFriends = async (fromUid, fromProfile, friendUids, type, itemName, payload) => {
  const fromName = (fromProfile && (fromProfile.username
    || `${fromProfile.firstName || ""} ${fromProfile.lastName || ""}`.trim()
    || fromProfile.email)) || "Ein Freund";
  await Promise.all((friendUids || []).map(to => {
    const id = `${fromUid}_${to}_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`;
    return window.firebaseDoc(window.firebaseDb, "sharedItems", id).set({
      from: fromUid, to, fromName, type, itemName: itemName || "", payload, status: "pending", createdAt: Date.now()
    });
  }));
};

const getIncomingSharedItems = async (myUid) => {
  if (!window.firebaseDb || !myUid) return [];
  try {

// ── Einladen per Link: ?ref=<uid> wird beim ersten Laden gemerkt und, sobald
// der neue Nutzer eingeloggt ist, in eine Freundschaftsanfrage umgewandelt.
const REF_STORAGE_KEY = "ff_pending_ref";

const captureReferralFromUrl = () => {
  try {
    const params = new URLSearchParams(window.location.search);
    const ref = params.get("ref");
    if (!ref) return;
    localStorage.setItem(REF_STORAGE_KEY, ref);
    params.delete("ref");
    const query = params.toString();
    const newUrl = window.location.pathname + (query ? `?${query}` : "") + window.location.hash;
    window.history.replaceState({}, "", newUrl);
  } catch (e) {}
};
captureReferralFromUrl();

const processPendingReferral = async (myUid, myProfile) => {
  const refUid = localStorage.getItem(REF_STORAGE_KEY);
  if (!refUid || refUid === myUid) { localStorage.removeItem(REF_STORAGE_KEY); return null; }
  try {
    const refSnap = await window.firebaseDoc(window.firebaseDb, "userProfiles", refUid).get();
    if (!refSnap.exists) { localStorage.removeItem(REF_STORAGE_KEY); return null; }
    const refProfile = refSnap.data();

    // Der Einladende hat mir schon eine Anfrage geschickt? Dann direkt annehmen.
    const incomingFromRef = await window.firebaseDoc(window.firebaseDb, "friendRequests", friendReqId(refUid, myUid)).get();
    if (incomingFromRef.exists && incomingFromRef.data().status === "pending") {
      await acceptFriendRequest(friendReqId(refUid, myUid));
      localStorage.removeItem(REF_STORAGE_KEY);
      return { type: "accepted", profile: refProfile };
    }

    // Schon eine Beziehung in die andere Richtung (Anfrage von mir oder Freunde)? Nichts tun.
    const mineToRef = await window.firebaseDoc(window.firebaseDb, "friendRequests", friendReqId(myUid, refUid)).get();
    if (mineToRef.exists) { localStorage.removeItem(REF_STORAGE_KEY); return null; }

    await sendFriendRequest(myUid, myProfile, refProfile);
    localStorage.removeItem(REF_STORAGE_KEY);
    return { type: "requested", profile: refProfile };
  } catch (e) {
    console.warn("processPendingReferral:", e.message);
    localStorage.removeItem(REF_STORAGE_KEY);
    return null;
  }
};

// Firebase Storage upload – returns download URL (falls back to base64)
const uploadToStorage = async (file, path) => {
  try {
    const uid = getUid();
    if (!window.firebaseStorage || !uid) throw new Error("Storage not ready or not signed in");
    const fullPath = `fitforge/${path}`;
    const storageRef = window.firebaseRef(window.firebaseStorage, fullPath);
    await window.firebaseUploadBytes(storageRef, file);
    return await window.firebaseGetDownloadURL(storageRef);
  } catch(e) {
    console.warn("Storage upload fallback to compressed base64:", e.message);
    // Sichtbar machen, WARUM Storage fehlschlägt (meist fehlende Storage-Regeln =
    // "storage/unauthorized"). Dann landet das Bild nur als base64 lokal und kommt
    // nicht auf andere Geräte.
    if (window.dbg) dbg(`⚠️ Bild-Upload zu Firebase Storage fehlgeschlagen (${e.code || e.message}) – Bild bleibt nur lokal. Storage-Regeln prüfen!`, '#f80');
    const isProgress = path.includes("progress");
    const maxDim = isProgress ? 700 : 300;
    return await compressImage(file, maxDim, maxDim, 0.5);
  }
};

  } catch(e) { console.warn("deleteFromStorage:", e.message); }
};

const DEMO_PLAN_NAMES={1:"Push Pull Legs",2:"Upper / Lower"};

const isDemoWorkout=w=>!!w&&[1,2,3,4,5].includes(w.id)&&typeof w.date==="string"&&w.date.startsWith("2025-03-");
const isDemoPR=(key,pr)=>(key==="bankdrücken"&&pr?.date==="2025-03-10"&&pr?.weight===85)||(key==="kniebeugen"&&pr?.date==="2025-03-08"&&pr?.weight===105);

  if(!demoPlans.length&&!demoWorkouts.length) return d;
  return {
    ...d,
    plans:(d.plans||[]).filter(p=>!isDemoPlan(p)),
    workouts:(d.workouts||[]).filter(w=>!isDemoWorkout(w)),
    deletedPlanIds:[...new Set([...(d.deletedPlanIds||[]),...demoPlans.map(p=>p.id)])],
    deletedWorkoutIds:[...new Set([...(d.deletedWorkoutIds||[]),...demoWorkouts.map(w=>w.id)])]

  return out;
};
const stripBase64 = (val, key) => {
  if (!val) return val;
  const limit = (key === "photos" || key === "exercisePhotos") ? 900000 : 1000;
  
  const recurse = (v) => {
    if (!v) return v;
    if (typeof v === "string") {
      if (v.startsWith("data:") && v.length > limit) {
        return null;
      }
      return v;
    }
    if (Array.isArray(v)) {
      return v.map(recurse);
    }
    if (typeof v === "object") {
      const copy = {};
      for (const k in v) {
        copy[k] = recurse(v[k]);
      }
      return copy;
    }
    return v;
  };
  
  return recurse(val);
};
const compressImage = (file, maxWidth = 700, maxHeight = 700, quality = 0.5) => {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
        } else {
          if (height > maxHeight) {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
};

const playBeep = (freq, duration, vol=0.1) => {
  try {

    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.01);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + duration);
    
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch(e) { console.warn("Beep failed", e); }
};

const speak = (text, vol = 1.0) => {
  if (!window.speechSynthesis) return;
  try {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'de-DE';
    utterance.volume = vol;
    utterance.rate = 1.0;
    window.speechSynthesis.speak(utterance);
  } catch(e) { console.warn("Speech failed", e); }
};

function HiitTimer({duration, onFinish, isMobile, controlledTime, controlledActive}){
  const [internalTime, setInternalTime] = useState(duration);
  const [internalActive, setInternalActive] = useState(false);
  const itv = useRef();

  const timeLeft = controlledTime !== undefined ? controlledTime : internalTime;
  const active = controlledActive !== undefined ? controlledActive : internalActive;

  useEffect(() => {
    setInternalTime(duration);
  }, [duration]);

  useEffect(() => {
    if (controlledTime !== undefined) return; // Prop-driven, skip internal logic
    if(active && timeLeft > 0){
      itv.current = setInterval(() => {
        setInternalTime(t => {
          const next = t - 1;
          if(next === 0) { 
            playBeep(880, 0.6, 0.4);
            clearInterval(itv.current);
            setInternalActive(false);
            if(onFinish) onFinish();
            return 0;
          }
          if(next <= 3) playBeep(660, 0.15, 0.2);
          return next;
        });
      }, 1000);
    } else {
      clearInterval(itv.current);
    }
    return () => clearInterval(itv.current);
  }, [active, controlledTime]);

  const toggle = () => {
    if (controlledTime !== undefined) return; // Prop-driven
    if(!active) {
      if(timeLeft <= 0) setInternalTime(duration);
      playBeep(440, 0.2, 0.2);
      setInternalActive(true);
    } else {
      setInternalActive(false);
    }
  };

  return (
    <div className="hiit-glow" style={{background:"#111114", border:"2px solid #FFD166", borderRadius:24, padding: isMobile ? 16 : 24, display:"flex", flexDirection:"column", gap: isMobile ? 4 : 14, width:"100%", textAlign:"center", marginBottom: 12}}>
      <div style={{fontSize: 9, fontWeight: 900, color: "#FFD166", textTransform:"uppercase", letterSpacing: 2, opacity: 0.7}}>HIIT Interval</div>
      <div style={{display:"flex", justifyContent:"center", alignItems:"baseline", gap:6, margin: "0"}}>
        <div style={{fontFamily:"'DM Sans',sans-serif", fontSize: isMobile ? 54 : 64, fontWeight:800, color:"#FFD166", letterSpacing:-2, textShadow: "0 0 15px rgba(255, 209, 102, 0.3)", minWidth: isMobile ? "1.5em" : "auto"}}>
          {timeLeft}
        </div>
        <div style={{fontSize:14, fontWeight:800, color:"#FFD166", opacity: 0.5}}>SEK</div>
      </div>
      {controlledTime === undefined && (
        <div style={{display:"flex", gap:10}}>
          <button 
            style={{flex:1, height: 44, background: active ? "rgba(239, 71, 111, 0.1)" : "rgba(255, 209, 102, 0.1)", border: `2px solid ${active ? "#EF476F" : "#FFD166"}`, color: active ? "#EF476F" : "#FFD166", fontWeight:900, borderRadius:12, cursor:"pointer", fontSize: 13, transition: "0.2s"}}
            onClick={toggle}
          >
            {active ? "PAUSE" : "START"}
          </button>
        </div>
      )}
    </div>
  );
}

let _chartId=0;
function LineChart({points,color="#FF6B35",height=80,unit=""}){
  const id=useRef(`lc${++_chartId}`).current;
  const [hover,setHover]=useState(null);
  if(!points||points.length<2)return<div style={{color:"#555",fontSize:13,padding:"20px 0",textAlign:"center"}}>Noch nicht genug Daten</div>;
  const W=500,H=height,pad=12,padL=34;
  const vals=points.map(v=>isFinite(v)?v:0);
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;

  const yPad = rng * 0.2; // 20% headroom
  const effMin = mn - yPad;
  const effMax = mx + yPad;
  const effRng = effMax - effMin || 1;

  const xs=vals.map((_,i)=>padL+(i/(vals.length-1))*(W-padL-pad));
  const yOf=v=>H-pad-6-((v-effMin)/effRng)*(H-pad*2-6);
  const ys=vals.map(yOf);
  // Weiche Kurve: kubische Bézier mit horizontalen Kontrollpunkten (kein Überschwingen)
  const d=xs.map((x,i)=>{
    if(i===0)return`M${x.toFixed(1)},${ys[0].toFixed(1)}`;
    const cx=((xs[i-1]+x)/2).toFixed(1);
    return`C${cx},${ys[i-1].toFixed(1)} ${cx},${ys[i].toFixed(1)} ${x.toFixed(1)},${ys[i].toFixed(1)}`;
  }).join(" ");
  const area=`${d} L${xs[xs.length-1].toFixed(1)},${H} L${xs[0].toFixed(1)},${H} Z`;
  const fmtV=v=>Number.isInteger(v)?v:v.toFixed(1);
  // Horizontale Gitterlinien mit Werte-Beschriftung
  const gridVals=[mn,(mn+mx)/2,mx].filter((v,i,a)=>a.indexOf(v)===i);
  // Bei vielen Punkten nur markante Werte beschriften (erster, Min, Max, letzter)
  const mnIdx=vals.indexOf(mn),mxIdx=vals.indexOf(mx);
  const showLabel=i=>vals.length<=12||i===0||i===vals.length-1||i===mnIdx||i===mxIdx;
  const onMove=e=>{
    const r=e.currentTarget.getBoundingClientRect();
    const cx=e.touches?e.touches[0].clientX:e.clientX;
    const t=Math.max(0,Math.min(1,(cx-r.left)/r.width));
    const svgX=t*W;
    let best=0,bd=1e9;
    xs.forEach((x,i)=>{const dd=Math.abs(x-svgX);if(dd<bd){bd=dd;best=i;}});
    setHover(best);
  };
  return(
    <div style={{width:"100%",height:H,position:"relative", marginBottom: 10}}>
      <svg width="100%" height={H} viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" style={{overflow:"visible",touchAction:"pan-y",cursor:"crosshair"}}
        onMouseMove={onMove} onMouseLeave={()=>setHover(null)} onTouchStart={onMove} onTouchMove={onMove} onTouchEnd={()=>setHover(null)}>
        <defs>
          <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={color} stopOpacity="0.35"/>
            <stop offset="100%" stopColor={color} stopOpacity="0"/>
          </linearGradient>
        </defs>
        {gridVals.map((v,i)=>(
          <g key={i}>
            <line x1={padL} y1={yOf(v)} x2={W-pad} y2={yOf(v)} stroke="rgba(255,255,255,0.06)" strokeWidth="1" strokeDasharray="3 4"/>
            <text x={padL-6} y={yOf(v)+3} textAnchor="end" style={{fontSize:8.5,fill:"#555",fontWeight:700}}>{fmtV(v)}</text>
          </g>
        ))}
        <path d={area} fill={`url(#${id})`} className="fadeIn"/>
        <path d={d} fill="none" stroke={color} strokeWidth="5" strokeLinecap="round" strokeLinejoin="round" opacity="0.18" style={{filter:"blur(3px)"}}/>
        <path d={d} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" pathLength="1" className="lineDraw"/>

        {/* Value Labels & Dots */}
        {vals.map((v,i)=>(
          <g key={i} className="fadeIn">
            <circle cx={xs[i]} cy={ys[i]} r={hover===i?4.5:showLabel(i)?3:2} fill={hover===i?"#fff":color} stroke={hover===i?color:"none"} strokeWidth={hover===i?2:0} opacity={hover===i||showLabel(i)?1:0.55}/>
            {hover!==i&&showLabel(i)&&<text x={xs[i]} y={ys[i]-8} textAnchor="middle" style={{fontSize:9, fill:"#999", fontWeight:700}}>{fmtV(v)}{unit}</text>}
          </g>
        ))}
        {hover!==null&&<line x1={xs[hover]} y1={pad} x2={xs[hover]} y2={H-pad} stroke={color} strokeWidth="1" strokeDasharray="3 3" opacity="0.5"/>}
      </svg>
      {hover!==null&&(
        <div style={{position:"absolute",left:`${xs[hover]/W*100}%`,top:-4,transform:`translate(${hover>vals.length/2?"-105%":"8px"},-100%)`,background:"#1A1A20",border:`1px solid ${color}55`,borderRadius:8,padding:"4px 9px",fontSize:11,fontWeight:800,color:"#F0EDE8",whiteSpace:"nowrap",pointerEvents:"none",boxShadow:"0 6px 20px rgba(0,0,0,0.5)",zIndex:5}}>
          <span style={{color}}>{fmtV(vals[hover])}{unit}</span>
        </div>
      )}
    </div>
  );
}

function WaterGlass({ml, goal, size=110}){
  const pct=Math.min(ml/Math.max(goal,1)*100,100);
  const full=pct>=100;
  const [splash,setSplash]=useState(false);
  const prevMl=useRef(ml);
  useEffect(()=>{
    if(ml>prevMl.current){setSplash(true);const t=setTimeout(()=>setSplash(false),900);prevMl.current=ml;return()=>clearTimeout(t);}
    prevMl.current=ml;
  },[ml]);
  // Bläschen: feste Konfiguration (Position, Größe, Timing), damit sie ruhig wirken
  const bubbles=[[22,4,2.6,0],[45,3,3.4,0.8],[68,5,2.9,1.6],[34,2.5,3.8,2.2],[58,3.5,3.1,0.4]];
  return (
    <div style={{position:"relative",flexShrink:0}}>
      {full&&<div style={{position:"absolute",inset:-8,borderRadius:"50%",background:"#FFD166",opacity:0.14,filter:"blur(16px)",animation:"pulse 2.4s ease-in-out infinite"}}/>}
      <div style={{width:size*0.68, height:size, position:"relative", flexShrink:0, clipPath:"polygon(12% 3%, 88% 3%, 78% 97%, 22% 97%)"}}>
        <div style={{position:"absolute", inset:0, background:"linear-gradient(135deg, rgba(255,255,255,0.07) 0%, rgba(255,255,255,0.01) 100%)", border:"2.5px solid rgba(255,255,255,0.22)"}}/>
        <div style={{position:"absolute", left:0, right:0, bottom:0, height:`${pct}%`, overflow:"hidden", transition:"height 0.6s cubic-bezier(0.16,1,0.3,1)"}}>
          <div style={{position:"absolute", inset:0, background:full?"linear-gradient(180deg, #7DF3D9 0%, #06D6A0 55%, #0A9B76 100%)":"linear-gradient(180deg, #67E8F9 0%, #2196F3 55%, #1565C0 100%)", transition:"background 0.6s"}}/>
          {/* Schimmer-Streifen im Wasser */}
          <div style={{position:"absolute", top:0, bottom:0, width:"40%", background:"linear-gradient(105deg, transparent 0%, rgba(255,255,255,0.18) 50%, transparent 100%)", animation:"waterShimmer 3.6s ease-in-out infinite"}}/>
          {/* Aufsteigende Bläschen */}
          {bubbles.map(([x,bs,dur,del],i)=>(
            <div key={i} style={{position:"absolute", left:`${x}%`, bottom:-8, width:bs, height:bs, borderRadius:"50%", background:"rgba(255,255,255,0.55)", animation:`bubbleRise ${dur}s ease-in ${del}s infinite`}}/>
          ))}
          <div style={{position:"absolute", top:-7, left:"-30%", width:"160%", height:splash?26:18, borderRadius:"45%", background:"rgba(255,255,255,0.4)", animation:`waterWave ${splash?1.1:3.2}s ease-in-out infinite`, transition:"height 0.3s"}}/>
          <div style={{position:"absolute", top:-4, left:"-30%", width:"160%", height:splash?24:18, borderRadius:"42%", background:"rgba(255,255,255,0.22)", animation:`waterWave ${splash?1.4:4.1}s ease-in-out infinite reverse`, transition:"height 0.3s"}}/>
        </div>
        {/* Splash-Tropfen beim Hinzufügen */}
        {splash&&[[30,0],[52,0.12],[70,0.05]].map(([x,d],i)=>(
          <div key={i} style={{position:"absolute", left:`${x}%`, top:`${Math.max(0,92-pct)}%`, width:5, height:5, borderRadius:"50%", background:"#67E8F9", animation:`splashDrop 0.7s ease-out ${d}s both`}}/>
        ))}
        <div style={{position:"absolute", top:"10%", left:"15%", width:"8%", height:"60%", background:"linear-gradient(180deg, rgba(255,255,255,0.45), rgba(255,255,255,0))", borderRadius:6}}/>
        <div style={{position:"absolute", inset:0, display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", fontWeight:800, fontSize:size*0.13, color:"#fff", textShadow:"0 1px 4px rgba(0,0,0,0.8)"}}>
          <span key={Math.round(pct)} style={{animation:"popIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both"}}>{full?"🎉":`${Math.round(pct)}%`}</span>
        </div>
      </div>
    </div>
  );
}

  const deserializeFirestoreValue = (val) => {
    if (!val || typeof val !== 'object') return val;
    if ('stringValue' in val) return val.stringValue;
    if ('integerValue' in val) return parseInt(val.integerValue, 10);
    if ('doubleValue' in val) return parseFloat(val.doubleValue);
    if ('booleanValue' in val) return val.booleanValue;
    if ('nullValue' in val) return null;
    if ('timestampValue' in val) return val.timestampValue;
    if ('arrayValue' in val) {
      const arr = val.arrayValue.values || [];
      return arr.map(item => deserializeFirestoreValue(item));
    }
    if ('mapValue' in val) {
      const fields = val.mapValue.fields || {};
      const res = {};
      for (const k in fields) {
        res[k] = deserializeFirestoreValue(fields[k]);
      }
      return res;
    }
    return val;
  };

  const extractWorkoutsFromAnyObject = (obj) => {
    const workouts = [];
    const plans = [];
    const weightHistory = [];
    const visited = new Set();

    const recurse = (val) => {
      if (!val || typeof val !== 'object') {
        if (typeof val === 'string' && val.length > 20) {
          const trimmed = val.trim();
          if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
            try {
              const parsed = JSON.parse(val);
              recurse(parsed);
            } catch(e) {}
          }
        }
        return;
      }
      if (visited.has(val)) return;
      visited.add(val);

      if (val.mapValue && val.mapValue.fields) {
        recurse(val.mapValue.fields);
        return;
      }
      if (val.arrayValue && val.arrayValue.values) {
        recurse(val.arrayValue.values);
        return;
      }
      if (val.stringValue) {
        recurse(val.stringValue);
        return;
      }

      // Check if workout
      if (val.id && val.date && (val.exercises || Array.isArray(val.exercises))) {
        const deserialized = deserializeFirestoreValue(val);
        if (deserialized && deserialized.id && deserialized.date) {
          workouts.push(deserialized);
        }
      }

      // Check if plan
      if (val.id && val.name && Array.isArray(val.exercises) && 'color' in val && !val.date) {
        const deserialized = deserializeFirestoreValue(val);
        if (deserialized && deserialized.id && deserialized.name) {
          plans.push(deserialized);
        }
      }

      // Check if weight
      if (val.date && ('weight' in val || 'weightValue' in val) && !val.exercises && !val.id) {
        const deserialized = deserializeFirestoreValue(val);
        if (deserialized && deserialized.date && deserialized.weight) {
          weightHistory.push(deserialized);
        }
      }

      if (Array.isArray(val)) {
        val.forEach(item => recurse(item));
      } else {
        for (const k in val) {
          if (k === 'workouts' && Array.isArray(val[k])) {
            val[k].forEach(item => {
              const deserialized = deserializeFirestoreValue(item);
              if (deserialized && deserialized.id && deserialized.date) {
                workouts.push(deserialized);
              } else {
                recurse(item);
              }
            });
          } else if (k === 'plans' && Array.isArray(val[k])) {
            val[k].forEach(item => {
              const deserialized = deserializeFirestoreValue(item);
              if (deserialized && deserialized.id && deserialized.name) {
                plans.push(deserialized);
              } else {
                recurse(item);
              }
            });
          } else if (k === 'weightHistory' && Array.isArray(val[k])) {
            val[k].forEach(item => {
              const deserialized = deserializeFirestoreValue(item);
              if (deserialized && deserialized.date && deserialized.weight) {
                weightHistory.push(deserialized);
              } else {
                recurse(item);
              }
            });
          } else {
            recurse(val[k]);
          }
        }
      }
    };

    recurse(obj);
    return { workouts, plans, weightHistory };
  };

  const addRescueLog = (msg) => {

  const performDeepRescueScan = async () => {
    setRescueScanProgress("scanning");
    setRescueLog([]);
    setRescuedWorkouts([]);
    setRescuedPlans([]);
    setRescuedWeight([]);
    addRescueLog("Starte Tiefensuche...");

    let allWorkouts = [];
    let allPlans = [];
    let allWeight = [];

    // 1. Scan LocalStorage
    addRescueLog("Durchsuche LocalStorage...");
    let lsCount = 0;
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        if (!key) continue;
        const val = localStorage.getItem(key);
        if (val) {
          try {
            const parsed = JSON.parse(val);
            const { workouts, plans, weightHistory } = extractWorkoutsFromAnyObject(parsed);
            if (workouts.length > 0) {
              allWorkouts = [...allWorkouts, ...workouts];
              lsCount += workouts.length;
            }
            if (plans.length > 0) allPlans = [...allPlans, ...plans];
            if (weightHistory.length > 0) allWeight = [...allWeight, ...weightHistory];
          } catch(e) {
            if (val.trim().startsWith('{') || val.trim().startsWith('[')) {
              try {
                const parsed = JSON.parse(val);
                const { workouts, plans, weightHistory } = extractWorkoutsFromAnyObject(parsed);
                if (workouts.length > 0) {
                  allWorkouts = [...allWorkouts, ...workouts];
                  lsCount += workouts.length;
                }
                if (plans.length > 0) allPlans = [...allPlans, ...plans];
                if (weightHistory.length > 0) allWeight = [...allWeight, ...weightHistory];
              } catch(e2) {}
            }
          }
        }
      }
      addRescueLog(`LocalStorage-Suche abgeschlossen. ${lsCount} Workouts gefunden.`);
    } catch(err) {
      addRescueLog(`Fehler beim LocalStorage-Scan: ${err.message}`);
    }

    // 2. Scan IndexedDB
    addRescueLog("Durchsuche IndexedDB-Datenbanken...");
    try {
      let dbNames = ["firestore/[default]/mircos-app/main"];
      if (window.indexedDB && window.indexedDB.databases) {
        const dbs = await window.indexedDB.databases();
        dbNames = dbs.map(d => d.name).filter(Boolean);
        if (!dbNames.includes("firestore/[default]/mircos-app/main")) {
          dbNames.push("firestore/[default]/mircos-app/main");
        }
      }

      for (const dbName of dbNames) {
        addRescueLog(`Öffne DB: ${dbName}...`);
        try {
          const db = await new Promise((resolve, reject) => {
            const req = window.indexedDB.open(dbName);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
            req.onblocked = () => reject(new Error("Blocked"));
          });

          const stores = Array.from(db.objectStoreNames);
          for (const storeName of stores) {
            addRescueLog(`Lese Store: ${storeName}...`);
            try {
              const tx = db.transaction(storeName, "readonly");
              const store = tx.objectStore(storeName);
              const records = await new Promise((resolve, reject) => {
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
              });

              let storeWoCount = 0;
              for (const record of records) {
                const { workouts, plans, weightHistory } = extractWorkoutsFromAnyObject(record);
                if (workouts.length > 0) {
                  allWorkouts = [...allWorkouts, ...workouts];
                  storeWoCount += workouts.length;
                }
                if (plans.length > 0) allPlans = [...allPlans, ...plans];
                if (weightHistory.length > 0) allWeight = [...allWeight, ...weightHistory];
              }
              if (storeWoCount > 0) {
                addRescueLog(`-> ${storeWoCount} Workouts in ${storeName} gefunden.`);
              }
            } catch(e) {
              addRescueLog(`Fehler beim Lesen von Store ${storeName}: ${e.message}`);
            }
          }
          db.close();
        } catch(e) {
          addRescueLog(`Konnte DB ${dbName} nicht öffnen/scannen: ${e.message}`);
        }
      }
    } catch(err) {
      addRescueLog(`Fehler beim IndexedDB-Scan: ${err.message}`);
    }

    addRescueLog("Filtere Duplikate...");
    const uniqueWorkouts = [];
    const woSeen = new Set();
    allWorkouts.forEach(w => {
      if (w && w.id && !woSeen.has(w.id)) {
        woSeen.add(w.id);
        uniqueWorkouts.push(w);
      }
    });
    uniqueWorkouts.sort((a, b) => new Date(a.date) - new Date(b.date));

    const uniquePlans = [];
    const planSeen = new Set();
    allPlans.forEach(p => {
      if (p && p.id && !planSeen.has(p.id)) {
        planSeen.add(p.id);
        uniquePlans.push(p);
      }
    });

    const uniqueWeight = [];
    const weightSeen = new Set();
    allWeight.forEach(wh => {
      if (wh && wh.date && !weightSeen.has(wh.date)) {
        weightSeen.add(wh.date);
        uniqueWeight.push(wh);
      }
    });
    uniqueWeight.sort((a, b) => new Date(a.date) - new Date(b.date));

    setRescuedWorkouts(uniqueWorkouts);
    setRescuedPlans(uniquePlans);
    setRescuedWeight(uniqueWeight);
    setRescueScanProgress("done");
    addRescueLog(`Suche abgeschlossen! ${uniqueWorkouts.length} Workouts, ${uniquePlans.length} Pläne, ${uniqueWeight.length} Gewichtseinträge gefunden.`);
  };

  const executeRescueMerge = () => {
    if (!authUser) return;
    try {
      let updatedData = { ...data };
      let restoredCount = 0;
      let restoredPlans = 0;
      let restoredWeights = 0;

      rescuedWorkouts.forEach(w => {
        const exists = updatedData.workouts.some(existing => existing.id === w.id);
        if (!exists) {
          updatedData.workouts.push(w);
          restoredCount++;
        }
      });
      if (restoredCount > 0) updatedData.workouts.sort((a,b) => new Date(a.date) - new Date(b.date));

      rescuedPlans.forEach(p => {
        const exists = updatedData.plans.some(existing => existing.id === p.id);
        if (!exists) {
          updatedData.plans.push(p);
          restoredPlans++;
        } else {
          const existingIdx = updatedData.plans.findIndex(e => e.id === p.id);
          if (existingIdx !== -1 && JSON.stringify(updatedData.plans[existingIdx]) !== JSON.stringify(p)) {
             updatedData.plans[existingIdx] = p;
             restoredPlans++;
          }
        }
      });

      rescuedWeight.forEach(wh => {
         const exists = (updatedData.weightHistory||[]).some(existing => existing.date === wh.date);
         if (!exists) {
            updatedData.weightHistory = updatedData.weightHistory || [];
            updatedData.weightHistory.push(wh);
            restoredWeights++;
         }
      });
      if (updatedData.weightHistory) updatedData.weightHistory.sort((a,b) => new Date(a.date) - new Date(b.date));

      if (restoredCount > 0 || restoredPlans > 0 || restoredWeights > 0) {
        setData(purgeDemoData(updatedData));

      showToast(`Rettung abgeschlossen! ${restoredCount} Workouts, ${restoredPlans} Pläne & ${restoredWeights} Gewichte importiert.`);
      setRescueModalOpen(false);

      showToast("Fehler bei Zusammenführung: " + err.message, "error");

  const mergeData = (local, remote) => {
    if (!local) return remote;
    if (!remote) return local;

    // Tombstones: an id/date deleted on EITHER side must stay deleted, even though
    // simple union-merging below would otherwise resurrect it from the other side.
    const deletedPlanIds = [...new Set([...(local.deletedPlanIds||[]), ...(remote.deletedPlanIds||[])])];
    const deletedWorkoutIds = [...new Set([...(local.deletedWorkoutIds||[]), ...(remote.deletedWorkoutIds||[])])];
    const deletedWeightDates = [...new Set([...(local.deletedWeightDates||[]), ...(remote.deletedWeightDates||[])])];

    const mergedWorkouts = [...(local.workouts || [])];
    (remote.workouts || []).forEach(rw => {
      if (rw && rw.id) {
        const exists = mergedWorkouts.some(lw => lw.id === rw.id);
        if (!exists) {
          mergedWorkouts.push(rw);
        }
      }
    });
    const filteredWorkouts = mergedWorkouts.filter(w => !deletedWorkoutIds.includes(w.id));
    filteredWorkouts.sort((a, b) => new Date(a.date) - new Date(b.date));

    const mergedPlans = [...(local.plans || [])];
    (remote.plans || []).forEach(rp => {
      if (rp && rp.id) {
        const exists = mergedPlans.some(lp => lp.id === rp.id);
        if (!exists) {
          mergedPlans.push(rp);
        } else {
          const localIdx = mergedPlans.findIndex(lp => lp.id === rp.id);
          const localPlan = mergedPlans[localIdx];
          
          const rpTime = rp.updatedAt || 0;
          const lpTime = localPlan.updatedAt || 0;
          
          if (rpTime > lpTime) {
            // Remote is newer - take remote, but preserve local photos if remote lacks them
            const mergedEx = (rp.exercises || []).map((re, idx) => {
              const le = localPlan.exercises?.[idx];
              if (le && le.name === re.name && le.photo && !re.photo) {
                return { ...re, photo: le.photo };
              }
              return re;
            });
            mergedPlans[localIdx] = { ...rp, exercises: mergedEx, updatedAt: rpTime };
          } else {
            // Local is newer or same - keep local, but pull remote photos if local lacks them
            const mergedEx = (localPlan.exercises || []).map((le, idx) => {
              const re = rp.exercises?.[idx];
              if (re && re.name === le.name && re.photo && !le.photo) {
                return { ...le, photo: re.photo };
              }
              return le;
            });
            mergedPlans[localIdx] = { ...localPlan, exercises: mergedEx, updatedAt: Math.max(lpTime, rpTime) };
          }
        }
      }
    });
    const filteredPlans = mergedPlans.filter(p => !deletedPlanIds.includes(p.id));

    const mergedWeightHistory = [...(local.weightHistory || [])];
    (remote.weightHistory || []).forEach(rw => {
      if (rw && rw.date) {
        const exists = mergedWeightHistory.some(lw => lw.date === rw.date);
        if (!exists) {
          mergedWeightHistory.push(rw);
        }
      }
    });
    const filteredWeightHistory = mergedWeightHistory.filter(h => !deletedWeightDates.includes(h.date));
    filteredWeightHistory.sort((a, b) => new Date(a.date) - new Date(b.date));

    return purgeDemoData({
      ...local,
      workouts: filteredWorkouts,
      plans: filteredPlans,

  const cMealEntries = cDayEntries.filter(e=>e.type==="meal");
  const mealPlanFor = mt => cMealEntries.find(e=>e.mealPreset===mt || (mt==="Snack" && (e.mealPreset==="Pre-Workout" || e.mealPreset==="Post-Workout")));

  const cStretchEntry = cDayEntries.find(e=>e.type==="stretching");
  const stretchingDoneToday = !!nutrition[checklistToday]?.stretchingDone ||
    data.workouts.some(w => {
      if(w.date !== checklistToday) return false;
      const wp = data.plans.find(p => String(p.id) === String(w.planId));
      return wp && (wp.types||[]).some(t => t === "Mobility / Beweglichkeit" || t === "Stretching / Dehnen");
    });
  const toggleStretchingToday = () => {
    setNutrition(n=>{
      const d = n[checklistToday] || {calories:0,protein:0,carbs:0,fat:0,meals:[],waterLog:[],supplementsTaken:[]};
      return {...n, [checklistToday]: {...d, stretchingDone: !d.stretchingDone}};
    });
  };

  const todaysSupplements = (user.supplements||[]).filter(sp=>(sp.days||[]).includes(cTodayFull));
  const supplementItems = todaysSupplements.length>0
    ? todaysSupplements.map(sp=>({key:"supp-"+sp.id, group:"supplement", done:todaysSupplementsTaken.includes(sp.id), label:sp.amount?`${sp.name} · ${sp.amount}`:sp.name, supplementId:sp.id}))
    : [{key:"supp-generic", group:"supplement", done:todaysSupplementsTaken.includes("generic"), label:"Supplements eingenommen", supplementId:"generic"}];

  const checklist = [
    {key:"weight", group:"weight", done:weightDoneToday, label:"Gewicht eintragen", onView:"fortschritt"},
    ...CHECKIN_MEAL_TYPES.map((mt,i)=>{
      const planned = mealPlanFor(mt);
      return {key:"meal-"+mt, group:"meal", done:mealTypesDoneToday[i], label: planned ? `${mt}: ${planned.mealName||planned.mealPreset}` : mt, time: planned?.startTime||null, mealType:mt, onView:"nutrition"};
    }),
    {key:"training", group:"training", done:trainingDoneToday, label:cTrainingPlanName?`Training: ${cTrainingPlanName}`:"Training absolvieren", time:cTrainingTime, planId:cTrainingPlanId, onView:"log"},
    {key:"stretching", group:"stretching", done:stretchingDoneToday, label:cStretchEntry?.stretchName?`Dehnen: ${cStretchEntry.stretchName}`:"Dehnen / Stretching", time:cStretchEntry?.startTime||null},
    ...supplementItems
  ];

  useEffect(()=>{
    if(!loaded || !authUser) return;
    if(checklist.every(c=>c.done)) return;
    if(user.checkinEveryLogin){
      setCheckinModalOpen(true);
      return;
    }
    const lastShown = ls("checkin_last_shown", null);
    if(lastShown===checklistToday) return;
    localStorage.setItem("ff_checkin_last_shown", JSON.stringify(checklistToday));
    setCheckinModalOpen(true);
  }, [loaded, authUser]);

  // Öffentliches Profil (userProfiles) automatisch aktuell halten, damit Freunde
  // einen auch finden können, ohne dass man extra im Profil auf Speichern klicken muss.
  // Debounced + dedupliziert, damit das nicht bei jedem Render/Sync erneut schreibt
  // (sonst können sich bei wackliger Verbindung Firestore-Writes aufstauen).
  useEffect(()=>{
    if(!loaded || !authUser) return;
    const key = JSON.stringify([user.username||"", user.email||authUser.email||"", user.firstName||"", user.lastName||""]);
    if(profileSyncKeyRef.current===key) return;
    if(profileSyncTimerRef.current) clearTimeout(profileSyncTimerRef.current);
    profileSyncTimerRef.current=setTimeout(()=>{
      (async()=>{
        const profile = await upsertUserProfile(authUser.uid, {...user, email: user.email || authUser.email || ""}).catch(e=>{
          if(window.dbg) dbg(`❌ Öffentliches Profil konnte nicht gespeichert werden: ${e.message}`, '#f55');
          return null;
        });
        if(!profile){return;} // Fehlgeschlagen – Key NICHT setzen, damit es beim nächsten Sync erneut versucht wird.
        profileSyncKeyRef.current=key;
        if(window.dbg) dbg(`👤 Öffentliches Profil synchronisiert: ${profile.username||profile.email||authUser.uid}`, '#0f0');
        const result = await processPendingReferral(authUser.uid, profile).catch(()=>null);
        if(result?.type==="requested") showToast(`Freundschaftsanfrage an ${result.profile.username||result.profile.email} gesendet! 🤝`);
        if(result?.type==="accepted") showToast(`Du bist jetzt mit ${result.profile.username||result.profile.email} befreundet! 🎉`);
      })();
    },1500);
    return ()=>{if(profileSyncTimerRef.current)clearTimeout(profileSyncTimerRef.current);};
  }, [loaded, authUser, user.username, user.email, user.firstName, user.lastName]);

  // Data is loaded from LocalStorage immediately to show something to the user.
  // 'loaded' will be set to true only when we've established a real-time connection with Firestore.


  const lastSyncRef = useRef({});

  // ── Auth state listener & Real-time Listeners ─────────────────────────────
  useEffect(() => {
    let unsubs = [];
    let cancelled = false;

    const setupListeners = (fbUser) => {
      if (cancelled) return;
      setAuthUser(fbUser);
      setAuthLoading(false);

      if (fbUser) {
        const uid = fbUser.uid;
        if (window.dbg) dbg('👤 Nutzer eingeloggt: ' + fbUser.email, '#0f0');
        
        lastSyncRef.current = {};
        // Reset loaded keys tracker for this user session
        Object.keys(loadedKeysRef.current).forEach(k => {
          loadedKeysRef.current[k] = false;
        });

        const privateKeys = [
          { key: "data", setter: setData, df: defaultData },
          { key: "photos", setter: (val) => setData(prev => ({ ...prev, photos: val || [] })), df: [] },
          { key: "exercisePhotos", setter: (val) => setData(prev => ({ ...prev, exercisePhotos: val || {} })), df: {} },
          { key: "user", setter: setUser, df: defaultUser },
          { key: "prs", setter: setPrs, df: defaultPRs },
          { key: "nutrition", setter: setNutrition, df: {} },
          { key: "weekPlans", setter: setWeekPlans, df: {} },
          { key: "favFoods", setter: setFavFoods, df: [] }
        ];

        // 1. Initial State Sync: Load user-specific cache OR Reset immediately
        privateKeys.forEach(({ key, setter, df }) => {
          const local = localStorage.getItem(`ff_${uid}_${key}`);
          if (local) {
             let parsed = JSON.parse(local);
             // Alte Demo-Einträge aus dem Geräte-Cache entfernen, bevor sie in den Merge laufen
             if (key === "data") parsed = purgeDemoData(parsed);
             if (key === "prs") parsed = purgeDemoPRs(parsed);
             const parsedStr = JSON.stringify(parsed);
             if (parsedStr !== local) localStorage.setItem(`ff_${uid}_${key}`, parsedStr);
             lastSyncRef.current[key] = parsedStr;
             setter(parsed);
          } else {
             // CRITICAL: If no cache for THIS user, clear any previous user's data
             setter(df);
             lastSyncRef.current[key] = JSON.stringify(df);
          }
        });

        // 1.5 Run Startup Migration for inline photos on local storage cache
        const localDataStr = localStorage.getItem(`ff_${uid}_data`);
        if (localDataStr) {
          try {
            const cacheData = JSON.parse(localDataStr);
            const localExPhotosStr = localStorage.getItem(`ff_${uid}_exercisePhotos`) || "{}";
            const exPhotos = JSON.parse(localExPhotosStr);
            let changed = false;
            
            if (cacheData && Array.isArray(cacheData.plans)) {
              cacheData.plans.forEach(plan => {
                if (plan && Array.isArray(plan.exercises)) {
                  plan.exercises.forEach((ex, idx) => {
                    if (ex && ex.photo && ex.photo.startsWith("data:")) {
                      const photoId = `ex_${plan.id}_${idx}_${Date.now()}`;
                      exPhotos[photoId] = ex.photo;
                      ex.photo = photoId;
                      plan.updatedAt = Date.now();
                      changed = true;
                    }
                  });
                }
              });
            }
            
            if (changed) {
              cacheData.exercisePhotos = exPhotos;
              const migratedDataStr = JSON.stringify(cacheData);
              const migratedExPhotosStr = JSON.stringify(exPhotos);
              
              localStorage.setItem(`ff_${uid}_data`, migratedDataStr);
              localStorage.setItem(`ff_${uid}_exercisePhotos`, migratedExPhotosStr);
              
              lastSyncRef.current["data"] = migratedDataStr;
              lastSyncRef.current["exercisePhotos"] = migratedExPhotosStr;
              
              setData(cacheData);
            }
          } catch(e) {
            console.error("Migration error:", e);
          }
        }

        // 2. Setup Private Realtime Listeners
        privateKeys.forEach(({ key, setter, df }) => {
          const ref = window.firebaseDoc(window.firebaseDb, "fitforge", `${uid}_${key}`);
          const unsub = window.firebaseOnSnapshot(ref, (snap) => {
            if (cancelled) return;
            
            // Mark key as loaded
            loadedKeysRef.current[key] = true;
            
            // If all keys are loaded, signal globally ready
            const allLoaded = Object.values(loadedKeysRef.current).every(v => v);
            if (allLoaded && !loaded) {
              setLoaded(true);
            }

            if (snap.exists) {
              const cloudVal = snap.data().value;
              const cloudStr = JSON.stringify(cloudVal);
              if (cloudStr !== lastSyncRef.current[key]) {
                if (window.dbg) dbg(`📥 Snapshot empfangen für ${key}`, '#a8f');
                // Perform safe merging for specific keys to prevent overwriting local offline progress
                if (key === "data") {
                  setData(prevLocal => {
                    const merged = mergeData(prevLocal, cloudVal);
                    const withPhotos = { ...merged, photos: prevLocal.photos || [], exercisePhotos: prevLocal.exercisePhotos || {} };
                    localStorage.setItem(`ff_${uid}_data`, JSON.stringify(withPhotos));
                    // KRITISCH: lastSyncRef EXAKT so serialisieren wie syncToCloud("data")
                    // schreibt (ohne photos/exercisePhotos, base64-gestrippt). Sonst hält
                    // syncToCloud die eben empfangenen Cloud-Daten für neu und lädt sie
                    // sofort wieder hoch → Endlos-Schreibschleife, die die Firestore-
                    // Warteschlange verstopft und ALLE weiteren Writes blockiert.
                    const { photos: _p, exercisePhotos: _e, ...dataNoPhotos } = withPhotos;
                    lastSyncRef.current["data"] = JSON.stringify(stripBase64(dataNoPhotos, "data"));
                    return withPhotos;
                  });
                } else if (key === "photos") {
                  setData(prevLocal => {
                    localStorage.setItem(`ff_${uid}_photos`, cloudStr);
                    lastSyncRef.current["photos"] = cloudStr;
                    return { ...prevLocal, photos: cloudVal || [] };
                  });
                } else if (key === "exercisePhotos") {
                  setData(prevLocal => {
                    localStorage.setItem(`ff_${uid}_exercisePhotos`, cloudStr);
                    lastSyncRef.current["exercisePhotos"] = cloudStr;
                    return { ...prevLocal, exercisePhotos: cloudVal || {} };
                  });
                } else if (key === "user") {
                  setUser(prevLocal => {
                    const merged = { ...prevLocal, ...cloudVal };
                    const mergedStr = JSON.stringify(merged);
                    localStorage.setItem(`ff_${uid}_user`, mergedStr);
                    lastSyncRef.current["user"] = mergedStr;
                    return merged;
                  });
                } else if (key === "prs") {
                  setPrs(prevLocal => {
                    const merged = purgeDemoPRs({ ...prevLocal, ...cloudVal });
                    const mergedStr = JSON.stringify(merged);
                    localStorage.setItem(`ff_${uid}_prs`, mergedStr);
                    lastSyncRef.current["prs"] = mergedStr;
                    return merged;
                  });
                } else if (key === "nutrition") {
                  setNutrition(prevLocal => {
                    const merged = { ...prevLocal, ...cloudVal };
                    const mergedStr = JSON.stringify(merged);
                    localStorage.setItem(`ff_${uid}_nutrition`, mergedStr);
                    lastSyncRef.current["nutrition"] = mergedStr;
                    return merged;
                  });
                } else if (key === "weekPlans") {
                  setWeekPlans(prevLocal => {
                    const merged = { ...prevLocal, ...cloudVal };
                    const mergedStr = JSON.stringify(merged);
                    localStorage.setItem(`ff_${uid}_weekPlans`, mergedStr);
                    lastSyncRef.current["weekPlans"] = mergedStr;
                    return merged;
                  });
                } else {
                  localStorage.setItem(`ff_${uid}_${key}`, cloudStr);
                  lastSyncRef.current[key] = cloudStr;
                  setter(cloudVal);
                }
              }
            } else {
              // CRITICAL: Document does not exist in cloud (new user or missing document)
              if (window.dbg) dbg(`ℹ️ ${key} leer in Cloud (Neuer Account oder noch nicht angelegt)`, '#aaa');
              
              // If we already have local cache loaded in step 1, DO NOT delete it.
              // Instead, we keep it and we will sync it up to the cloud.
              const localValStr = localStorage.getItem(`ff_${uid}_${key}`);
              if (localValStr) {
                // Set lastSyncRef to df so syncToCloud will detect a difference and push our local data to the cloud
                lastSyncRef.current[key] = JSON.stringify(df);
              } else {
                setter(df);
                lastSyncRef.current[key] = JSON.stringify(df);
              }
            }
          }, (err) => {
            if (cancelled) return;
            if (window.dbg) dbg(`❌ Snapshot Fehler für ${key}: ${err.message}`, '#f55');
            console.error(`Firebase snapshot error for ${key}:`, err);
            
            // Mark key as loaded on error to allow local caching and saving
            loadedKeysRef.current[key] = true;
            const allLoaded = Object.values(loadedKeysRef.current).every(v => v);
            if (allLoaded && !loaded) {
              setLoaded(true);
            }
          });
          unsubs.push(unsub);
        });
      } else {
        if (window.dbg) dbg('🚪 Nutzer ausgeloggt', '#ff0');
        setLoaded(false);
        // Reset loaded tracker on logout
        Object.keys(loadedKeysRef.current).forEach(k => {
          loadedKeysRef.current[k] = false;
        });
        unsubs.forEach(fn => fn());
        unsubs = [];
        // Reset private state on logout
        setData(defaultData);
        setUser(defaultUser);
        setPrs(defaultPRs);
        setNutrition({});
        setWeekPlans({});
        setFavFoods([]);
        lastSyncRef.current = {};
      }

      // ── Shared Library Listener (Always active) ───────────────────────────
      const libRef = window.firebaseDoc(window.firebaseDb, "fitforge", "shared_library");
      const libUnsub = window.firebaseOnSnapshot(libRef, (snap) => {
        if (cancelled) return;
        if (snap.exists) {
            const libVal = snap.data().value || [];
            const libStr = JSON.stringify(libVal);
            if (libStr !== lastSyncRef.current["library"]) {
              if (window.dbg) dbg('📚 Gemeinsame Bibliothek empfangen – wird zusammengeführt', '#0ff');
              // NICHT blind überschreiben: lokale (noch nicht synchronisierte) Übungen
              // bewahren, gelöschte per Tombstone ausschließen, bei Konflikt die
              // neuere Version (per _m Zeitstempel) nehmen.
              setLibrary(prevLocal => {
                let deleted; try { deleted = new Set(JSON.parse(localStorage.getItem("ff_lib_deleted")||"[]")); } catch(e){ deleted = new Set(); }
                const pick = (a,b) => (((b&&b._m)||0) >= ((a&&a._m)||0) ? b : a);
                const byId = new Map();
                libVal.forEach(ex => { if(ex&&ex.id!=null&&!deleted.has(ex.id)) byId.set(ex.id, ex); });
                (prevLocal||[]).forEach(ex => { if(!ex||ex.id==null||deleted.has(ex.id)) return; byId.set(ex.id, byId.has(ex.id)?pick(byId.get(ex.id),ex):ex); });
                const merged = [...byId.values()];
                localStorage.setItem("ff_library", JSON.stringify(merged));
                return merged;
              });
              // Cloud-Stand als Basis merken; falls das Merge lokale Zusätze enthält,
              // erkennt der Sync-Effekt die Differenz und schiebt die Vereinigung hoch.
              lastSyncRef.current["library"] = libStr;
            }
        }
        if (!loaded && fbUser) {
          // Verify that all private keys are also loaded before setting loaded=true
          const allPrivateLoaded = Object.values(loadedKeysRef.current).every(v => v);
          if (allPrivateLoaded) setLoaded(true);
        }
      }, (err) => {
        if (window.dbg) dbg('❌ Library Fehler: ' + err.message, '#f55');
        if (!loaded && fbUser) {
          const allPrivateLoaded = Object.values(loadedKeysRef.current).every(v => v);
          if (allPrivateLoaded) setLoaded(true);
        }
      });
      unsubs.push(libUnsub);
    };

    const attachAuth = () => {
      if (cancelled) return;
      if (window.firebaseOnAuthStateChanged) {
        window.firebaseOnAuthStateChanged(setupListeners);
      } else {
        setTimeout(attachAuth, 100);
      }
    };

    const onReady = () => attachAuth();
    window.addEventListener('firebaseReady', onReady);
    if (window.firebaseReady) attachAuth();

    // Safety timeout: if after 15 seconds still no snapshots, assume ready to write
    const t = setTimeout(() => {
      if (!cancelled && authLoading) {
        setAuthLoading(false);
      }
      if (!cancelled && !loaded && authUser) {
        if (window.dbg) dbg('⚠️ Sync Timeout - starte Schreibmodus', '#f80');
        // Force all keys to loaded so syncToCloud can save to localStorage
        Object.keys(loadedKeysRef.current).forEach(k => {
          loadedKeysRef.current[k] = true;
        });
        setLoaded(true);
      }
    }, 15000);

    return () => {
      cancelled = true;
      window.removeEventListener('firebaseReady', onReady);
      clearTimeout(t);
      unsubs.forEach(fn => fn());
    };
  }, []);

  // ── Sync to Firestore on local change (debounced) ────────────────────────
  const debRef = useRef({});
  const syncToCloud = (key, val) => {
    if (!authUser || !loaded) return;
    
    // Safety guard: only upload if this key has finished its initial load from Firestore
    if (!loadedKeysRef.current[key]) return;

    if (key === "data") {
      const { photos, exercisePhotos, ...dataWithoutPhotosAndExPhotos } = val;
      const cleanedData = stripBase64(dataWithoutPhotosAndExPhotos, "data");
      const dataStr = JSON.stringify(cleanedData);
      const valStr = JSON.stringify(val);
      
      // Safety check: Prevent overwriting richer cloud data with empty/smaller local data
      if (val && Array.isArray(val.workouts)) {
        try {
          const lastStr = lastSyncRef.current["data"] || localStorage.getItem(`ff_${authUser.uid}_data`);
          if (lastStr) {
            const lastVal = JSON.parse(lastStr);
            if (lastVal && Array.isArray(lastVal.workouts)) {
              // Absichtlich gelöschte Workouts (Tombstones) zählen nicht als "verloren"
              const tomb = new Set([...(val.deletedWorkoutIds||[]), ...(lastVal.deletedWorkoutIds||[])]);
              const lastRelevant = lastVal.workouts.filter(w => !tomb.has(w.id));
              if (lastRelevant.length > val.workouts.length) {
                console.warn(`Local data has fewer workouts (${val.workouts.length}) than last sync (${lastRelevant.length}). Merging...`);
                const merged = mergeData(val, lastVal);
                if (JSON.stringify(merged) !== valStr) {
                  setData(merged);
                  return;
                }
              }
            }
          }
        } catch(e) {}
      }

      const cleanedPhotos = stripBase64(photos, "photos");
      const photosStr = JSON.stringify(cleanedPhotos || []);
      
      const cleanedExPhotos = stripBase64(exercisePhotos, "exercisePhotos");
      const exPhotosStr = JSON.stringify(cleanedExPhotos || {});

      // Sync data without photos/exPhotos
      if (dataStr !== lastSyncRef.current["data"]) {
        clearTimeout(debRef.current["data"]);
        debRef.current["data"] = setTimeout(() => {
          if (window.dbg) {
            dbg(`📤 Synchronisiere data (Größe: ${(dataStr.length/1024).toFixed(1)} KB)...`, '#ff0');
          }
          fbSet("data", cleanedData).finally(() => {
            lastSyncRef.current["data"] = dataStr;
          });
        }, 300);
      }
      
      // Sync photos separately
      if (photosStr !== lastSyncRef.current["photos"] && loadedKeysRef.current["photos"]) {
        clearTimeout(debRef.current["photos"]);
        debRef.current["photos"] = setTimeout(() => {
          if (window.dbg) dbg(`📤 Synchronisiere photos (Größe: ${(photosStr.length/1024).toFixed(1)} KB)...`, '#ff0');
          fbSet("photos", cleanedPhotos || []).finally(() => {
            lastSyncRef.current["photos"] = photosStr;
          });
        }, 300);
      }

      // Sync exercisePhotos separately
      if (exPhotosStr !== lastSyncRef.current["exercisePhotos"] && loadedKeysRef.current["exercisePhotos"]) {
        clearTimeout(debRef.current["exercisePhotos"]);
        debRef.current["exercisePhotos"] = setTimeout(() => {
          if (window.dbg) dbg(`📤 Synchronisiere exercisePhotos (Größe: ${(exPhotosStr.length/1024).toFixed(1)} KB)...`, '#ff0');
          fbSet("exercisePhotos", cleanedExPhotos || {}).finally(() => {
            lastSyncRef.current["exercisePhotos"] = exPhotosStr;
          });
        }, 300);
      }
      return;
    }

    const valStr = JSON.stringify(val);
    
    // Skip if this change just came FROM the cloud
    if (valStr === lastSyncRef.current[key]) return;

    clearTimeout(debRef.current[key]);
    debRef.current[key] = setTimeout(() => {
      if (window.dbg) dbg(`📤 Synchronisiere ${key}...`, '#ff0');
      fbSet(key, val).finally(() => {
        lastSyncRef.current[key] = valStr;
      });
    }, 300);
  };

  useEffect(() => { syncToCloud("data", data); }, [data, loaded]);
  useEffect(() => { syncToCloud("user", user); }, [user, loaded]);
  useEffect(() => { syncToCloud("prs", prs); }, [prs, loaded]);
  useEffect(() => { syncToCloud("nutrition", nutrition); }, [nutrition, loaded]);
  useEffect(() => {
    // Library sync is shared
    if (!authUser || !loaded) return;
    const valStr = JSON.stringify(library);
    if (valStr === lastSyncRef.current["library"]) return;
    clearTimeout(debRef.current["library"]);
    debRef.current["library"] = setTimeout(async () => {
      if (window.dbg) dbg(`📤 Synchronisiere shared library...`, '#0ff');
      // WICHTIG: Große base64-Bilder rausfiltern, sonst sprengt das gemeinsame
      // Library-Dokument das 1-MB-Limit von Firestore und der Schreibvorgang
      // schlägt komplett fehl (= Übungen gehen verloren).
      const cleanedLib = stripBase64(library, "library");
      const cleanedStr = JSON.stringify(cleanedLib);
      const sizeKB = cleanedStr.length / 1024;
      if (sizeKB > 950) {
        if (window.dbg) dbg(`⚠️ Library zu groß (${sizeKB.toFixed(0)} KB) – Speichern könnte fehlschlagen!`, '#f55');
        showToast(`Achtung: Deine Übungsbibliothek ist sehr groß (${sizeKB.toFixed(0)} KB). Bitte weniger/kleinere Bilder verwenden, sonst kann nicht gespeichert werden.`, "error");
      }
      try {
        await window.firebaseSetDoc(window.firebaseDoc(window.firebaseDb, "fitforge", "shared_library"), { value: cleanedLib });
        // Auf echte Server-Bestätigung warten (Offline-Persistenz meldet sonst
        // schon "fertig", wenn nur lokal gespeichert wurde).
        try {
          await Promise.race([
            window.firebaseDb.waitForPendingWrites(),
            new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 12000))
          ]);
          lastSyncRef.current["library"] = valStr;
          if (window.dbg) dbg(`✅ Library auf Server bestätigt`, '#0f0');
        } catch (e) {
          if (window.dbg) dbg(`⏳ Library noch nicht zum Server bestätigt (Verbindung/Warteschlange)`, '#fa0');
        }
      } catch (e) {
        if (window.dbg) dbg(`❌ Library-Speichern fehlgeschlagen: ${e.message}`, '#f55');
        showToast(`Übungen konnten nicht online gespeichert werden: ${e.message}`, "error");
      }
    }, 500);
  }, [library, loaded]);
  useEffect(() => { syncToCloud("weekPlans", weekPlans); }, [weekPlans, loaded]);
  useEffect(() => { syncToCloud("favFoods", favFoods); }, [favFoods, loaded]);

  // ── Einmalige Migration: alte base64-Übungsbilder nach Firebase Storage ────
  // Vor dem Storage-Fix erstellte Übungen haben ihr Bild als base64 lokal. Das
  // wird beim Sync weggestrippt (→ auf anderen Geräten kein Bild). Hier laden wir
  // solche Bilder einmalig zu Storage hoch und ersetzen sie durch die URL, damit
  // sie geräteübergreifend erscheinen und komplett aus dem Dokument raus sind.
  const thumbMigratingRef = useRef(false);
  useEffect(() => {
    if (!loaded || !authUser || !window.firebaseStorage) return;
    if (thumbMigratingRef.current) return;
    const toMigrate = (library || []).filter(ex => ex && typeof ex.thumbnail === "string" && ex.thumbnail.startsWith("data:"));
    if (!toMigrate.length) return;
    thumbMigratingRef.current = true; // eine Migrations-Runde pro Session; Fehler werden beim nächsten Laden erneut versucht
    (async () => {
      if (window.dbg) dbg(`🖼️ Lade ${toMigrate.length} alte Übungsbilder zu Storage hoch…`, '#0ff');
      let ok = 0;
      for (const ex of toMigrate) {
        try {

  // ── Manueller Voll-Upload: schiebt ALLE lokalen Daten gezielt in die Cloud ──
  // und wartet auf echte Server-Bestätigung. Für den Fall, dass der automatische
  // Sync mal hakt oder ein Gerät noch lokale, nicht hochgeladene Daten hat.
  const forceUploadAll=async()=>{
    if(!authUser){showToast("Nicht eingeloggt – bitte zuerst anmelden.","error");return;}
    if(!window.firebaseDb){showToast("Keine Verbindung zur Datenbank.","error");return;}
    setUploadingAll(true);
    if(window.dbg) dbg("☁️ Manueller Voll-Upload gestartet…", '#0ff');
    try{
      const { photos, exercisePhotos, ...dataNoPhotos } = data;
      await Promise.all([
        fbSet("data", dataNoPhotos),
        fbSet("photos", photos || []),
        fbSet("exercisePhotos", exercisePhotos || {}),
        fbSet("user", user),
        fbSet("prs", prs),
        fbSet("nutrition", nutrition),
        fbSet("weekPlans", weekPlans),
        fbSet("favFoods", favFoods),
        window.firebaseSetDoc(window.firebaseDoc(window.firebaseDb, "fitforge", "shared_library"), { value: stripBase64(library, "library") })
      ]);
      let confirmed=true;
      try{
        await Promise.race([
          window.firebaseDb.waitForPendingWrites(),
          new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),20000))
        ]);
      }catch(e){confirmed=false;}
      if(confirmed){
        setLastUploadTime(Date.now());
        if(window.dbg) dbg("✅ Voll-Upload auf Server bestätigt", '#0f0');
        showToast("Alle deine Daten wurden zum Server hochgeladen! ✅");
      }else{
        if(window.dbg) dbg("⏳ Voll-Upload noch nicht vom Server bestätigt", '#fa0');

      }
    }catch(e){
      if(window.dbg) dbg(`❌ Voll-Upload fehlgeschlagen: ${e.message}`, '#f55');

    }
    setUploadingAll(false);
  };

  // ── Migration: Rückwirkende Forge Points ────────────────────────
  useEffect(() => {
    if (loaded && data && data.workouts) {
      let migrated = false;
      let totalEarned = 0;
      const updatedWorkouts = data.workouts.map(w => {
        if (!w.earnedPoints) {
          migrated = true;
          let pts = 100;
          let breakdown = { workout: 100, exercises: 0, sets: 0, prs: 0, volume: 0, distance: 0, duration: 0 };
          let vol = 0;
          let km = 0;
          const dur = parseInt(w.duration) || 0;

          if (!w.hiitMode) {
            (w.exercises||[]).forEach(ex => {
              breakdown.exercises += 20;
              pts += 20;
              (ex.sets||[]).forEach(s => {
                breakdown.sets += 10;
                pts += 10;
                vol += (parseFloat(s.weight)||0)*(parseFloat(s.reps)||0);
                km += (parseFloat(s.km)||0);
              });
            });
          } else {
             (w.exercises||[]).forEach(ex => {
                breakdown.exercises += 20;
                pts += 20;
             });
          }

          if (vol > 0) {
            const vPts = Math.floor(vol / 100);
            breakdown.volume = vPts;
            pts += vPts;
          }
          if (km > 0) {
            const dPts = Math.floor(km * 20);
            breakdown.distance = dPts;
            pts += dPts;
          }
          if (dur > 0) {
            const timePts = dur * 2;
            breakdown.duration = timePts;
            pts += timePts;
          }
          
          totalEarned += pts;
          return { ...w, earnedPoints: pts, ptsBreakdown: breakdown };
        }
        return w;
      });

        if (window.dbg) dbg("🔄 Migration: Rückwirkende Forge Points berechnet", "#FFD166");

    }

  }, [loaded]);

  if(showLoadingUI) return(

  if(!loaded && !hasCachedData && authUser) return (
     <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",background:"#0D0D0F",flexDirection:"column",gap:16}}>
        <div style={{width:44,height:44,border:"3px solid #FF6B35",borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.8s linear infinite"}}/>
        <div style={{color:"#F0EDE8",fontSize:16,fontWeight:700,fontFamily:"'DM Sans',sans-serif"}}>Synchronisierung...</div>
        <div style={{color:"#444",fontSize:12}}>Deine Daten werden abgerufen</div>
     </div>
  );


  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),type==="error"?15000:3500);};
  window.showToast = showToast;
  const p=n=>String(n).padStart(2,"0");
  const WN=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  const clkStr=WN[clk.getDay()]+" "+p(clk.getDate())+"."+p(clk.getMonth()+1)+"."+clk.getFullYear()+" | "+p(clk.getHours())+":"+p(clk.getMinutes())+":"+p(clk.getSeconds());
  const closeAll=()=>{setProfileOpen(false);setNotifOpen(false);setFriendsExpanded(false);};
  const activeEx = activeWorkout && activeWorkout.curEx !== undefined ? activeWorkout.exercises[activeWorkout.curEx] : null;
  const fmtTimer=t=>{const m=Math.floor(t/60),s=t%60;return`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;};
  const totalVol=data.workouts.reduce((a,w)=>a+(w.exercises||[]).reduce((b,e)=>b+(e.isHiit?0:(e.sets||[]).reduce((c,s)=>c+(parseFloat(s.weight)||0)*(parseFloat(s.reps)||0),0)),0),0);
  const getCWStart = () => {

    return d;

  const cwStart = getCWStart();

  const savePR=(exName,weight,reps,km,kcal)=>{

    if(item.group==="meal"){

      <div style={{position: "fixed", top: "55vh", left: -120, width: 360, height: 360, borderRadius: "50%", background: "radial-gradient(circle, rgba(0, 217, 192, 0.12) 0%, rgba(0, 217, 192, 0) 70%)", filter: "blur(60px)", pointerEvents: "none", zIndex: 0}} />
      <div style={{position: "fixed", top: "70vh", right: -40, width: 270, height: 270, borderRadius: "50%", background: "radial-gradient(circle, rgba(239, 71, 111, 0.09) 0%, rgba(239, 71, 111, 0) 70%)", filter: "blur(45px)", pointerEvents: "none", zIndex: 0}} />
      <div style={{position: "fixed", bottom: "30vh", left: "20vw", width: 300, height: 300, borderRadius: "50%", background: "radial-gradient(circle, rgba(167, 139, 250, 0.08) 0%, rgba(167, 139, 250, 0) 70%)", filter: "blur(50px)", pointerEvents: "none", zIndex: 0}} />
      <div style={{position: "fixed", bottom: 80, right: -60, width: 320, height: 320, borderRadius: "50%", background: "radial-gradient(circle, rgba(167, 139, 250, 0.12) 0%, rgba(167, 139, 250, 0) 70%)", filter: "blur(50px)", pointerEvents: "none", zIndex: 0}} />
      <div style={{position: "fixed", bottom: -80, left: -60, width: 260, height: 260, borderRadius: "50%", background: "radial-gradient(circle, rgba(255, 107, 53, 0.07) 0%, rgba(255, 107, 53, 0) 70%)", filter: "blur(45px)", pointerEvents: "none", zIndex: 0}} />
