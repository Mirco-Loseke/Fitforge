const WP_DAY_NAMES=["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const WP_DAY_SHORT=["Mo","Di","Mi","Do","Fr","Sa","So"];
const MEAL_PRESETS=["Frühstück","Mittagessen","Abendessen","Snack","Pre-Workout","Post-Workout"];
const ENTRY_TYPES={
  training:{color:"#3B82F6",bg:"#1e3a5f",label:"Training",icon:"🏋️"},
  meal:    {color:"#22C55E",bg:"#14532d",label:"Mahlzeit", icon:"🥗"},
  stretching:{color:"#FF9F1C",bg:"#4a2c0a",label:"Dehnen", icon:"🧘"},
  rest:    {color:"#6B7280",bg:"#1f2937",label:"Ruhetag",  icon:"💤"},
  other:   {color:"#F59E0B",bg:"#451a03",label:"Sonstiges",icon:"📌"},
};

function getMonday(d){const date=new Date(d);const day=date.getDay();const diff=date.getDate()-day+(day===0?-6:1);date.setDate(diff);date.setHours(0,0,0,0);return date;}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r;}
function fmtShort(d){return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});}
function uid(){return Math.random().toString(36).slice(2,9);}

function WochenplanPage({weekPlans,setWeekPlans,data,user,library,notify,favFoods=[],nutrition={}}){
  const [currentMonday,setCurrentMonday]=useState(()=>getMonday(new Date()));
  const [showEntryForm,setShowEntryForm]=useState(false);
  const [editEntry,setEditEntry]=useState(null);
  const [entryDay,setEntryDay]=useState(0);
  const [showTemplates,setShowTemplates]=useState(false);
  const [saveName,setSaveName]=useState("");
  const [showSaveModal,setShowSaveModal]=useState(false);
  const [templates,setTemplates]=useState(()=>{try{return JSON.parse(localStorage.getItem("ff_wptemplates")||"[]");}catch{return [];}});
  
  const [viewMode, setViewMode] = useState(() => window.innerWidth <= 768 ? 1 : 7);
  const [dayOffset, setDayOffset]=useState(0);

  const switchToMode = (m) => {
    setViewMode(m);
    if (m === 7) { setDayOffset(0); return; }
    
    const now = new Date();
    const monday = getMonday(now);
    const isThisWeek = weekKey === monday.toISOString().split("T")[0];
    
    if (!isThisWeek) { setDayOffset(0); return; }
    
    const todayIdx = (now.getDay() + 6) % 7; 
    if (m === 1) {
      setDayOffset(todayIdx);
    } else if (m === 3) {
      setDayOffset(Math.min(todayIdx, 4));
    }
  };

  useEffect(()=>localStorage.setItem("ff_wptemplates",JSON.stringify(templates)),[templates]);

  const [magicModal, setMagicModal] = useState(false);
  window.showMagicModal = () => setMagicModal(true);
  // Import geteilter Wochenpläne in die lokalen Vorlagen (von der Benachrichtigung aus)
  useEffect(()=>{
    window.ffAddWeekTemplate=(name,entries)=>setTemplates(t=>[...t,{id:uid(),name,entries:entries||{},savedAt:Date.now(),favorite:true}]);
    return ()=>{if(window.ffAddWeekTemplate)delete window.ffAddWeekTemplate;};
  },[]);

  const weekKey=currentMonday.toISOString().split("T")[0];
  const weekData=weekPlans[weekKey]||{entries:{}};// entries: {dayIndex: [entry,...]}

  const setWeekData=updater=>{
    setWeekPlans(wp=>{
      const cur=wp[weekKey]||{entries:{}};
      const next=typeof updater==="function"?updater(cur):{...cur,...updater};
      return{...wp,[weekKey]:next};
    });
  };

  const getDayEntries=dayIdx=>(weekData.entries[dayIdx]||[]).slice().sort((a,b)=>a.startTime.localeCompare(b.startTime));

  const addEntry=(dayIdx,entry)=>{
    setWeekData(w=>({...w,entries:{...w.entries,[dayIdx]:[...(w.entries[dayIdx]||[]),{...entry,id:uid()}]}}));
    notify("Eintrag hinzugefügt! ✅");
  };

  const updateEntry=(dayIdx,entryId,updated)=>{
    setWeekData(w=>({...w,entries:{...w.entries,[dayIdx]:(w.entries[dayIdx]||[]).map(e=>e.id===entryId?{...e,...updated}:e)}}));
    notify("Eintrag aktualisiert ✏️");
  };

  const deleteEntry=(dayIdx,entryId)=>{
    setWeekData(w=>({...w,entries:{...w.entries,[dayIdx]:(w.entries[dayIdx]||[]).filter(e=>e.id!==entryId)}}));
    notify("Eintrag gelöscht");
  };

  // Drag & Drop: Eintrag zwischen Tagen verschieben
  const [dragInfo,setDragInfo]=useState(null);   // {dayIdx, entryId}
  const [dragOverDay,setDragOverDay]=useState(null);
  const moveEntry=(fromDay,toDay,entryId)=>{
    if(fromDay===toDay)return;
    setWeekData(w=>{
      const ent=(w.entries[fromDay]||[]).find(e=>e.id===entryId);
      if(!ent)return w;
      return{...w,entries:{...w.entries,[fromDay]:(w.entries[fromDay]||[]).filter(e=>e.id!==entryId),[toDay]:[...(w.entries[toDay]||[]),ent]}};
    });
    notify(`Eintrag zu ${WP_DAY_NAMES[toDay]} verschoben 📅`);
  };

  // Eintrag auf andere Wochentage duplizieren
  const [dupInfo,setDupInfo]=useState(null);     // {dayIdx, entry}
  const [dupDays,setDupDays]=useState([]);
  const duplicateEntry=(entry,days)=>{
    if(!days.length)return;
    setWeekData(w=>{
      const ne={...w.entries};
      days.forEach(d=>{ne[d]=[...(ne[d]||[]),{...entry,id:uid()}];});
      return{...w,entries:ne};
    });
    setDupInfo(null);setDupDays([]);
    notify(`Eintrag auf ${days.length} Tag${days.length===1?"":"e"} kopiert 📋`);
  };

  // Vorlage auf eine frei wählbare Woche anwenden
  const [applyTmpl,setApplyTmpl]=useState(null);
  const [applyDate,setApplyDate]=useState("");
  const loadTemplateToWeek=(tmpl,dateStr)=>{
    if(!dateStr)return;
    const mon=getMonday(new Date(dateStr));
    const key=mon.toISOString().split("T")[0];
    setWeekPlans(wp=>({...wp,[key]:{...(wp[key]||{entries:{}}),entries:{...tmpl.entries}}}));
    setApplyTmpl(null);setShowTemplates(false);
    notify(`Vorlage „${tmpl.name}" auf KW ab ${fmtShort(mon)} angewendet! 📅`);
  };

  // Ist-Abgleich: wurde an diesem Tag ein Training mit diesem Plan absolviert?
  const isTrainingDone=(entry,dayISO)=>entry.type==="training"&&(data.workouts||[]).some(w=>w.date===dayISO&&String(w.planId)===String(entry.planId));

  const prevWeek=()=>setCurrentMonday(d=>addDays(d,-7));
  const nextWeek=()=>setCurrentMonday(d=>addDays(d,7));
  const goToday = () => {
    const now = new Date();
    setCurrentMonday(getMonday(now));
    const todayIdx = (now.getDay() + 6) % 7;
    if (viewMode === 1) setDayOffset(todayIdx);
    else if (viewMode === 3) setDayOffset(Math.min(todayIdx, 4));
    else setDayOffset(0);
  };

  const isCurrentWeek=getMonday(new Date()).toISOString().split("T")[0]===weekKey;

  const saveTemplate=()=>{
    if(!saveName.trim())return;
    const tmpl={id:uid(),name:saveName.trim(),entries:weekData.entries,savedAt:Date.now(),favorite:false};
    setTemplates(t=>[...t,tmpl]);
    setShowSaveModal(false);setSaveName("");
    notify(`Woche als Vorlage „${saveName}" gespeichert! 💾`);
  };

  const loadTemplate=(tmpl)=>{
    setWeekData(w=>({...w,entries:{...tmpl.entries}}));
    setShowTemplates(false);
    notify(`Vorlage „${tmpl.name}" geladen! 📅`);
  };

  const loadTemplateNextWeek=(tmpl)=>{
    const nextWeekKey=addDays(getMonday(new Date()),7).toISOString().split("T")[0];
    setWeekPlans(wp=>({...wp,[nextWeekKey]:{...(wp[nextWeekKey]||{entries:{}}),entries:{...tmpl.entries}}}));
    setShowTemplates(false);
    notify(`Vorlage „${tmpl.name}" für nächste Woche übernommen! 📅`);
  };

  const toggleTemplateFavorite=id=>{setTemplates(t=>t.map(x=>x.id===id?{...x,favorite:!x.favorite}:x));};

  const deleteTemplate=id=>{setTemplates(t=>t.filter(x=>x.id!==id));};

  const today=new Date();
  
  const exportToICal = () => {
    const ics = [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//FitForge//NONSGML v1.0//EN',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH'
    ];

    Object.entries(weekData.entries).forEach(([dayIdx, entries]) => {
      const dayDate = addDays(currentMonday, parseInt(dayIdx));
      const year = dayDate.getFullYear();
      const month = String(dayDate.getMonth() + 1).padStart(2, '0');
      const day = String(dayDate.getDate()).padStart(2, '0');
      const dateTag = `${year}${month}${day}`;

      entries.forEach(e => {
        const start = (e.startTime || "08:00").replace(':', '');
        let endH = parseInt((e.startTime || "08:00").split(':')[0]) + 1;
        let endM = (e.startTime || "08:00").split(':')[1] || "00";
        const end = String(endH).padStart(2, '0') + endM;
        
        ics.push('BEGIN:VEVENT');
        ics.push(`DTSTART:${dateTag}T${start}00`);
        ics.push(`DTEND:${dateTag}T${end}00`);
        
        let summary = "FitForge: " + (e.type === 'training' ? 'Workout' : (e.title || e.mealName || e.type));
        if (e.type === 'training') {
          const plan = data.plans.find(p => String(p.id) === String(e.planId));
          if (plan) {
            summary = `💪 Training: ${plan.name}`;
            ics.push(`URL:${window.location.origin}${window.location.pathname}?openPlan=${plan.id}`);
          }
        } else if (e.type === 'meal') {
          summary = `🥗 Mahlzeit: ${e.mealPreset}${e.mealName ? ' (' + e.mealName + ')' : ''}`;
        } else if (e.type === 'stretching') {
          summary = `🧘 Dehnen${e.stretchName ? ': ' + e.stretchName : ''}`;
        }

        ics.push(`SUMMARY:${summary}`);
        ics.push(`DESCRIPTION:${e.notes || ''}`);
        ics.push('END:VEVENT');
      });
    });

    ics.push('END:VCALENDAR');
    const blob = new Blob([ics.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.setAttribute('download', `FitForge_${weekKey}.ics`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    notify("Wochenplan als Kalender-Datei (.ics) exportiert! 📅");
  };

  // Adaptive Dichte: Karten-Größe richtet sich nach dem vollsten sichtbaren Tag,
  // damit der Platz optimal genutzt wird (wenig Einträge → groß, viele → kompakt)
  const visibleMax=Math.max(0,...WP_DAY_NAMES.slice(dayOffset,dayOffset+viewMode).map((_,i)=>getDayEntries(dayOffset+i).length));
  const density=viewMode===7?(visibleMax>=5?"dense":visibleMax>=3?"compact":"roomy"):"roomy";
  const entryPad=density==="dense"?"5px 7px":density==="compact"?"7px 8px":"10px 11px";
  const entryTitleSize=density==="dense"?11:density==="compact"?12:13;
  const dayMinHeight=viewMode===1?420:viewMode===3?400:(visibleMax<=1?230:visibleMax<=2?290:visibleMax<=4?360:440);

  return(
    <div style={{padding:"28px 24px 56px",maxWidth:1100,margin:"0 auto"}}>
      {/* Header */}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:24,flexWrap:"wrap",gap:12}}>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
          <div>
            <h1 style={s.pageTitle}>Wochenplan</h1>
            <div style={{display:"flex", alignItems:"center", gap:8, color:"#666", fontSize:11, fontWeight:700, textTransform:"uppercase", letterSpacing:1}}>
              <span style={{color:"#FF6B35",background:"rgba(255,107,53,0.12)",borderRadius:6,padding:"1px 7px"}}>KW {(()=>{const d=new Date(currentMonday);d.setDate(d.getDate()+3);const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/864e5-(3-(w1.getDay()+6)%7))/7);})()}</span>
              {fmtShort(currentMonday)} – {fmtShort(addDays(currentMonday,6))}
              {isCurrentWeek && <span style={{color:"#FF6B35"}}>●</span>}
            </div>
          </div>
          
          <div style={{display:"flex", background:"rgba(255, 255, 255, 0.04)", padding:4, borderRadius:12, border:"1px solid rgba(255, 255, 255, 0.08)", backdropFilter:"blur(10px)", WebkitBackdropFilter:"blur(10px)"}}>
            {[1,3,7].map(m => (
              <button 
                key={m} 
                onClick={()=>switchToMode(m)}
                style={{
                  border:"none", padding:"6px 12px", borderRadius:9, cursor:"pointer", fontSize:11, fontWeight:800,
                  background:viewMode===m?"#FF6B35":"transparent",
                  color:viewMode===m?"#000":"#888",
                  transition:"all 0.2s"
                }}
              >
                {m}T
              </button>
            ))}
          </div>
        </div>

        <div style={{display:"flex", alignItems:"center", gap:14}}>
          <div style={{display:"flex", gap:8}}>
            <button onClick={prevWeek} style={{...s.secBtn, padding:8, borderRadius:10}} title="Vorherige Woche">{IC.chevLeft}</button>
            {!isCurrentWeek && (
              <button 
                onClick={goToday} 
                style={{...s.secBtn, padding:"6px 14px", fontSize:13, display:"flex", alignItems:"center", gap:8, justifyContent:"center"}}
              >
                <span style={{display:"flex", alignItems:"center"}}>{IC.calendar}</span>
                <span>Heute</span>
              </button>
            )}
            <button onClick={nextWeek} style={{...s.secBtn, padding:8, borderRadius:10}} title="Nächste Woche">{IC.chevRight}</button>
          </div>
          <div style={{width:1, height:24, background:"rgba(255, 255, 255, 0.08)"}} />
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            <button style={{...s.secBtn,padding:"9px 13px",fontSize:13,display:"flex",alignItems:"center",gap:6,background:"rgba(6,214,160,0.1)",borderColor:"rgba(6,214,160,0.3)",color:"#06D6A0"}} onClick={exportToICal}>📅 iCal</button>
            <button style={{...s.secBtn,padding:"9px 13px",fontSize:13,display:"flex",alignItems:"center",gap:6,position:"relative"}} onClick={()=>setShowTemplates(true)}>
              📋 Vorlagen
              {templates.length>0&&<span style={{minWidth:16,height:16,borderRadius:8,background:"linear-gradient(135deg,#FF6B35,#FF8C5A)",color:"#fff",fontSize:9,fontWeight:900,display:"inline-flex",alignItems:"center",justifyContent:"center",padding:"0 4px"}}>{templates.length}</span>}
            </button>
            <button style={{...s.secBtn,padding:"9px 13px",fontSize:13,display:"flex",alignItems:"center",gap:6,background:"rgba(255,209,102,0.1)",borderColor:"rgba(255,209,102,0.35)",color:"#FFD166"}} onClick={()=>setShowSaveModal(true)} title="Aktuelle Woche als Vorlage speichern">💾 Woche speichern</button>
          </div>
        </div>
      </div>

      {/* Day Slider Navigation for 1T or 3T */}
      {viewMode < 7 && (
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18, background:"rgba(255, 255, 255, 0.04)", padding:"8px 16px", borderRadius:16, border:"1px solid rgba(255, 255, 255, 0.08)", backdropFilter:"blur(10px)", WebkitBackdropFilter:"blur(10px)"}}>
          <button 
            disabled={dayOffset <= 0}
            onClick={()=>setDayOffset(Math.max(0, dayOffset-1))}
            style={{background:"transparent", border:"none", color:dayOffset<=0?"#333":"#FF6B35", cursor:dayOffset<=0?"default":"pointer", display:"flex", padding:10}}
          >
            {IC.chevLeft}
          </button>
          
          <div style={{textAlign:"center"}}>
            <span style={{fontSize:13, fontWeight:900, color:"#F0EDE8", fontFamily:"'DM Sans',sans-serif"}}>
              {viewMode === 1 ? WP_DAY_NAMES[dayOffset] : `${WP_DAY_NAMES[dayOffset]} – ${WP_DAY_NAMES[Math.min(6, dayOffset + 2)]}`}
            </span>
            <div style={{fontSize:10, color:"#666", fontWeight:700, marginTop:2}}>
               Innerhalb der Woche wechseln
            </div>
          </div>

          <button 
            disabled={dayOffset >= (7 - viewMode)}
            onClick={()=>setDayOffset(Math.min(7-viewMode, dayOffset+1))}
            style={{background:"transparent", border:"none", color:dayOffset>=(7-viewMode)?"#333":"#FF6B35", cursor:dayOffset>=(7-viewMode)?"default":"pointer", display:"flex", padding:10}}
          >
            {IC.chevRight}
          </button>
        </div>
      )}

      {/* Week grid */}
      <div className={viewMode === 7 ? "wp-grid-7-scroll" : ""} style={{display:"grid", gridTemplateColumns: viewMode === 1 ? "1fr" : viewMode === 3 ? "repeat(3, 1fr)" : "repeat(7, 1fr)", gap:14}}>
        {WP_DAY_NAMES.slice(dayOffset, dayOffset + viewMode).map((_, idx) => {
          const dayIdx = dayOffset + idx;
          const dayDate=addDays(currentMonday,dayIdx);
          const isToday=dayDate.toDateString()===today.toDateString();
          const entries=getDayEntries(dayIdx);
          const isRest=entries.some(e=>e.type==="rest");
          const dayISO=`${dayDate.getFullYear()}-${String(dayDate.getMonth()+1).padStart(2,"0")}-${String(dayDate.getDate()).padStart(2,"0")}`;
          const isPast = dayDate.setHours(0,0,0,0) < new Date().setHours(0,0,0,0);
          const isDropTarget=dragOverDay===dayIdx&&dragInfo&&dragInfo.dayIdx!==dayIdx;
          return(
            <div key={dayIdx}
              onDragOver={e=>{if(dragInfo){e.preventDefault();setDragOverDay(dayIdx);}}}
              onDragLeave={()=>setDragOverDay(d=>d===dayIdx?null:d)}
              onDrop={e=>{e.preventDefault();if(dragInfo){moveEntry(dragInfo.dayIdx,dayIdx,dragInfo.entryId);}setDragInfo(null);setDragOverDay(null);}}
              style={{
              background:isPast ? "rgba(255,255,255,0.01)" : isRest ? "rgba(255,255,255,0.02)" : isToday ? "linear-gradient(180deg, rgba(59,130,246,0.09) 0%, rgba(59,130,246,0.02) 100%)" : "rgba(255,255,255,0.03)",
              border:`1px solid ${isToday?"rgba(59,130,246,0.55)":isRest?"rgba(255,255,255,0.06)":isPast?"rgba(255,255,255,0.02)":"rgba(255,255,255,0.06)"}`,
              borderRadius:14, minHeight:dayMinHeight, display:"flex", flexDirection:"column", transition:"all 0.3s", overflow:"hidden",
              backdropFilter:"blur(10px)", WebkitBackdropFilter:"blur(10px)",
              boxShadow:isDropTarget?"0 0 28px rgba(255,107,53,0.35), inset 0 0 0 2px #FF6B35":isToday?"0 0 24px rgba(59,130,246,0.14), inset 0 1px 0 rgba(59,130,246,0.2)":"none",
              opacity: isPast&&!isDropTarget ? 0.6 : 1
            }}>
              {/* Day header */}
              <div style={{padding:"10px 10px 8px",borderBottom:`1px solid ${isToday?"rgba(59,130,246,0.25)":"rgba(255,255,255,0.05)"}`,display:"flex",justifyContent:"space-between",alignItems:"center",background:isToday?"rgba(59, 130, 246, 0.12)":isRest?"rgba(255,255,255,0.02)":"transparent"}}>
                <div style={{display:"flex", alignItems:"center", gap:6,minWidth:0}}>
                  <div style={{minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:5}}>
                      <span style={{fontSize:11,fontWeight:700,color:isToday?"#3B82F6":"#666",textTransform:"uppercase",letterSpacing:"0.5px"}}>{WP_DAY_SHORT[dayIdx]}</span>
                      {isToday&&<span style={{fontSize:7.5,fontWeight:900,color:"#fff",background:"#3B82F6",borderRadius:5,padding:"2px 5px",letterSpacing:0.5,boxShadow:"0 0 10px rgba(59,130,246,0.5)"}}>HEUTE</span>}
                    </div>
                    <div style={{fontFamily:"'DM Sans',sans-serif",fontWeight:800,fontSize:15,color:isToday?"#F0EDE8":"#aaa"}}>{fmtShort(dayDate)}</div>
                  </div>
                  {isPast && <div style={{color:"#00D9C0", fontSize:14}}>{IC.check}</div>}
                </div>
                <button className="wpAddBtn" onClick={()=>{setEntryDay(dayIdx);setEditEntry(null);setShowEntryForm(true);}} style={{width:26,height:26,borderRadius:"50%",background:"linear-gradient(135deg,#FF6B35,#FF8C5A)",border:"none",color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,fontSize:16,lineHeight:1,boxShadow:"0 2px 10px rgba(255,107,53,0.3)",transition:"all 0.2s"}}>+</button>
              </div>

              {/* Entries */}
              <div style={{flex:1,padding:"8px 8px 10px",display:"flex",flexDirection:"column",gap:5,overflowY:"auto"}}>
                {!entries.length&&(
                  <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:10,padding:"16px 8px"}}>
                    {isPast?(
                      <div style={{textAlign:"center",color:"#2A2A30"}}>
                        <div style={{fontSize:22,marginBottom:6,opacity:0.4}}>—</div>
                        <div style={{fontSize:11,fontWeight:600,color:"#333",letterSpacing:"0.3px"}}>Keine Einträge</div>
                      </div>
                    ):(
                      <div style={{textAlign:"center",border:"1.5px dashed rgba(255,255,255,0.08)",borderRadius:12,padding:"20px 12px",width:"100%",boxSizing:"border-box"}}>
                        <div style={{fontSize:24,marginBottom:8,opacity:0.5}}>＋</div>
                        <div style={{fontSize:11,fontWeight:600,color:"#3A3A44",lineHeight:1.5}}>Noch kein Eintrag</div>
                        <div style={{fontSize:10,color:"#2E2E38",marginTop:4}}>Tippe + um etwas hinzuzufügen</div>
                      </div>
                    )}
                  </div>
                )}
                {entries.map(entry=>{
                  const meta=ENTRY_TYPES[entry.type]||ENTRY_TYPES.other;
                  const plan=entry.type==="training"?data.plans.find(p=>p.id===parseInt(entry.planId)):null;
                  const title=entry.type==="training"?(plan?.name||"Trainingsplan")
                    :entry.type==="meal"?(entry.mealPreset||(entry.mealName||"Mahlzeit"))
                    :entry.type==="stretching"?(entry.stretchName||"Dehnen")
                    :entry.type==="rest"?"Ruhetag"
                    :(entry.title||"Eintrag");
                  const done=isTrainingDone(entry,dayISO);
                  return(
                    <div key={entry.id} className="wpEntry" draggable
                      onDragStart={e=>{e.dataTransfer.effectAllowed="move";setDragInfo({dayIdx,entryId:entry.id});}}
                      onDragEnd={()=>{setDragInfo(null);setDragOverDay(null);}}
                      style={{background:done?"rgba(6,214,160,0.1)":meta.bg,border:`1px solid ${done?"rgba(6,214,160,0.45)":meta.color+"40"}`,borderLeft:`3px solid ${done?"#06D6A0":plan?.color||meta.color}`,borderRadius:9,padding:entryPad,cursor:"grab",transition:"all 0.15s", textDecoration: isPast&&!done ? "line-through" : "none", boxShadow:done?"0 0 12px rgba(6,214,160,0.12)":"none"}}
                      onClick={()=>{setEntryDay(dayIdx);setEditEntry(entry);setShowEntryForm(true);}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:4}}>
                        <div style={{flex:1,minWidth:0}}>
                          {density==="dense"?(
                            <div style={{display:"flex",alignItems:"center",gap:4,minWidth:0}}>
                              <span style={{fontSize:11,flexShrink:0}}>{done?"✅":meta.icon}</span>
                              <span style={{fontSize:entryTitleSize,fontWeight:700,color:done?"#06D6A0":"#F0EDE8",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{title}</span>
                            </div>
                          ):(
                            <>
                              <div style={{display:"flex",alignItems:"center",gap:4,marginBottom:2}}>
                                <span style={{fontSize:12}}>{done?"✅":meta.icon}</span>
                                <span style={{fontSize:10,fontWeight:700,color:done?"#06D6A0":meta.color,textTransform:"uppercase",letterSpacing:"0.3px"}}>{done?"Absolviert":meta.label}</span>
                              </div>
                              <div style={{fontSize:entryTitleSize,fontWeight:700,color:done?"#06D6A0":"#F0EDE8",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{title}</div>
                            </>
                          )}
                          <div style={{fontSize:density==="dense"?9:10,color:"#888",marginTop:density==="dense"?1:2}}>
                            {entry.startTime}{entry.endTime&&" – "+entry.endTime}
                            {entry.type==="training"&&plan&&<span style={{marginLeft:6,color:plan.color}}>●</span>}
                          </div>
                          {density!=="dense"&&entry.type==="meal"&&entry.calories&&<div style={{fontSize:10,color:"#22C55E",marginTop:1}}>{entry.calories} kcal</div>}
                          {density==="roomy"&&entry.notes&&<div style={{fontSize:10,color:"#666",marginTop:2,fontStyle:"italic",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{entry.notes}</div>}
                        </div>
                        <div style={{display:"flex",flexDirection:"column",gap:2,flexShrink:0}}>
                          <button title="Auf andere Tage kopieren" onClick={e=>{e.stopPropagation();setDupInfo({dayIdx,entry});setDupDays([]);}} style={{background:"transparent",border:"none",color:"#555",cursor:"pointer",padding:2,display:"flex",borderRadius:4,transition:"color 0.15s"}} onMouseEnter={e=>e.currentTarget.style.color="#4CC9F0"} onMouseLeave={e=>e.currentTarget.style.color="#555"}>{IC.copy}</button>
                          <button onClick={e=>{e.stopPropagation();deleteEntry(dayIdx,entry.id);}} style={{background:"transparent",border:"none",color:"#555",cursor:"pointer",padding:2,display:"flex",borderRadius:4,transition:"color 0.15s"}} onMouseEnter={e=>e.currentTarget.style.color="#EF476F"} onMouseLeave={e=>e.currentTarget.style.color="#555"}>{IC.x}</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      {/* Legend */}
      <div style={{display:"flex",gap:8,marginTop:16,flexWrap:"wrap"}}>
        {Object.entries(ENTRY_TYPES).map(([k,v])=>(
          <div key={k} style={{display:"flex",alignItems:"center",gap:6,background:v.color+"10",border:`1px solid ${v.color}25`,borderRadius:9,padding:"4px 10px"}}>
            <div style={{width:8,height:8,borderRadius:3,background:v.color}}/>
            <span style={{fontSize:11,fontWeight:700,color:"#999"}}>{v.icon} {v.label}</span>
          </div>
        ))}
      </div>

      {/* Entry Form Modal */}
      {showEntryForm&&(
        <WPEntryModal
          dayName={WP_DAY_NAMES[entryDay]}
          editEntry={editEntry}
          plans={data.plans}
          library={library}
          dayEntries={getDayEntries(entryDay)}
          favFoods={favFoods}
          nutrition={nutrition}
          onSave={entry=>{
            if(editEntry){updateEntry(entryDay,editEntry.id,entry);}
            else{addEntry(entryDay,entry);}
            setShowEntryForm(false);setEditEntry(null);
          }}
          onDelete={()=>{if(editEntry){deleteEntry(entryDay,editEntry.id);}setShowEntryForm(false);setEditEntry(null);}}
          onClose={()=>{setShowEntryForm(false);setEditEntry(null);}}
        />
      )}

      {/* Save template modal */}
      {showSaveModal&&(
        <Overlay onClick={e=>e.target===e.currentTarget&&setShowSaveModal(false)}>
          <div style={{...s.modal,maxWidth:380}}>
            <h3 style={{...s.modalTitle,fontSize:19,marginBottom:16}}>Woche als Vorlage speichern</h3>
            <input style={{...s.inp,marginBottom:16}} placeholder="Vorlagenname..." value={saveName} onChange={e=>setSaveName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveTemplate()}/>
            <div style={{display:"flex",gap:10}}>
              <button style={s.secBtn} onClick={()=>setShowSaveModal(false)}>Abbrechen</button>
              <button style={{...s.primaryBtn,flex:1}} onClick={saveTemplate} disabled={!saveName.trim()}>{IC.save} Speichern</button>
            </div>
          </div>
        </Overlay>
      )}

      {/* Templates Modal */}
      {showTemplates&&(
        <Overlay onClick={e=>e.target===e.currentTarget&&setShowTemplates(false)}>
          <div style={{...s.modal,maxWidth:420,maxHeight:"80vh",overflowY:"auto"}}>
            <h3 style={{...s.modalTitle,fontSize:19,marginBottom:16}}>📋 Vorlagen</h3>
            {!templates.length&&<div style={{color:"#666",textAlign:"center",padding:"30px 0",fontSize:13}}>Noch keine Vorlagen gespeichert.<br/>Speichere eine aktuelle Woche als Vorlage!</div>}
            {[...templates].sort((a,b)=>(b.favorite?1:0)-(a.favorite?1:0)).map(tmpl=>(
              <div key={tmpl.id} style={{background:tmpl.favorite?"linear-gradient(135deg,rgba(255,209,102,0.08),rgba(255,255,255,0.02))":"rgba(255,255,255,0.02)",border:tmpl.favorite?"1px solid rgba(255,209,102,0.3)":"1px solid rgba(255,255,255,0.06)",borderRadius:12,padding:"13px 16px",marginBottom:10,boxShadow:tmpl.favorite?"0 0 16px rgba(255,209,102,0.08)":"none"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                  <button style={{background:"transparent",border:"none",color:tmpl.favorite?"#FFD166":"#2A2A30",cursor:"pointer",padding:4,flexShrink:0,display:"flex"}} onClick={()=>toggleTemplateFavorite(tmpl.id)}>{IC.star}</button>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:14}}>{tmpl.name}</div>
                    <div style={{fontSize:11,color:"#666",marginTop:2}}>
                      {Object.values(tmpl.entries).flat().length} Einträge · Gespeichert {new Date(tmpl.savedAt).toLocaleDateString("de-DE")}
                    </div>
                  </div>
                  <button title="Mit Freunden teilen" style={{...s.cardIconBtn, color:"#4CC9F0", filter:"drop-shadow(0 0 6px rgba(76,201,240,0.6))"}} className="cardIconBtn" onClick={()=>window.ffShareItem&&window.ffShareItem({type:"weekplan",name:tmpl.name,payload:{entries:tmpl.entries}})}>{IC.share}</button>
                  <button style={{...s.cardIconBtn, color:"#EF476F", filter:"drop-shadow(0 0 6px rgba(239,71,111,0.8))"}} className="cardIconBtn" onClick={()=>deleteTemplate(tmpl.id)}>{IC.trash}</button>
                </div>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  <button style={{...s.secBtn,flex:1,minWidth:100,padding:"7px 10px",fontSize:12}} onClick={()=>loadTemplate(tmpl)}>{IC.copy} Diese Woche</button>
                  <button style={{...s.secBtn,flex:1,minWidth:100,padding:"7px 10px",fontSize:12,borderColor:"#FF6B35",color:"#FF6B35"}} onClick={()=>loadTemplateNextWeek(tmpl)}>{IC.copy} Nächste Woche</button>
                  <button style={{...s.secBtn,flex:1,minWidth:100,padding:"7px 10px",fontSize:12,borderColor:"rgba(76,201,240,0.4)",color:"#4CC9F0"}} onClick={()=>{setApplyTmpl(tmpl);setApplyDate(addDays(getMonday(new Date()),14).toISOString().split("T")[0]);}}>📅 Andere Woche…</button>
                </div>
              </div>
            ))}
            <button style={{...s.secBtn,width:"100%",marginTop:8}} onClick={()=>setShowTemplates(false)}>Schließen</button>
          </div>
        </Overlay>
      )}

      {/* Eintrag auf andere Tage kopieren */}
      {dupInfo&&(
        <Overlay onClick={e=>e.target===e.currentTarget&&setDupInfo(null)}>
          <div style={{...s.modal,maxWidth:380}}>
            <h3 style={{...s.modalTitle,fontSize:19,marginBottom:6}}>Eintrag kopieren</h3>
            <div style={{fontSize:13,color:"#888",marginBottom:16}}>
              „{(ENTRY_TYPES[dupInfo.entry.type]||ENTRY_TYPES.other).icon} {dupInfo.entry.type==="training"?(data.plans.find(p=>p.id===parseInt(dupInfo.entry.planId))?.name||"Training"):dupInfo.entry.mealPreset||dupInfo.entry.mealName||dupInfo.entry.stretchName||dupInfo.entry.title||"Eintrag"}" auf weitere Tage übernehmen:
            </div>
            <div style={{display:"flex",gap:6,marginBottom:18,flexWrap:"wrap"}}>

const FitAssistantService = {
  getApiKey: () => localStorage.getItem("ff_gemini_key"),
  setApiKey: (key) => localStorage.setItem("ff_gemini_key", key),

  generateRealAI: async (prompt, data, recipes, user, library, notify) => {
    const key = FitAssistantService.getApiKey();
    if (!key) throw new Error("Kein API Key gefunden.");

    const systemPrompt = `Du bist ein hochintelligenter Fitness-Assistent für die App 'FitForge'. 
Aufgabe: Erstelle einen Wochenplan (0=Montag bis 6=Sonntag) im JSON Format.
WICHTIG: Antworte AUSSCHLIESSLICH mit dem puren JSON Objekt ohne Markdown-Code-Blocks.

Kontext:
- Aktuelle Trainingspläne des Nutzers: ${JSON.stringify(data.plans.map(p => ({id:p.id, name:p.name, muscles:p.muscles})))}
- Übungs-Bibliothek (Metadaten für Typ & Muskeln): ${JSON.stringify(library.map(ex => ({name:ex.name, types:ex.types, muscles:ex.muscles})))}
- Verfügbare Rezepte: ${JSON.stringify(recipes.map(r => ({id:r.id, name:r.name, k:r.kcal})))}
- Arbeitszeiten des Nutzers (falls Arbeitswoche): ${JSON.stringify({days:user.workDays, shift:`${user.workStart}-${user.workEnd}`, break1:`${user.break1Start}-${user.break1End}`, break2:`${user.break2Start}-${user.break2End}`})}
- Nutzer-Prompt: "${prompt}"

Beachte extrem präzise alle Muskelgruppen (z.B. "nur Brust") oder Trainingsarten (z.B. "nur Entspannung") die im Prompt genannt werden. Wähle nur passende Pläne aus.

Extrem Wichtige Regeln für Zeit-Management:
1. Prüfe den TYP am Anfang des Prompts.
2. Bei "Arbeitswoche": Plane Training AUSNAHMSLOS außerhalb der Arbeitszeiten (${user.workStart} - ${user.workEnd}). Bevorzugt abends (ab ${user.workEnd}) oder morgens (vor ${user.workStart}).
3. Nutze die Pausenzeiten (Frühstück: ${user.break1Start}-${user.break1End}, Mittag: ${user.break2Start}-${user.break2End}) für Mahlzeiten, falls es sich um Arbeitstage handelt.
4. Berücksichtige Negationen (z.B. "keine Beine" -> keine Pläne mit Beinen).
5. Variiere die Mahlzeiten (cycle durch die Rezepte).
6. Beachte Frequenzwünsche (z.B. "3x Cardio").
7. Nutze bestehende Trainingspläne (planId als String).
8. Format für jeden Tag (Array von Items): 
   { id: "unique_id", type: "training"|"meal"|"rest"|"other", startTime: "HH:mm", planId: "ID", mealName: "Name", calories: 500, title: "Titel", notes: "Info" }

Struktur:
{
  "0": [items],
  "1": [items],
  ...
  "6": [items],
  "message": "Kurze, motivierende Zusammenfassung des Plans in Deutsch."
}`;

    const endpoints = [
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`,
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${key}`,
      `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${key}`,
      `https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent?key=${key}`
    ];

    let lastError = null;
    for (const url of endpoints) {
      try {
        const isV1beta = url.includes("v1beta");
        const resp = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: systemPrompt }] }],
            generationConfig: isV1beta ? { response_mime_type: "application/json" } : {}
          })
        });

        if (!resp.ok) {
           const err = await resp.json();
           lastError = err.error?.message || "Fehler";
           continue;
        }

        const resJson = await resp.json();
        const text = resJson.candidates[0].content.parts[0].text;
        return JSON.parse(text.replace(/```json/g, "").replace(/```/g, "").trim());
      } catch (e) { lastError = e.message; continue; }
    }

    // FINAL FALLBACK: Dynamic Discovery
    try {
      const modelsResp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
      const modelsData = await modelsResp.json();
      const geminiModel = (modelsData.models || []).find(m => m.name.includes("gemini") && m.supportedGenerationMethods?.includes("generateContent"));
      if (geminiModel) {
        const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/${geminiModel.name}:generateContent?key=${key}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: systemPrompt }] }],
              generationConfig: { response_mime_type: "application/json" }
            })
        });
        if (resp.ok) {
           const resJson = await resp.json();
           const text = resJson.candidates[0].content.parts[0].text;
           return JSON.parse(text.replace(/```json/g, "").replace(/```/g, "").trim());
        }
      }
    } catch (discoveryErr) { console.error("Discovery failed", discoveryErr); }

    throw new Error(`${lastError}. Tipp: Prüfe, ob die 'Generative Language API' für dein Projekt aktiviert ist.`);
  }
};

    const isNegated = (term) => {
      const idx = lower.indexOf(term);
      if (idx === -1) return false;
      const window = lower.substring(Math.max(0, idx - 20), idx);
      return negators.some(n => window.includes(n));
    };

    const getFreq = (terms) => {
      for(const t of (Array.isArray(terms) ? terms : [terms])) {
        const regex = new RegExp(`(\\d+)\\s*(?:x|mal|pro|pro woche)\\s*(?:\\w+\\s*)?${t}`, 'i');
        const match = lower.match(regex);
        if (match) return parseInt(match[1]);
        const regexRev = new RegExp(`${t}\\s*(?:\\w+\\s*)?\\s*(\\d+)\\s*(?:x|mal)`, 'i');
        const matchRev = lower.match(regexRev);
        if (matchRev) return parseInt(matchRev[1]);
      }
      return null;
    };

    // ─── Phase 2: Domain Mapping ───
    const domain = {
      chest: { kw: ["brust", "chest", "push", "drücken"], active: false, freq: 0, neg: false },
      legs:  { kw: ["bein", "leg", "knie", "lower"], active: false, freq: 0, neg: false },
      back:  { kw: ["rücken", "back", "pull", "zug"], active: false, freq: 0, neg: false },
      cardio: { kw: ["cardio", "laufen", "run", "ausdauer"], active: false, freq: 0, neg: false },
      walk:  { kw: ["spazieren", "walk", "gehen", "schritte"], active: false, freq: 0, neg: false },
    };

    Object.keys(domain).forEach(k => {
      const g = domain[k];
      g.active = g.kw.some(kw => lower.includes(kw));
      g.neg = g.kw.some(kw => isNegated(kw));
      g.freq = getFreq(g.kw) || (g.active ? 2 : 0);
    });

    const chickenPref = lower.includes("hähnchen") || lower.includes("chicken");
    const veggiePref  = lower.includes("veggie") || lower.includes("vegetarisch") || isNegated("fleisch");
    const veganPref   = lower.includes("vegan");

    // ─── Phase 3: Selection ───
    const findPlan = (terms) => {
      return data.plans.find(p => 
        terms.some(t => p.name.toLowerCase().includes(t)) || 
        p.exercises.some(e => terms.some(t => e.name.toLowerCase().includes(t)))
      ) || data.plans[0];
    };

    const findRecipes = () => {
      let pool = [];
      if (veganPref) pool = recipes.filter(r => r.tags?.includes("Vegan"));
      else if (veggiePref) pool = recipes.filter(r => r.tags?.includes("Vegan") || r.tags?.includes("Veggie"));
      else if (chickenPref) pool = recipes.filter(r => r.name.toLowerCase().includes("hähnchen"));
      
      // Add favorites to pool for more variety if specific filter didn't yield enough
      const favorites = recipes.filter(r => r.favorite);
      
      let finalPool = pool.length > 0 ? pool : (favorites.length > 0 ? favorites : recipes);
      // Ensure we have at least a few for variety
      if (finalPool.length < 3 && favorites.length > 0) finalPool = [...new Set([...finalPool, ...favorites])];
      if (finalPool.length < 1) finalPool = recipes;

      return finalPool;
    };

    // ─── Phase 4: Build Week ───
    const weekMap = {};
    const daysArr = [0,1,2,3,4,5,6];
    
    // Distribution helpers
    const mainTrainingFreq = Math.max(
      domain.chest.active && !domain.chest.neg ? domain.chest.freq : 0,
      domain.legs.active && !domain.legs.neg ? domain.legs.freq : 0,
      domain.back.active && !domain.back.neg ? domain.back.freq : 0,
      3
    );

    const available = [...daysArr];
    const pickDay = () => available.splice(Math.floor(Math.random() * available.length), 1)[0];

    // Priority 1: Training
    const trainDays = [];
    for(let i=0; i<Math.min(mainTrainingFreq, 5) && available.length > 0; i++) {
      trainDays.push(pickDay());
    }

    // Priority 2: Cardio
    const cardioFrequency = domain.cardio.neg ? 0 : (domain.cardio.active ? domain.cardio.freq : 1);
    const cDays = [];
    for(let i=0; i<cardioFrequency && available.length > 0; i++) {
        cDays.push(pickDay());
    }

    // Priority 3: Walk
    const walkFrequency = domain.walk.neg ? 0 : (domain.walk.active ? domain.walk.freq : 1);
    const wDays = [];
    for(let i=0; i<walkFrequency && available.length > 0; i++) {
        wDays.push(available.includes(pickDay()) ? pickDay() : null); 
    }

    const recipePool = findRecipes();
    
    daysArr.forEach(d => {
      const items = [];
      // Cycle through recipes for variety
      const currentRecipe = recipePool[d % recipePool.length];
      
      items.push({id:uid(),type:"meal",startTime:"08:00",mealPreset:"Frühstück",mealName:"Protein-Overnight-Oats",calories:380});
      items.push({id:uid(),type:"meal",startTime:"13:00",mealPreset:"Mittagessen",mealName:currentRecipe.name,calories:currentRecipe.kcal});

      if(trainDays.includes(d)) {
          let p;
          if (domain.chest.active && !domain.chest.neg) p = findPlan(domain.chest.kw);
          else if (domain.back.active && !domain.back.neg) p = findPlan(domain.back.kw);
          else p = data.plans[d % data.plans.length];
          items.push({id:uid(),type:"training",startTime:"17:30",planId:String(p?.id || 1),notes:"KI-Optimiert"});
      } else if(cDays.includes(d)) {
          items.push({id:uid(),type:"other",startTime:"07:00",title:"Cardio/Laufen 🏃",notes:"Gleichmäßiges Tempo"});
      } else if(trainDays.length === 0 || d === 6) {
          items.push({id:uid(),type:"rest",startTime:"09:00",notes:"Regeneration"});
      }
      
      if(wDays.includes(d)) {
          items.push({id:uid(),type:"other",startTime:"10:30",title:"Aktive Erholung: Gehen 🌳"});
      }

      weekMap[d] = items;
    });

    // ─── Phase 5: Smart Response ───
    let txt = "Verstanden! Ich habe die Woche für dich optimiert: 🧠\n\n";
    if (domain.chest.active) txt += `• Fokus: Brustmuskulatur (${domain.chest.freq}x)\n`;
    if (domain.legs.neg) txt += "• Beine: Bewusst ausgeschlossen (Regeneration)\n";
    if (veggiePref) txt += "• Ernährung: Vegetarisch/Vegan ausgewählt\n";
    if (cardioFrequency > 0) txt += `• Ausdauer: ${cardioFrequency} Einheiten eingeplant\n`;
    txt += `• Abwechslung: ${recipePool.length > 1 ? recipePool.length + ' verschiedene Gerichte' : 'Deine Favoriten'} integriert.\n`;
    txt += "\nDer Plan sorgt für ein ausgewogenes Verhältnis von Belastung und Erholung.";

    setResult(weekMap);
    setHistory(h => [...h, {type:"ai", text:txt}]);
    setLoading(false);
    setPrompt("");
  };

  return(
    <div style={s.overlay2} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{...s.modal,maxWidth:520,background:"rgba(15,15,22,0.92)",backdropFilter:"blur(24px)",WebkitBackdropFilter:"blur(24px)",padding:0,overflow:"hidden",display:"flex",flexDirection:"column",maxHeight:"85vh",border:"1px solid rgba(167,139,250,0.2)"}}>
        {/* Header */}
        <div style={{padding:"20px 24px",background:"linear-gradient(135deg,rgba(167,139,250,0.15),transparent)",borderBottom:"1px solid rgba(255,255,255,0.07)",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{width:36,height:36,borderRadius:10,background:"#A78BFA",display:"flex",alignItems:"center",justifyContent:"center",color:"#fff"}}>{IC.sparkles}</div>
            <div>
              <h3 style={{margin:0,fontSize:17,fontFamily:"'DM Sans',sans-serif",fontWeight:800}}>KI-Planner PRO</h3>
              <div style={{fontSize:11,color:FitAssistantService.getApiKey()?"#06D6A0":"#A78BFA",fontWeight:700,textTransform:"uppercase"}}>{FitAssistantService.getApiKey()?"Vollversion":"Beta"}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:10}}>
            <button style={{background:"transparent",border:"none",color:"#666",cursor:"pointer",fontSize:20}} onClick={()=>setShowSettings(!showSettings)}>⚙️</button>
            <button style={{background:"transparent",border:"none",color:"#666",cursor:"pointer"}} onClick={onClose}>{IC.x}</button>
          </div>
        </div>
        
        {showSettings && (
          <div style={{padding:20,background:"rgba(255,255,255,0.03)",borderBottom:"1px solid rgba(255,255,255,0.06)"}} className="fadeIn">
            <label style={s.lbl}>Gemini API Key (Google AI Studio)</label>
            <div style={{display:"flex",gap:10}}>
              <input style={s.inp} type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)} placeholder="AIza..."/>
              <button style={{...s.primaryBtn,padding:"0 18px"}} onClick={saveSettings}>Sichern</button>
            </div>
            <p style={{fontSize:11,color:"#666",marginTop:8}}>Kostenlos erhältlich in den <a href="https://aistudio.google.com/app/apikey" target="_blank" style={{color:"#A78BFA"}}>Google AI Studio Settings</a>.</p>
          </div>
        )}
        
        {/* Chat / Content */}
        <div style={{flex:1,overflowY:"auto",padding:24,display:"flex",flexDirection:"column",gap:16,minHeight:300}}>
          {!history.length && (
            <div style={{textAlign:"center",marginTop:40,color:"#444"}}>
              <div style={{fontSize:40,marginBottom:14}}>✨</div>
              <h4 style={{color:"#888",marginBottom:8}}>Wie kann ich dir helfen?</h4>
              <p style={{fontSize:13,lineHeight:1.5}}>Schreibe mir deine Ziele für die Woche (z.B. „2x Beine, 3x Cardio, vegetarisch") und ich erstelle dir einen Plan!</p>
            </div>
          )}
          
          {history.map((msg,i)=>(
            <div key={i} style={{alignSelf:msg.type==="user"?"flex-end":"flex-start",maxWidth:"85%",display:"flex",flexDirection:"column",gap:4}}>
              <div style={{padding:"12px 16px",borderRadius:14,fontSize:14,lineHeight:1.5,background:msg.type==="user"?"#3B82F6":"rgba(255,255,255,0.05)",color:msg.type==="user"?"#fff":"#aaa",border:msg.type==="user"?"none":"1px solid rgba(255,255,255,0.08)",borderBottomLeftRadius:msg.type!=="user"?2:14,borderBottomRightRadius:msg.type==="user"?2:14}}>
                {msg.text}
              </div>
            </div>
          ))}
          
          {loading && (
            <div style={{display:"flex",gap:6,padding:"8px 16px"}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:"#3B82F6",animation:"fadeIn 0.6s infinite alternate"}}></div>
              <div style={{width:8,height:8,borderRadius:"50%",background:"#3B82F6",animation:"fadeIn 0.6s 0.2s infinite alternate"}}></div>
              <div style={{width:8,height:8,borderRadius:"50%",background:"#3B82F6",animation:"fadeIn 0.6s 0.4s infinite alternate"}}></div>
            </div>
          )}
          
          {result && !loading && (
            <div style={{marginTop:8,background:"rgba(6,214,160,0.05)",border:"1px solid rgba(6,214,160,0.2)",borderRadius:12,padding:16}}>
              <div style={{display:"flex",alignItems:"center",gap:8,color:"#06D6A0",fontSize:13,fontWeight:700,marginBottom:12}}>
                <span style={{fontSize:16}}>✅</span> Plan bereit zum Anwenden
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8}}>
                <button style={{...s.secBtn,padding:"10px",fontSize:12}} onClick={()=>setResult(null)}>Verwerfen</button>
                <button style={{...s.primaryBtn,padding:"10px",fontSize:12,background:"#06D6A0"}} onClick={()=>onApply(result)}>Woche füllen</button>
              </div>
            </div>
          )}
        </div>
        
        {/* Input */}
        <div style={{padding:20,background:"rgba(255,255,255,0.02)",borderTop:"1px solid rgba(255,255,255,0.06)"}}>
          <div style={{display:"flex",gap:10}}>
            <textarea 
              style={{...s.inp,flex:1,minHeight:48,maxHeight:120,resize:"none",padding:"12px 16px"}} 
              placeholder="Deine Wünsche..." 
              value={prompt} 
              onChange={e=>setPrompt(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();generate();}}}
            />
            <button 
              style={{width:48,height:48,borderRadius:10,background:prompt.trim()?"#3B82F6":"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",color:"#fff",cursor:prompt.trim()?"pointer":"default",display:"flex",alignItems:"center",justifyContent:"center",transition:"all 0.2s"}}
              onClick={generate}
              disabled={!prompt.trim() || loading}
            >
              <svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── AUTH SCREEN ──────────────────────────────────────────────────────────────
function AuthScreen(){
  const [mode,setMode]=useState("login"); // "login" | "register"
  const [email,setEmail]=useState("");
  const [password,setPassword]=useState("");
  const [name,setName]=useState("");
  const [loading,setLoading]=useState(false);
  const [error,setError]=useState("");
  const [showPw,setShowPw]=useState(false);

  const AUTH_ERRORS={
    "auth/invalid-email":"Ungültige E-Mail-Adresse.",
    "auth/user-not-found":"Kein Konto mit dieser E-Mail gefunden.",
    "auth/wrong-password":"Falsches Passwort.",
    "auth/email-already-in-use":"Diese E-Mail ist bereits registriert.",
    "auth/weak-password":"Passwort zu schwach (mind. 6 Zeichen).",
    "auth/too-many-requests":"Zu viele Versuche. Bitte warte kurz.",
    "auth/invalid-credential":"E-Mail oder Passwort falsch.",
  };

  // Warte bis Firebase wirklich bereit ist (max 10 Sekunden)
  const waitForFirebase = () => new Promise((res, rej) => {
    const check = (n) => {
      if(window.firebaseCreateUser && window.firebaseSignIn && window.firebaseAuth){
        res();
      } else if(n <= 0){
        rej(new Error("Firebase konnte nicht geladen werden. Bitte Seite neu laden (F5)."));
      } else {
        setTimeout(()=>check(n-1), 200);
      }
    };
    check(50); // 50 × 200ms = 10 Sekunden
  });

  const handleSubmit=async()=>{
    if(!email||!password)return setError("Bitte alle Felder ausfüllen.");
    if(mode==="register"&&!name)return setError("Bitte deinen Namen eingeben.");
    setLoading(true);setError("");
    try{
      await waitForFirebase();
      if(mode==="register"){
        const cred = await window.firebaseCreateUser(window.firebaseAuth, email, password);
        const [firstName, ...rest] = name.split(" ");
        const lastName = rest.join(" ");
        const initialUserData = { ...defaultUser, firstName, lastName, email };
        
        if(window.firebaseUpdateProfile) await window.firebaseUpdateProfile(cred.user, {displayName:name});
        
        // Explicitly set initial user data in Firestore for the new user
        const uid = cred.user.uid;
        await window.firebaseSetDoc(window.firebaseDoc(window.firebaseDb, "fitforge", `${uid}_user`), { value: initialUserData });
        // Also set into localStorage so it displays correctly immediately
        localStorage.setItem(`ff_${uid}_user`, JSON.stringify(initialUserData));
      } else {
        await window.firebaseSignIn(window.firebaseAuth, email, password);
      }
    } catch(e){
      setError(AUTH_ERRORS[e.code]||"Fehler: "+e.message);
    }
    setLoading(false);
  };

  const inp={width:"100%",background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:11,padding:"13px 16px",color:"#F0EDE8",fontSize:15,fontFamily:"'DM Sans',sans-serif",outline:"none",boxSizing:"border-box",backdropFilter:"blur(5px)",WebkitBackdropFilter:"blur(5px)",transition:"all 0.2s"};

  return(
    <div style={{minHeight:"100vh",background:"radial-gradient(circle at 50% 0%, #161622 0%, #0A0A0E 60%, #050507 100%)",display:"flex",alignItems:"center",justifyContent:"center",padding:20,fontFamily:"'DM Sans',sans-serif",position:"relative",overflow:"hidden"}}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&display=swap');input:focus{border-color:#FF6B35!important;outline:none;}`}</style>

      {/* Glows for login page */}
      <div style={{position: "absolute", top: -80, right: -80, width: 320, height: 320, borderRadius: "50%", background: "radial-gradient(circle, rgba(255, 107, 53, 0.15) 0%, rgba(255, 107, 53, 0) 70%)", filter: "blur(50px)", pointerEvents: "none", zIndex: 0}} />
      <div style={{position: "absolute", bottom: -80, left: -80, width: 320, height: 320, borderRadius: "50%", background: "radial-gradient(circle, rgba(167, 139, 250, 0.15) 0%, rgba(167, 139, 250, 0) 70%)", filter: "blur(50px)", pointerEvents: "none", zIndex: 0}} />

      <div style={{width:"100%",maxWidth:420,position:"relative",zIndex:1}}>
        {/* Logo */}
        <div style={{textAlign:"center",marginBottom:40}}>
          <div style={{display:"inline-flex",alignItems:"center",gap:10,marginBottom:8}}>
            <svg width="32" height="32" fill="#FF6B35" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
            <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:32,fontWeight:800,color:"#F0EDE8",letterSpacing:"-1px"}}>FitForge</span>
          </div>
          <p style={{color:"rgba(255,255,255,0.6)",fontSize:14,margin:0}}>{mode==="login"?"Willkommen zurück!":"Erstelle dein Konto"}</p>
        </div>

        {/* Card */}
        <div style={{background:"linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 60%), rgba(22, 22, 28, 0.35)",border:"1px solid rgba(255, 255, 255, 0.1)",borderRadius:20,padding:32,boxShadow:"inset 0 1px 1px rgba(255, 255, 255, 0.08), 0 24px 64px rgba(0,0,0,0.5)",backdropFilter:"blur(25px) saturate(200%)",WebkitBackdropFilter:"blur(25px) saturate(200%)",position:"relative",zIndex:1}}>
          {/* Mode toggle */}
          <div style={{display:"flex",background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:12,padding:4,marginBottom:28,gap:4,backdropFilter:"blur(8px)",WebkitBackdropFilter:"blur(8px)"}}>
            {["login","register"].map(m=>(
              <button key={m} onClick={()=>{setMode(m);setError("");}} style={{flex:1,background:mode===m?"#FF6B35":"transparent",border:"none",borderRadius:9,padding:"9px",color:mode===m?"#fff":"#888",cursor:"pointer",fontSize:13,fontWeight:700,fontFamily:"'DM Sans',sans-serif",transition:"all 0.2s"}}>
                {m==="login"?"Einloggen":"Registrieren"}
              </button>
            ))}
          </div>

          {mode==="register"&&(
            <div style={{marginBottom:14}}>
              <label style={{display:"block",fontSize:12,fontWeight:700,color:"#666",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.5px"}}>Name</label>
              <input style={inp} placeholder="Max Mustermann" value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSubmit()}/>
            </div>
          )}

          <div style={{marginBottom:14}}>
            <label style={{display:"block",fontSize:12,fontWeight:700,color:"#666",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.5px"}}>E-Mail</label>
            <input style={inp} type="email" placeholder="max@beispiel.de" value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSubmit()}/>
          </div>

          <div style={{marginBottom:error?16:24}}>
            <label style={{display:"block",fontSize:12,fontWeight:700,color:"#666",marginBottom:6,textTransform:"uppercase",letterSpacing:"0.5px"}}>Passwort</label>
            <div style={{position:"relative"}}>
              <input style={{...inp,paddingRight:48}} type={showPw?"text":"password"} placeholder={mode==="register"?"Mind. 6 Zeichen":"••••••••"} value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleSubmit()}/>
              <button onClick={()=>setShowPw(v=>!v)} style={{position:"absolute",right:14,top:"50%",transform:"translateY(-50%)",background:"transparent",border:"none",color:"#666",cursor:"pointer",fontSize:16,padding:0,display:"flex"}}>
                {showPw?"🙈":"👁️"}
              </button>
            </div>
          </div>

          {error&&<div style={{background:"#2A1A1A",border:"1px solid #4A2A2A",color:"#FCA5A5",borderRadius:10,padding:"10px 14px",fontSize:13,marginBottom:18}}>{error}</div>}

          <button onClick={handleSubmit} disabled={loading} style={{width:"100%",background:loading?"#333":"linear-gradient(135deg,#FF6B35,#FF8C60)",border:"none",borderRadius:11,padding:"14px",color:"#fff",fontSize:16,fontWeight:700,cursor:loading?"not-allowed":"pointer",fontFamily:"'DM Sans',sans-serif",display:"flex",alignItems:"center",justifyContent:"center",gap:8,transition:"all 0.2s"}}>
            {loading?<><div style={{width:18,height:18,border:"2px solid rgba(255,255,255,0.4)",borderTopColor:"#fff",borderRadius:"50%",animation:"spin 0.7s linear infinite"}}/> Laden...</>
            :mode==="login"?"⚡ Einloggen":"🚀 Konto erstellen"}
          </button>

          <p style={{textAlign:"center",color:"#555",fontSize:12,marginTop:20,marginBottom:0}}>
            {mode==="login"?"Noch kein Konto? ":"Bereits registriert? "}
            <button onClick={()=>{setMode(mode==="login"?"register":"login");setError("");}} style={{background:"transparent",border:"none",color:"#FF6B35",cursor:"pointer",fontWeight:700,fontSize:12,fontFamily:"'DM Sans',sans-serif"}}>
              {mode==="login"?"Jetzt registrieren":"Hier einloggen"}
            </button>
          </p>
        </div>
      </div>
      <style>{`@keyframes spin{to{transform:rotate(360deg);}}`}</style>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props){ super(props); this.state={error:null, info:null}; }
  static getDerivedStateFromError(e){ return {error:e}; }
  componentDidCatch(e,info){
    this.setState({info});
    if(window.dbg){ dbg('⚛️ REACT ERROR: '+e.message,'#f55'); }
  }
  render(){
    if(this.state.error) return React.createElement('div',{style:{padding:40,color:'#FCA5A5',fontFamily:'monospace',background:'#0D0D0F',minHeight:'100vh',overflow:'auto'}},
      React.createElement('h2',{style:{color:'#FF6B35',marginBottom:16}},'⚠️ App Fehler'),
      React.createElement('p',{style:{marginBottom:8, fontWeight: 'bold'}},'Fehlermeldung:'),
      React.createElement('pre',{style:{background:'#1a1a1a',padding:16,borderRadius:8,fontSize:13,overflow:'auto',marginBottom:20}},this.state.error.message),
      React.createElement('p',{style:{marginBottom:8, fontWeight: 'bold'}},'Stack Trace:'),
      React.createElement('pre',{style:{background:'#1a1a1a',padding:16,borderRadius:8,fontSize:11,color:'#888',overflow:'auto'}},this.state.info ? this.state.info.componentStack : 'Kein Stack Trace verfügbar'),
      React.createElement('p',{style:{marginTop:16,color:'#666',fontSize:13}},'Bitte schick einen Screenshot dieser Seite.')
    );
    return this.props.children;
  }
}
ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(ErrorBoundary,null,React.createElement(FitForge)));
</script>
<script>
// ── App-Loader: kompiliert das JSX einmalig und cached das Ergebnis ─────────
// Beim ersten Besuch (oder nach einem Update) wird Babel nachgeladen und der
// App-Code kompiliert; das Ergebnis landet im Cache (Schlüssel = Hash des
// Quellcodes). Bei jedem weiteren Besuch startet die App ohne Babel sofort.
(async function () {
  const src = document.getElementById('ff-src').textContent;
  const COMPILE_CACHE = 'ff-compiled';

  let hash = null;
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(src));
    hash = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) { /* kein Secure Context (z.B. file://) – dann ohne Cache kompilieren */ }

  const cacheUrl = hash ? '/__ff_compiled__/' + hash + '.js' : null;
  let code = null;

  if (cacheUrl && 'caches' in window) {
    try {
      const cache = await caches.open(COMPILE_CACHE);
      const hit = await cache.match(cacheUrl);
      if (hit) code = await hit.text();
    } catch (e) {}
  }

  if (!code) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js';
      s.onload = res;
      s.onerror = () => rej(new Error('Babel konnte nicht geladen werden'));
      document.head.appendChild(s);
    });
    code = Babel.transform(src, { presets: ['react'] }).code;
    if (cacheUrl && 'caches' in window) {
      try {
        const cache = await caches.open(COMPILE_CACHE);
        const old = await cache.keys();
        await Promise.all(old.map(k => cache.delete(k)));
        await cache.put(cacheUrl, new Response(code, { headers: { 'Content-Type': 'application/javascript' } }));
      } catch (e) {}
    }
  }

  // Warten, bis alle defer-Skripte (React, Firebase, …) ausgeführt sind –
  // DOMContentLoaded feuert erst danach.
  if (document.readyState === 'loading') {
    await new Promise(res => document.addEventListener('DOMContentLoaded', res));
  }
  if (!window.React || !window.ReactDOM) {
    await new Promise(res => window.addEventListener('load', res));
  }

  // Als type="module" ausführen – gleiche Semantik (strict mode, eigener Scope)
  // wie vorher mit Babels data-type="module".
  const runner = document.createElement('script');
  runner.type = 'module';
  runner.text = code;
  document.body.appendChild(runner);
})().catch(e => {
  console.error('App-Loader Fehler:', e);
  const el = document.createElement('div');
  el.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100vh;color:#F0EDE8;font-family:sans-serif;flex-direction:column;gap:8px;';
  el.innerHTML = '<div style="font-size:18px;font-weight:700">FitForge konnte nicht geladen werden</div><div style="color:#888;font-size:13px">' + (e && e.message || e) + ' – bitte Seite neu laden.</div>';
  document.body.appendChild(el);
});

// ── Service Worker: macht die App offline nutzbar & beschleunigt das Laden ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
