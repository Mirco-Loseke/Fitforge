                  {w.ptsBreakdown.distance > 0 && (
                    <div style={{display:"flex", justifyContent:"space-between", background:"rgba(0,0,0,0.2)", padding:"8px 12px", borderRadius:8}}>
                      <span style={{color:"#888"}}>Distanz</span>
                      <span style={{fontWeight:700, color:"#F0EDE8"}}>+ {w.ptsBreakdown.distance}</span>
                    </div>
                  )}
                  {w.ptsBreakdown.duration > 0 && (
                    <div style={{display:"flex", justifyContent:"space-between", background:"rgba(0,0,0,0.2)", padding:"8px 12px", borderRadius:8}}>
                      <span style={{color:"#888"}}>Aktive Zeit</span>
                      <span style={{fontWeight:700, color:"#F0EDE8"}}>+ {w.ptsBreakdown.duration}</span>

                  {w.ptsBreakdown.prs > 0 && (

                      <span style={{color:"#FF6B35", fontWeight:700}}>Neu aufgestellte Rekorde (PR)</span>

                    </div>
                  )}
                </div>
              )}
            </div>
          )}
          
          <div style={{display:"flex",flexDirection:"column",gap:16}}>
            {(w.exercises||[]).map((ex,i)=>{
              if (ex.isHiit) {
                return (
                  <div key={i} style={{...s.exBlock,background:"rgba(255,209,102,0.04)",backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)",border:"1px solid #FFD16644",padding:18}} className="hiit-glow">
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                      <div>
                        <div style={{fontSize:10,fontWeight:900,color:"#FFD166",textTransform:"uppercase",letterSpacing:1,marginBottom:4}}>⚡ HIIT Interval</div>
                        <div style={{fontWeight:800,fontSize:17,color:"#fff"}}>{ex.name}</div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontFamily:"'DM Sans',sans-serif",fontSize:22,fontWeight:800,color:"#FFD166"}}>{ex.duration}s</div>
                        <div style={{fontSize:10,color:"#666",fontWeight:700}}>GEHALTEN</div>
                      </div>
                    </div>
                  </div>
                );
              }

              const eVol = (ex.sets||[]).reduce((a,s)=>a+(parseFloat(s.weight)||0)*(parseInt(s.reps)||0),0);

              const eKm = (ex.sets||[]).reduce((a,s)=>a+(parseFloat(s.km)||0),0);

              const tr = libEx ? libEx.trackReps !== false : (ex.sets||[]).some(s => parseInt(s.reps) > 0);
              const tw = libEx ? libEx.trackWeight !== false : (ex.sets||[]).some(s => parseFloat(s.weight) > 0);
              const tk = libEx ? libEx.trackKcal : (ex.sets||[]).some(s => parseFloat(s.kcal) > 0);
              const tm = libEx ? libEx.trackKm : (ex.sets||[]).some(s => parseFloat(s.km) > 0);
              const ti = libEx ? libEx.trackIncline : (ex.sets||[]).some(s => s.incline);
              const tt = libEx ? libEx.trackTempo : (ex.sets||[]).some(s => s.tempo);

              let gtc = "40px";
              if(tr) gtc += " 1fr";
              if(tw) gtc += " 1fr";
              if(tk) gtc += " 1fr";
              if(tm) gtc += " 1fr";
              if(ti) gtc += " 1fr";
              if(tt) gtc += " 1fr";

                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                    <div style={{fontWeight:800,fontSize:16}}>{ex.name}</div>
                    <div style={{display:"flex",gap:6}}>

                      {eKm > 0 && <div style={{fontSize:10,fontWeight:700,color:"#4CC9F0",background:"#4CC9F015",padding:"3px 8px",borderRadius:6}}>{eKm.toFixed(1)} km</div>}

                  </div>
                  <div style={{...s.setsH,color:"#555",gridTemplateColumns:gtc,marginBottom:8}}>

                    {tw && <span style={{textAlign:"center"}}>kg</span>}
                    {tk && <span style={{textAlign:"center"}}>kcal</span>}
                    {tm && <span style={{textAlign:"center"}}>km</span>}
                    {ti && <span style={{textAlign:"center"}}>%</span>}
                    {tt && <span style={{textAlign:"center"}}>km/h</span>}

                  </div>
                  {(ex.sets||[]).map((set,si)=>(
                    <div key={si} style={{...s.setRow,gridTemplateColumns:gtc,marginBottom:6}}>
                      <span style={{...s.setN,width:26,height:26}}>{si+1}</span>
                      {tr && <span style={{background:"rgba(255,107,53,0.08)",border:"1px solid rgba(255,107,53,0.15)",borderRadius:9,padding:"8px",fontSize:12,textAlign:"center",color:"#FF6B35",fontWeight:700}}>{set.reps || 0}</span>}
                      {tw && <span style={{background:"rgba(167,139,250,0.08)",border:"1px solid rgba(167,139,250,0.15)",borderRadius:9,padding:"8px",fontSize:12,textAlign:"center",color:"#A78BFA",fontWeight:700}}>{set.weight || 0}</span>}
                      {tk && <span style={{background:"rgba(255,107,107,0.08)",border:"1px solid rgba(255,107,107,0.15)",borderRadius:9,padding:"8px",fontSize:12,textAlign:"center",color:"#FF6B6B",fontWeight:700}}>{set.kcal || 0}</span>}
                      {tm && <span style={{background:"rgba(76,201,240,0.08)",border:"1px solid rgba(76,201,240,0.15)",borderRadius:9,padding:"8px",fontSize:12,textAlign:"center",color:"#4CC9F0",fontWeight:700}}>{set.km || 0}</span>}

                    <>

                      if (!str || !str.includes(':')) return 0;
                      const parts = str.split(':');
                      return (parseInt(parts[0]) || 0) * 60 + (parseInt(parts[1]) || 0);

                    const diff = actualSecs - targetSecs;

                      : (diff > 0 ? `+${Math.round(diff)}s (Langsamer)` : `Punktlandung! 🎉`);
                    const diffColor = diff < 0 ? "#06D6A0" : (diff > 0 ? "#EF476F" : "#FFD166");
                    
                    return (
                      <div style={{marginTop: 15, background: "rgba(255,255,255,0.02)", border: "1px solid rgba(255,255,255,0.06)", borderRadius: 12, padding: 12}}>

                            <div style={{fontSize: 11, color: "#888"}}>Ziel-Pace: <span style={{color: "#fff", fontWeight: "bold"}}>{ex.targetPace} /km</span></div>

                          <div style={{textAlign: "right"}}>
                            <div style={{fontSize: 12, fontWeight: 900, color: diffColor}}>{diffFormatted}</div>
                          </div>
                        </div>
                      </div>
                    );
                  })()}
                </div>
              );

            })}
          </div>
          
          <button style={{display:"flex",alignItems:"center",gap:8,background:"rgba(239,71,111,0.15)",color:"#EF476F",border:"1px solid #EF476F",borderRadius:12,padding:"11px 15px",marginTop:30,width:"100%",justifyContent:"center",fontSize:14,fontWeight:600,textShadow:"0 0 10px rgba(239,71,111,0.5)",boxShadow:"0 0 15px rgba(239,71,111,0.3), inset 0 0 10px rgba(239,71,111,0.2)",backdropFilter:"blur(12px)",WebkitBackdropFilter:"blur(12px)"}} onClick={()=>del(w.id)}>
            {IC.trash} Training aus Verlauf löschen
          </button>
        </div>
      </div>
    );
  }

  return(
    <div style={{...s.page, padding: isMobile ? "10px 10px 80px" : s.page.padding, position: "relative"}}>
      <div style={{...s.pageHead, display: "flex", justifyContent: "space-between", alignItems: "flex-start"}}>
        <div><h1 style={{...s.pageTitle, fontSize: isMobile ? 26 : 32}}>Verlauf</h1><p style={s.pageSub}>{data.workouts.length} abgeschlossene Trainings</p></div>
        <div style={{display: "flex", gap: 10, alignItems: "center"}}>
           {!compMode ? (
             <button style={{...s.secBtn, background: "rgba(255,209,102,0.15)", borderColor: "#FFD166", color: "#FFD166", textShadow: "0 0 10px rgba(255,209,102,0.5)", boxShadow: "0 0 15px rgba(255,209,102,0.3), inset 0 0 10px rgba(255,209,102,0.2)", padding: "7px 13px", borderRadius: 10, display: "flex", gap: 6, alignItems: "center"}} onClick={() => setCompMode(true)}>
               {IC.plans} Wochenvergleich
             </button>
           ) : (
             <button style={{...s.secBtn, background: "rgba(239,71,111,0.15)", borderColor: "#EF476F", color: "#EF476F", textShadow: "0 0 10px rgba(239,71,111,0.5)", boxShadow: "0 0 15px rgba(239,71,111,0.3), inset 0 0 10px rgba(239,71,111,0.2)", padding: "7px 13px", borderRadius: 10, display: "flex", gap: 6, alignItems: "center"}} onClick={() => { setCompMode(false); setCompSel([]); }}>
               {IC.x} Vergleich beenden
             </button>
           )}
        </div>
      </div>

      {compMode && (
        <div style={{background: "#FFD16615", border: "1px solid #FFD16633", padding: 14, borderRadius: 16, marginBottom: 20, display: "flex", justifyContent: "space-between", alignItems: "center", position: "sticky", top: 10, zIndex: 10, backdropFilter: "blur(10px)"}}>
          <div style={{fontSize: 13, fontWeight: 800, color: "#FFD166"}}>Wähle 2 Wochen zum Vergleich ({compSel.length}/2)</div>
          <button 
            disabled={compSel.length !== 2} 
            style={{...s.primaryBtn, background: compSel.length === 2 ? "#FFD166" : "#222", color: "#000", padding: "6px 16px", borderRadius: 8, fontSize: 12, opacity: compSel.length === 2 ? 1 : 0.5}}
            onClick={() => setShowComp(true)}
          >Vergleichen</button>
        </div>

function WeeklyReportMinimal({workouts, isMobile}) {
  const totalD = workouts.reduce((a,w)=>a+(parseInt(w.duration)||0),0);
  const getVol = w => (w.exercises||[]).reduce((a,e) => e.isHiit ? a : a + (e.sets||[]).reduce((b,s)=>b+(parseFloat(s.weight)||0)*(parseFloat(s.reps)||0),0), 0);
  const getKcal = w => (w.exercises||[]).reduce((a,e) => a + (e.sets||[]).reduce((b,s)=>b+(parseFloat(s.kcal)||0),0), 0);
  const getKm = w => (w.exercises||[]).reduce((a,e) => a + (e.sets||[]).reduce((b,s)=>b+(parseFloat(s.km)||0),0), 0);
  
  const totalVol = workouts.reduce((a,w)=>a+getVol(w),0);
  const totalKcal = workouts.reduce((a,w)=>a+getKcal(w),0);
  const totalKm = workouts.reduce((a,w)=>a+getKm(w),0);
  const totalSets = workouts.reduce((a,w)=>a+(w.exercises||[]).reduce((b,e)=>b+(e.isHiit ? 1 : (e.sets||[]).length),0),0);


  const muscleDistribution = {};
  workouts.forEach(w => {
    (w.exercises||[]).forEach(e => {
        // Find in library to get muscles if not stored
        const libEx = (window._lib||[]).find(l => l.name === e.name);
        (libEx?.muscles || []).forEach(m => muscleDistribution[m] = (muscleDistribution[m]||0) + 1);
    });
  });

  return (
    <div>
      <div style={{display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10, marginBottom: 20}}>
        <div style={{background: "rgba(255,255,255,0.04)", padding: 12, borderRadius: 14, textAlign: "center", border: "1px solid rgba(255,255,255,0.08)"}}>
          <div style={{fontSize: 18, fontWeight: 900, color: "#06D6A0"}}>{totalD} min</div>
          <div style={{fontSize: 9, color: "#666", textTransform: "uppercase", marginTop: 4}}>Dauer</div>
        </div>
        <div style={{background: "rgba(255,255,255,0.04)", padding: 12, borderRadius: 14, textAlign: "center", border: "1px solid rgba(255,255,255,0.08)"}}>
          <div style={{fontSize: 18, fontWeight: 900, color: "#A78BFA"}}>{Math.round(totalVol/1000)}t</div>
          <div style={{fontSize: 9, color: "#666", textTransform:"uppercase", marginTop: 4}}>Volumen</div>
        </div>
        {totalKcal > 0 && (
          <div style={{background: "rgba(255,255,255,0.04)", padding: 12, borderRadius: 14, textAlign: "center", border: "1px solid #FF6B6B33"}}>
            <div style={{fontSize: 18, fontWeight: 900, color: "#FF6B6B"}}>{totalKcal}</div>
            <div style={{fontSize: 9, color: "#666", textTransform: "uppercase", marginTop: 4}}>Kcal</div>
          </div>
        )}
        {totalKm > 0 && (
          <div style={{background: "rgba(255,255,255,0.04)", padding: 12, borderRadius: 14, textAlign: "center", border: "1px solid #4CC9F033"}}>
            <div style={{fontSize: 18, fontWeight: 900, color: "#4CC9F0"}}>{totalKm.toFixed(1)}km</div>
            <div style={{fontSize: 9, color: "#666", textTransform: "uppercase", marginTop: 4}}>Distanz</div>
          </div>
        )}
        <div style={{background: "rgba(255,255,255,0.04)", padding: 12, borderRadius: 14, textAlign: "center", border: "1px solid rgba(255,255,255,0.08)"}}>
          <div style={{fontSize: 18, fontWeight: 900, color: "#FF6B35"}}>{totalSets}</div>
          <div style={{fontSize: 9, color: "#666", textTransform: "uppercase", marginTop: 4}}>Sätze</div>
        </div>
        <div style={{background: "rgba(255,255,255,0.04)", padding: 12, borderRadius: 14, textAlign: "center", border: "1px solid rgba(255,255,255,0.08)"}}>
          <div style={{fontSize: 18, fontWeight: 900, color: "#FFD166"}}>{workouts.length}</div>
          <div style={{fontSize: 9, color: "#666", textTransform: "uppercase", marginTop: 4}}>Workouts</div>
        </div>
      </div>


      <h4 style={{fontSize: 11, fontWeight: 900, color: "#444", textTransform: "uppercase", letterSpacing: 1, marginBottom: 12, borderTop: "1px solid rgba(255,255,255,0.06)", paddingTop: 15}}>Muskelfokus</h4>
      <div style={{display: "flex", flexDirection: "column", gap: 8}}>
        {Object.entries(muscleDistribution).sort((a,b)=>b[1]-a[1]).slice(0, 5).map(([m, count]) => (
          <div key={m} style={{display: "flex", alignItems: "center", gap: 10}}>
            <div style={{fontSize: 11, fontWeight: 800, color: "#aaa", width: 80}}>{m}</div>
            <div style={{flex: 1, height: 6, background: "rgba(255,255,255,0.06)", borderRadius: 3, overflow: "hidden"}}>
               <div style={{height: "100%", background: MUSCLE_COLORS[m] || "#FF6B35", width: `${Math.min(100, (count/workouts.length)*100)}%`}} />
            </div>
          </div>
        ))}
        {Object.keys(muscleDistribution).length === 0 && <div style={{fontSize: 11, color: "#444"}}>Kein Fokus ermittelbar</div>}
      </div>

      <h4 style={{fontSize: 11, fontWeight: 900, color: "#444", textTransform: "uppercase", letterSpacing: 1, marginBottom: 12, marginTop: 25}}>Trainingsverlauf</h4>
      <div style={{display: "flex", flexDirection: "column", gap: 6}}>
        {workouts.map((w, wi) => (
          <div key={wi} style={{fontSize: 11, background: "#080808", padding: "8px 12px", borderRadius: 8, display: "flex", justifyContent: "space-between", alignItems: "center"}}>
            <div style={{fontWeight: 700}}>{w.name}</div>
            <div style={{color: "#666"}}>{new Date(w.date).toLocaleDateString("de-DE", {weekday: 'short'})}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

function WeeklyReportModal({report, onClose, data}) {
  const workouts = report.workouts;
  const totalW = workouts.length;
  const totalD = workouts.reduce((a,w)=>a+(parseInt(w.duration)||0),0);
  
  const getVol = w => (w.exercises||[]).reduce((a,e) => {
    if (e.isHiit) return a;
    return a + (e.sets||[]).reduce((b,s)=>b+(parseFloat(s.weight)||0)*(parseFloat(s.reps)||0),0);
  }, 0);
  const totalVol = workouts.reduce((a,w)=>a+getVol(w),0);
  const totalKcal = workouts.reduce((a,w)=>(w.exercises||[]).reduce((b,e)=>b+(e.sets||[]).reduce((c,s)=>c+(parseFloat(s.kcal)||0),0),a),0);
  const totalKm = workouts.reduce((a,w)=>(w.exercises||[]).reduce((b,e)=>b+(e.sets||[]).reduce((c,s)=>c+(parseFloat(s.km)||0),0),a),0);
  const totalHiitSec = workouts.reduce((a,w)=>(w.exercises||[]).reduce((b,e)=>b+(e.isHiit?(e.duration||0):0),a),0);
  
  const muscleDistribution = {};
  const planCounts = {};
  const daysTrained = [];
  const WDS = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];
  
  workouts.forEach(w => {
    const d = new Date(w.date);
    const dayName = WDS[d.getDay()];
    if(!daysTrained.includes(dayName)) daysTrained.push(dayName);
    
    planCounts[w.name] = (planCounts[w.name]||0) + 1;

    const plan = data.plans.find(p => p.id === w.planId);
    if(plan && plan.muscles) {
      plan.muscles.forEach(m => muscleDistribution[m] = (muscleDistribution[m]||0) + 1);
    }
  });
  
  const sortedMuscles = Object.entries(muscleDistribution).sort((a,b)=>b[1]-a[1]);
  const maxMuscle = Math.max(...Object.values(muscleDistribution), 1);

  const exportImage = () => {
    const el = document.getElementById("report-area");
    if(!window.html2canvas) return alert("Export-Bibliothek wird geladen...");
    html2canvas(el, {
      backgroundColor: "#0D0D0F",
      scale: 2,
      useCORS: true
    }).then(canvas => {
      const link = document.createElement("a");
      link.download = `FitForge_Bericht_KW${report.wn}.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    });
  };

  return (
    <div style={s.overlay2} onClick={onClose}>
      <div style={{...s.modal, maxWidth:500, padding:0, background:"#0D0D0F", border:"1px solid #1E1E24", overflow:"hidden"}} onClick={e=>e.stopPropagation()} className="dropIn">

          <div style={{display:"flex", flexDirection:"column", alignItems:"center", textAlign:"center", marginBottom:30}}>
            <div style={{color:"#FF6B35", marginBottom:6, transform:"scale(1.5)"}}>{IC.bolt}</div>
            <div style={{fontFamily:"'DM Sans',sans-serif", fontSize:22, fontWeight:900, color:"#FF6B35", letterSpacing:1, marginBottom:16}}>FITFORGE</div>
            <h2 style={{...s.modalTitle, margin:0, fontSize:24}}>Wochenbericht KW {report.wn}</h2>
            <div style={{fontSize:13, color:"#666", marginTop:4}}>{report.dateRange} {report.yr}</div>
          </div>
          
          <div style={{display:"flex", gap:8, marginBottom:24}}>
            {WDS.map(day => {

function PhotoDetailModal({photo, onClose, isMobile}) {
  const [zoom, setZoom] = useState(1);
  const [pos, setPos] = useState({x:0, y:0});
  const [dragging, setDragging] = useState(false);
  const [start, setStart] = useState({x:0, y:0});
  const [initialDist, setInitialDist] = useState(null);

  const handleZoom = (delta) => {
    setZoom(prev => {
      const next = Math.min(Math.max(prev + delta, 1), 5);
      if (next === 1) setPos({x:0, y:0});
      return next;
    });
  };

  const handleStart = (e) => {
    if (e.touches && e.touches.length === 2) {
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      setInitialDist(dist);
    } else {
      if (zoom <= 1) return;
      setDragging(true);
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      setStart({x: clientX - pos.x, y: clientY - pos.y});
    }
  };

  const handleMove = (e) => {
    if (e.touches && e.touches.length === 2) {
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      if (initialDist) {
        const delta = (dist - initialDist) / 150;
        handleZoom(delta);
        setInitialDist(dist);
      }
    } else if (dragging) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      setPos({x: clientX - start.x, y: clientY - start.y});
    }
  };

  const handleEnd = () => {
    setDragging(false);
    setInitialDist(null);
  };

  const handleWheel = (e) => {
    if (e.ctrlKey) {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.2 : 0.2;
      handleZoom(delta);
    }
  };

  useEffect(() => {
    const el = document.getElementById("photoWrapper");
    if (el) el.addEventListener("wheel", handleWheel, { passive: false });
    return () => { if (el) el.removeEventListener("wheel", handleWheel); };
  }, [zoom]);

  return (
    <div style={s.overlay2} onClick={e => e.target === e.currentTarget && onClose()} onMouseMove={handleMove} onMouseUp={handleEnd} onTouchMove={handleMove} onTouchEnd={handleEnd}>
      <div style={{position:"absolute", top:24, right:24, display:"flex", gap:12, zIndex:120}}>
        <button style={{...s.iconCircle, background:"rgba(0,0,0,0.6)", border:"1px solid rgba(255,255,255,0.1)", width:44, height:44, color:"#fff"}} onClick={() => handleZoom(0.5)}>{IC.plus}</button>
        <button style={{...s.iconCircle, background:"rgba(0,0,0,0.6)", border:"1px solid rgba(255,255,255,0.1)", width:44, height:44, color:"#fff"}} onClick={() => handleZoom(-0.5)}>{IC.minus}</button>
        <button style={{...s.iconCircle, background:"#EF476F", border:"none", color:"#fff", marginLeft:8, width:44, height:44, boxShadow:"0 4px 12px rgba(239,71,111,0.3)"}} onClick={onClose}>{IC.x}</button>
      </div>
      
      <div id="photoWrapper" style={{width:"100%", height:"100%", display:"flex", alignItems:"center", justifyContent:"center", overflow:"hidden", cursor: zoom > 1 ? "grab" : "default"}}
           onMouseDown={handleStart} onTouchStart={handleStart}>
        <img 
          src={photo.url} 
          style={{
            maxWidth:"95%", 
            maxHeight:"95%", 
            objectFit:"contain", 
            transform: `translate(${pos.x}px, ${pos.y}px) scale(${zoom})`,
            transition: dragging ? "none" : "transform 0.2s cubic-bezier(0.16,1,0.3,1)",
            boxShadow: "0 20px 50px rgba(0,0,0,0.5)",
            borderRadius: 8
          }} 
          draggable="false"
        />
      </div>
      
      <div style={{position:"absolute", bottom:30, left:"50%", transform:"translateX(-50%)", background:"rgba(0,0,0,0.6)", backdropFilter:"blur(8px)", padding:"12px 24px", borderRadius:20, textAlign:"center", color:"#fff"}}>
        <div style={{fontFamily:"'DM Sans',sans-serif", fontWeight:800, fontSize:15}}>{fmtDate(photo.date)}</div>
        <div style={{fontSize:11, color:"#FF6B35", fontWeight:700, textTransform:"uppercase", marginTop:2}}>{photo.tag}</div>
      </div>
    </div>
  );
}

function ShareWithFriendsModal({item,user,onClose,notify}){
  const myUid=getUid();
  const [friends,setFriends]=useState([]);
  const [loading,setLoading]=useState(true);
  const [selected,setSelected]=useState(()=>new Set());
  const [sharing,setSharing]=useState(false);

  useEffect(()=>{
    getFriends(myUid).then(fr=>{
      // Doppelte (falls beidseitige Datensätze) nach uid deduplizieren
      const seen=new Map();
      fr.forEach(f=>{if(!seen.has(f.uid))seen.set(f.uid,f);});
      setFriends([...seen.values()]);
      setLoading(false);
    }).catch(()=>{setLoading(false);});
  },[]);

  const toggle=uid=>setSelected(s=>{const n=new Set(s);n.has(uid)?n.delete(uid):n.add(uid);return n;});

  const doShare=async()=>{
    if(!selected.size)return;
    setSharing(true);
    try{
      const myProfile=await upsertUserProfile(myUid,user).catch(()=>({username:user.username,firstName:user.firstName,lastName:user.lastName,email:user.email}));
      await shareItemWithFriends(myUid,myProfile,[...selected],item.type,item.name,item.payload);
      // WICHTIG: Mit aktivierter Offline-Persistenz gilt ein Schreibvorgang schon
      // als "fertig", sobald er lokal gespeichert ist – nicht wenn er den Server
      // erreicht. Deshalb warten wir explizit auf die Server-Bestätigung, damit der
      // Empfänger das Geteilte auch wirklich bekommt (sonst hängt es nur lokal fest).
      let confirmed=true;
      try{
        await Promise.race([
          window.firebaseDb.waitForPendingWrites(),
          new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),9000))
        ]);
      }catch(e){confirmed=false;}
      if(confirmed){
        notify(`„${item.name}" mit ${selected.size} Freund${selected.size===1?"":"en"} geteilt! 📤`);
      }else{
        notify("Teilen lokal gespeichert, aber noch nicht zum Server gesendet (Verbindung/Warteschlange). Es wird nachgesendet, sobald die Verbindung frei ist.","error");
      }
      onClose();
    }catch(e){notify(`Teilen fehlgeschlagen: ${e.message}`,"error");setSharing(false);}
  };

  const typeLabel=item.type==="plan"?"Trainingsplan":"Wochenplan";

  return(
    <Overlay onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{...s.modal,maxWidth:420,maxHeight:"80vh",overflowY:"auto"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
          <h3 style={{...s.modalTitle,fontSize:19,margin:0}}>{IC.share} Teilen</h3>
          <button style={{background:"transparent",border:"none",color:"#666",cursor:"pointer",display:"flex"}} onClick={onClose}>{IC.x}</button>
        </div>
        <p style={{fontSize:13,color:"#888",marginBottom:16}}>{typeLabel} „<span style={{color:"#F0EDE8",fontWeight:700}}>{item.name}</span>" mit Freunden teilen:</p>
        {loading?<div style={{color:"#666",fontSize:13,textAlign:"center",padding:"24px 0"}}>Freunde werden geladen…</div>:
          friends.length===0?<div style={{color:"#666",fontSize:13,textAlign:"center",padding:"24px 0",fontStyle:"italic"}}>Du hast noch keine Freunde. Füge zuerst über „Freunde" jemanden hinzu.</div>:
          <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
            {friends.map(f=>{
              const sel=selected.has(f.uid);
              return(
                <button key={f.uid} onClick={()=>toggle(f.uid)} style={{display:"flex",alignItems:"center",gap:10,background:sel?"rgba(255,107,53,0.1)":"rgba(255,255,255,0.03)",border:`1px solid ${sel?"#FF6B35":"rgba(255,255,255,0.08)"}`,borderRadius:10,padding:"10px 14px",cursor:"pointer",textAlign:"left",width:"100%"}}>
                  <div style={{width:20,height:20,borderRadius:6,border:`2px solid ${sel?"#FF6B35":"#444"}`,background:sel?"#FF6B35":"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,color:"#fff"}}>{sel&&IC.check}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:13,color:"#F0EDE8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.username||f.email||"Freund"}</div>
                    {f.username&&f.email&&<div style={{fontSize:11,color:"#888",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.email}</div>}
                  </div>
                </button>
              );
            })}
          </div>
        }
        <div style={{display:"flex",gap:10}}>
          <button style={{...s.secBtn,flex:1}} onClick={onClose}>Abbrechen</button>
          <button style={{...s.primaryBtn,flex:1,justifyContent:"center",opacity:(!selected.size||sharing)?0.5:1}} disabled={!selected.size||sharing} onClick={doShare}>{sharing?"Teilt…":`Teilen${selected.size?` (${selected.size})`:""}`}</button>
        </div>
      </div>
    </Overlay>
  );
}

function FriendsCard({user,notify}){
  const myUid=getUid();
  const [search,setSearch]=useState("");
  const [results,setResults]=useState([]);
  const [searching,setSearching]=useState(false);
  const [incoming,setIncoming]=useState([]);
  const [outgoing,setOutgoing]=useState([]);
  const [friends,setFriends]=useState([]);
  const [loading,setLoading]=useState(true);

  const reload=async()=>{
    if(!myUid)return;
    setLoading(true);
    try{
      const [inc,out,fr]=await Promise.all([getIncomingRequests(myUid),getOutgoingRequests(myUid),getFriends(myUid)]);
      setIncoming(inc);setOutgoing(out);setFriends(fr);
    }catch(e){console.warn("Freunde laden:",e.message);notify(`Freunde/Anfragen laden fehlgeschlagen: ${e.message}`,"error");}
    setLoading(false);
  };

  useEffect(()=>{
    reload();
    if(myUid){
      upsertUserProfile(myUid,user)
        .then(profile=>{if(!profile)notify("Dein Profil konnte nicht synchronisiert werden – die Suche findet dich evtl. nicht.","error");})
        .catch(e=>notify(`Profil-Sync fehlgeschlagen: ${e.message}`,"error"));
    }
  },[]);

  const doSearch=async()=>{
    if(!search.trim())return;
    setSearching(true);
    try{
      // Gesamtzahl der Profile ermitteln – hilft zu unterscheiden zwischen
      // "keine Treffer" und "die Datenbank ist leer / niemand hat sich synchronisiert".
      const allSnap=await window.firebaseDoc(window.firebaseDb,"userProfiles").limit(500).get();
      const total=allSnap.docs.length;
      if(window.dbg) dbg(`🔎 Suche "${search}" – ${total} Profile in der Datenbank`, '#4CC9F0');
      const res=await searchUserProfiles(search,myUid);
      setResults(res);
      if(!res.length){
        // Diagnose: zeige, welche durchsuchbaren Angaben die vorhandenen Profile haben.
        if(window.dbg) allSnap.docs.forEach(d=>{const p=d.data()||{};dbg(`   • Profil: user="${p.username||"-"}" name="${((p.firstName||"")+" "+(p.lastName||"")).trim()||"-"}" mail="${p.email||"-"}"`, '#888');});
        if(total<=1) notify("Es ist noch niemand anderes in der Datenbank. Die andere Person muss die App einmal (online, nicht als lokale Datei) öffnen.","error");
        else notify(`Niemanden gefunden (${total} Profile durchsucht). Tipp: Die gesuchte Person braucht einen Benutzernamen oder muss ihr Profil einmal speichern.`,"error");
      }
    }catch(e){console.warn(e);notify(`Suche fehlgeschlagen: ${e.message}`,"error");}
    setSearching(false);
  };

  const request=async(profile)=>{
    try{
      const myProfile=await upsertUserProfile(myUid,user);
      await sendFriendRequest(myUid,myProfile||user,profile);
      notify(`Anfrage an ${profile.username||profile.email} gesendet! 🤝`);
      reload();
    }catch(e){notify(e.message||"Anfrage fehlgeschlagen","error");}
  };

  const accept=async(req)=>{
    try{await acceptFriendRequest(req.id);notify(`Du bist jetzt mit ${req.fromUsername||req.fromEmail} befreundet! 🎉`);reload();}
    catch(e){notify("Fehler beim Annehmen","error");}
  };
  const decline=async(req)=>{
    try{await removeFriendRequest(req.id);reload();}catch(e){}
  };

  const invite=async()=>{
    if(window.location.protocol==="file:"){
      notify("Einladen funktioniert nur, wenn die App über eine echte Web-Adresse (nicht als lokale Datei) läuft.","error");
      return;
    }
    const url=`${window.location.origin}${window.location.pathname}?ref=${myUid}`;
    const text=`Komm auf FitForge trainieren! ${url}`;
    if(navigator.share){
      try{await navigator.share({title:"FitForge",text,url});return;}
      catch(e){if(e.name==="AbortError")return;}
    }
    if(navigator.clipboard&&window.isSecureContext){
      try{await navigator.clipboard.writeText(url);notify("Link kopiert! 📋");return;}catch(e){}
    }
    notify(`Teilen hier nicht möglich (unsicherer Kontext) – Link von Hand kopieren: ${url}`,"error");
  };

  const isRequested=uid=>outgoing.some(o=>o.to===uid)||friends.some(f=>f.uid===uid);

  return (
    <div style={{...s.card, background:"#16161A", backdropFilter:"none", WebkitBackdropFilter:"none"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <h3 style={s.cardTitle}>👥 Freunde</h3>
        <button style={{...s.secBtn,padding:"6px 14px",fontSize:12}} onClick={invite}>Einladen</button>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:16}}>
        <input style={{...s.inp,flex:1}} placeholder="Benutzername oder E-Mail suchen..." value={search} onChange={e=>setSearch(e.target.value)} onKeyDown={e=>e.key==="Enter"&&doSearch()}/>
        <button style={{...s.secBtn,padding:"0 16px"}} disabled={!search.trim()||searching} onClick={doSearch}>{searching?"...":"Suchen"}</button>
      </div>

      {results.length>0&&(
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
          {results.map(p=>(
            <div key={p.uid} style={{display:"flex",alignItems:"center",gap:10,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding:"10px 14px"}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontWeight:700,fontSize:13}}>{p.username||"(kein Username)"}</div>
                <div style={{fontSize:11,color:"#666"}}>{p.email}</div>
              </div>
              <button style={{...s.secBtn,padding:"6px 12px",fontSize:12}} disabled={isRequested(p.uid)} onClick={()=>request(p)}>{isRequested(p.uid)?"Angefragt":"Hinzufügen"}</button>
            </div>
          ))}
        </div>
      )}

      {incoming.length>0&&(
        <div style={{marginBottom:16}}>
          <div style={{fontSize:11,fontWeight:800,color:"#555",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Anfragen ({incoming.length})</div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {incoming.map(r=>{
              const primary=r.displayUsername||r.displayName||r.fromUsername||r.displayEmail||r.fromEmail||"Unbekannt";
              const secondaryParts=[];
              if(r.displayName&&r.displayName!==primary) secondaryParts.push(r.displayName);
              const mail=r.displayEmail||r.fromEmail;
              if(mail&&mail!==primary) secondaryParts.push(mail);
              return(
              <div key={r.id} style={{display:"flex",alignItems:"center",gap:10,background:"rgba(255,183,3,0.06)",border:"1px solid rgba(255,183,3,0.25)",borderRadius:10,padding:"10px 14px"}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontWeight:700,fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{primary}</div>
                  {secondaryParts.length>0&&<div style={{fontSize:11,color:"#888",marginTop:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{secondaryParts.join(" · ")}</div>}
                </div>
                <button style={{...s.primaryBtn,padding:"6px 12px",fontSize:12}} onClick={()=>accept(r)}>Annehmen</button>
                <button style={{background:"transparent",border:"none",color:"#666",cursor:"pointer",padding:6}} onClick={()=>decline(r)}>{IC.x}</button>
              </div>
            );})}
          </div>
        </div>
      )}

      <div>
        <div style={{fontSize:11,fontWeight:800,color:"#555",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:8}}>Deine Freunde ({friends.length})</div>
        {loading?<div style={{color:"#666",fontSize:12}}>Lädt...</div>:
          friends.length===0?<div style={{color:"#666",fontSize:12,fontStyle:"italic"}}>Noch keine Freunde. Nutze die Suche oben!</div>:
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {friends.map(f=>(
              <div key={f.id} style={{display:"flex",alignItems:"center",gap:10,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding:"10px 14px"}}>
                <div style={{flex:1,minWidth:0,fontWeight:700,fontSize:13}}>{f.username||f.email}</div>
              </div>
            ))}
          </div>
        }
      </div>
    </div>
  );
}

function ProfilePage({user,setUser,notify,isMobile,onRescue,latestWeight}){

    setUploading(true);

      setForm(prev=>({...prev,avatar:url}));

  return(<div style={s.page}><div style={s.pageHead}><div><h1 style={s.pageTitle}>Mein Profil</h1><p style={s.pageSub}>Daten & Einstellungen</p></div></div><div style={{display:"grid",gridTemplateColumns:isMobile?"1fr":"1fr 1fr",gap:22}}>
  <div style={{...s.card, background:"#16161A", backdropFilter:"none", WebkitBackdropFilter:"none"}}><h3 style={s.cardTitle}>Persönliche Daten</h3><div style={{display:"flex",alignItems:"center",gap:18,marginBottom:24}}><div className="avCircle" style={{width:76,height:76,borderRadius:"50%",background:"rgba(255,255,255,0.04)",border:"2px dashed rgba(255,255,255,0.15)",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",position:"relative",overflow:"hidden",flexShrink:0}} onClick={()=>fileRef.current.click()}>{form.avatar?<img src={form.avatar} alt="av" style={{width:"100%",height:"100%",objectFit:"cover",borderRadius:"50%"}}/>:<span style={{fontSize:28,fontFamily:"'DM Sans',sans-serif",fontWeight:800,color:"#FF6B35"}}>{getInitials(form)}</span>}<div className="avOverlay" style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.55)",display:"flex",alignItems:"center",justifyContent:"center",opacity:0,transition:"opacity 0.2s"}}>{IC.camera}</div></div><input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleAv}/><div><div style={{fontFamily:"'DM Sans',sans-serif",fontWeight:800,fontSize:16}}>{form.firstName||form.lastName?`${form.firstName} ${form.lastName}`.trim():"Dein Name"}</div></div></div>
  <div style={{...s.formGrid, gridTemplateColumns:isMobile?"1fr":"1fr 1fr"}}><div style={s.fg}><label style={s.lbl}>Vorname</label><input style={s.inp} value={form.firstName} onChange={e=>setForm(f=>({...f,firstName:e.target.value}))} placeholder="Max"/></div><div style={s.fg}><label style={s.lbl}>Nachname</label><input style={s.inp} value={form.lastName} onChange={e=>setForm(f=>({...f,lastName:e.target.value}))} placeholder="Mustermann"/></div></div>
  <div style={s.fg}><label style={s.lbl}>Benutzername</label><input style={s.inp} value={form.username||""} onChange={e=>setForm(f=>({...f,username:e.target.value.replace(/\s+/g,"")}))} placeholder="z.B. mirco_ff"/><div style={{fontSize:11,color:"#666",marginTop:5}}>Damit dich Freunde finden können.</div></div>
  <div style={s.fg}><label style={s.lbl}>E-Mail</label><input style={s.inp} type="email" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))} placeholder="max@beispiel.de"/></div>
  <div style={{...s.formGrid, gridTemplateColumns:isMobile?"1fr":"1fr 1fr"}}><div style={s.fg}><label style={s.lbl}>Gewicht (kg)</label><input style={s.inp} type="number" value={form.weight} onChange={e=>setForm(f=>({...f,weight:e.target.value}))} placeholder="80"/></div><div style={s.fg}><label style={s.lbl}>Größe (cm)</label><input style={s.inp} type="number" value={form.height} onChange={e=>setForm(f=>({...f,height:e.target.value}))} placeholder="180"/></div></div>
  <div style={s.fg}><label style={s.lbl}>Fitnessziel</label><select style={s.inp} value={form.goal} onChange={e=>setForm(f=>({...f,goal:e.target.value}))}>{["Muskelaufbau","Gewichtsverlust","Ausdauer","Fitness & Gesundheit","Kraft steigern"].map(g=><option key={g}>{g}</option>)}</select></div>
  </div>
  <FriendsCard user={form} notify={notify}/>
  <div style={{...s.card, background:"#16161A", backdropFilter:"none", WebkitBackdropFilter:"none"}}><h3 style={{...s.cardTitle,color:"#FFB703",display:"flex",alignItems:"center",gap:8}}><svg width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg> Arbeitswoche & Zeiten</h3>
     <p style={{fontSize:12,color:"#666",marginBottom:16,marginTop:4}}>Diese Zeiten nutzt die KI, um dein Training optimal um deinen Job herum zu planen.</p>
     <div style={s.fg}><label style={s.lbl}>Arbeitstage</label><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{FULL_WEEKDAYS.map(d=><button key={d} onClick={()=>{const wd=form.workDays||[];const nd=wd.includes(d)?wd.filter(x=>x!==d):[...wd,d];setForm(f=>({...f,workDays:nd}))}} style={{...s.dayToggle,background:(form.workDays||[]).includes(d)?"#FFB70320":"rgba(255,255,255,0.04)",borderColor:(form.workDays||[]).includes(d)?"#FFB703":"rgba(255,255,255,0.08)",color:(form.workDays||[]).includes(d)?"#FFB703":"#888"}}>{d}</button>)}</div></div>
     <div style={{...s.formGrid, gridTemplateColumns:isMobile?"1fr":"1fr 1fr"}}><div style={s.fg}><label style={s.lbl}>Arbeitsbeginn</label><input style={s.inp} type="time" value={form.workStart||"08:00"} onChange={e=>setForm(f=>({...f,workStart:e.target.value}))}/></div><div style={s.fg}><label style={s.lbl}>Arbeitsende</label><input style={s.inp} type="time" value={form.workEnd||"17:00"} onChange={e=>setForm(f=>({...f,workEnd:e.target.value}))}/></div></div>
     <div style={{fontSize:11,fontWeight:700,color:"#555",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:10,marginTop:6,display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:14}}>☕</span> Frühstückspause (Pause 1)</div>
     <div style={{...s.formGrid, gridTemplateColumns:isMobile?"1fr":"1fr 1fr"}}><div style={s.fg}><label style={s.lbl}>Beginn</label><input style={s.inp} type="time" value={form.break1Start||"09:30"} onChange={e=>setForm(f=>({...f,break1Start:e.target.value}))}/></div><div style={s.fg}><label style={s.lbl}>Ende</label><input style={s.inp} type="time" value={form.break1End||"10:00"} onChange={e=>setForm(f=>({...f,break1End:e.target.value}))}/></div></div>
     <div style={{fontSize:11,fontWeight:700,color:"#555",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:10,marginTop:6,display:"flex",alignItems:"center",gap:6}}><span style={{fontSize:14}}>🍱</span> Mittagspause (Pause 2)</div>
    <div style={{...s.formGrid, gridTemplateColumns:isMobile?"1fr":"1fr 1fr"}}><div style={s.fg}><label style={s.lbl}>Beginn</label><input style={s.inp} type="time" value={form.break2Start||"12:30"} onChange={e=>setForm(f=>({...f,break2Start:e.target.value}))}/></div><div style={s.fg}><label style={s.lbl}>Ende</label><input style={s.inp} type="time" value={form.break2End||"13:15"} onChange={e=>setForm(f=>({...f,break2End:e.target.value}))}/></div></div>
  </div>
  <div style={{...s.card, background:"#16161A", backdropFilter:"none", WebkitBackdropFilter:"none"}}><h3 style={s.cardTitle}>Ernährungsziele</h3><div style={s.fg}><label style={s.lbl}>Tageskalorienziel</label><input style={s.inp} type="number" value={form.calorieGoal||""} onChange={e=>setForm(f=>({...f,calorieGoal:parseInt(e.target.value)||2500}))} placeholder="2500"/></div><div style={s.fg}><label style={s.lbl}>Proteinziel (g/Tag)</label><input style={s.inp} type="number" value={form.proteinGoal||""} onChange={e=>setForm(f=>({...f,proteinGoal:parseInt(e.target.value)||150}))} placeholder="150"/></div><div style={s.fg}><label style={s.lbl}>Trinkziel (ml/Tag)</label><input style={s.inp} type="number" value={form.waterGoal||""} onChange={e=>setForm(f=>({...f,waterGoal:parseInt(e.target.value)||2500}))} placeholder="2500"/></div><div style={{height:1,background:"rgba(255,255,255,0.08)",margin:"18px 0"}}/><h3 style={{...s.cardTitle,marginBottom:14}}>Benachrichtigungen</h3><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",borderBottom:"1px solid rgba(255,255,255,0.08)"}}><div><div style={{fontWeight:700,fontSize:15}}>Erinnerungen</div><div style={{color:"#666",fontSize:11,marginTop:2}}>Wenn Training ansteht</div></div><div style={{...s.toggle,...(form.notificationsEnabled?s.toggleOn:{})}} onClick={()=>setForm(f=>({...f,notificationsEnabled:!f.notificationsEnabled}))}><div style={{...s.thumb,...(form.notificationsEnabled?s.thumbOn:{})}}/></div></div>{form.notificationsEnabled&&<div style={{...s.fg,marginTop:14}}><label style={s.lbl}>Erinnerungszeit</label><input style={s.inp} type="time" value={form.reminderTime||"08:00"} onChange={e=>setForm(f=>({...f,reminderTime:e.target.value}))}/></div>}<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0"}}><div><div style={{fontWeight:700,fontSize:15}}>Daily Check-in bei jedem Login</div><div style={{color:"#666",fontSize:11,marginTop:2}}>Statt nur einmal pro Tag, jedes Mal beim Öffnen der App anzeigen</div></div><div style={{...s.toggle,...(form.checkinEveryLogin?s.toggleOn:{})}} onClick={()=>setForm(f=>({...f,checkinEveryLogin:!f.checkinEveryLogin}))}><div style={{...s.thumb,...(form.checkinEveryLogin?s.thumbOn:{})}}/></div></div></div>
  <div style={{...s.card, background:"#16161A", backdropFilter:"none", WebkitBackdropFilter:"none"}}>
    <h3 style={{...s.cardTitle,marginBottom:14}}>💊 Supplements</h3>
    <div style={{display:"flex", flexDirection:"column", gap:10, marginBottom:16}}>
      {(form.supplements||[]).map(sp=>(
        <div key={sp.id} style={{display:"flex",alignItems:"center",gap:10,background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding:"10px 14px"}}>
          <div style={{flex:1, minWidth:0}}>
            <div style={{fontWeight:700,fontSize:13}}>{sp.name}{sp.amount?` · ${sp.amount}`:""}</div>
            <div style={{fontSize:10,color:"#666",marginTop:2}}>{(sp.days||[]).length===7?"Täglich":(sp.days||[]).join(", ")||"Keine Tage gewählt"}</div>
          </div>
          <button style={{background:"transparent",border:"none",color:"#EF476F",cursor:"pointer",padding:4,display:"flex"}} onClick={()=>{const next=(form.supplements||[]).filter(x=>x.id!==sp.id);setForm(f=>({...f,supplements:next}));setUser(u=>({...u,supplements:next}));}}>{IC.trash}</button>
        </div>
      ))}
      {!(form.supplements||[]).length && <div style={{color:"#666",fontSize:12,textAlign:"center",padding:"10px 0"}}>Noch keine Supplements eingetragen.</div>}
    </div>
    <div style={{borderTop:"1px solid rgba(255,255,255,0.08)", paddingTop:14}}>
      <div style={{display:"grid",gridTemplateColumns:isMobile?"1fr":"1fr 1fr",gap:11,marginBottom:11}}>
        <div style={s.fg}><label style={s.lbl}>Name</label><input style={s.inp} value={newSupp.name} onChange={e=>setNewSupp(v=>({...v,name:e.target.value}))} placeholder="z.B. Kreatin"/></div>
        <div style={s.fg}><label style={s.lbl}>Menge</label><input style={s.inp} value={newSupp.amount} onChange={e=>setNewSupp(v=>({...v,amount:e.target.value}))} placeholder="z.B. 5g"/></div>
      </div>
      <div style={s.fg}>
        <label style={s.lbl}>Tage</label>
        <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
          {FULL_WEEKDAYS.map(d=>(
            <button key={d} onClick={()=>setNewSupp(v=>({...v, days:(v.days||[]).includes(d)?(v.days||[]).filter(x=>x!==d):[...(v.days||[]),d]}))}
              style={{...s.dayToggle, background:(newSupp.days||[]).includes(d)?"#A78BFA20":"rgba(255,255,255,0.04)", borderColor:(newSupp.days||[]).includes(d)?"#A78BFA":"rgba(255,255,255,0.08)", color:(newSupp.days||[]).includes(d)?"#A78BFA":"#888"}}>{d}</button>
          ))}
        </div>
      </div>
      <button style={{...s.secBtn, width:"100%"}} disabled={!newSupp.name.trim()} onClick={()=>{
        if(!newSupp.name.trim())return;
        const newItem={id:Date.now(),name:newSupp.name.trim(),amount:newSupp.amount.trim(),days:newSupp.days||[]};
        const next=[...(form.supplements||[]),newItem];
        setForm(f=>({...f,supplements:next}));
        setUser(u=>({...u,supplements:next}));
        setNewSupp({name:"",amount:"",days:[]});
        notify("Supplement gespeichert! ✅");
      }}>{IC.plus} Supplement hinzufügen</button>
    </div>
  </div>
  </div>
  <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:22,gap:12}}>
    <button style={{...s.primaryBtn,flex:1}} onClick={save}>💾 Speichern</button>
    {onRescue&&<button onClick={onRescue} style={{display:"flex",alignItems:"center",gap:7,padding:"12px 16px",borderRadius:12,border:"1px solid rgba(6,214,160,0.3)",background:"rgba(6,214,160,0.06)",color:"#06D6A0",cursor:"pointer",fontSize:13,fontWeight:700,whiteSpace:"nowrap",flexShrink:0}}>
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      Daten retten
    </button>}
  </div></div>);}

const CAT_COLORS={"Frühstück":"#FFD166","Mittagessen":"#FF6B35","Abendessen":"#A78BFA","Snack":"#00D9C0"};

function RecipesPage({notify, isMobile}){
  const [recipes,setRecipes]=useState(()=>{try{const r=localStorage.getItem("ff_recipes"); const p=r?JSON.parse(r):null; return p!==null?p:DEFAULT_RECIPES;}catch{return DEFAULT_RECIPES;}});
  const [selRecipe,setSelRecipe]=useState(null);
  const [shoppingList,setShoppingList]=useState([]);
  const [showShopping,setShowShopping]=useState(false);
  const [showAdd,setShowAdd]=useState(false);
  const [search,setSearch]=useState("");
  const [filterCat,setFilterCat]=useState("Alle");
  const [filterFav,setFilterFav]=useState(false);
  const [apiRecipes,setApiRecipes]=useState([]);
  const [apiLoading,setApiLoading]=useState(false);
  const [searchMode,setSearchMode]=useState("local");

  const searchOpenFoodRecipes=async(query)=>{
    if(!query||query.length<3)return;
    setApiLoading(true);
    try{
      const res=await fetch(`https://world.openfoodfacts.org/cgi/search.pl?action=process&search_terms=${encodeURIComponent(query)}&sort_by=unique_scans_n&page_size=50&json=1`, {
        headers: { 'User-Agent': 'FitForge-HealthApp/1.0 (https://fitforge.app)' }
      });
      if(!res.ok) throw new Error("API_ERROR");
      const data=await res.json();
      const results=(data.products||[]).filter(p=>p.product_name && p.nutriments).map(p=>({
        id:"api_"+Date.now()+Math.random(),
        name:p.product_name+(p.brands?" ("+p.brands+")":""),
        kcal:Math.round(p.nutriments["energy-kcal_100g"] || p.nutriments["energy-kcal"] || (p.nutriments["energy-kj_100g"]/4.184) || 0),
        protein:Math.round((p.nutriments.proteins_100g||0)*10)/10,
        carbs:Math.round((p.nutriments.carbohydrates_100g||0)*10)/10,
        fat:Math.round((p.nutriments.fat_100g||0)*10)/10,
        time:15,category:"Sonstige",
        ingredients: (typeof p.ingredients_text === 'string' && p.ingredients_text.length > 5) 
          ? [{name:p.ingredients_text.substring(0,300),amount:p.quantity||"1 Einheit"}] 
          : [{name:"Nicht angegeben",amount:p.quantity||"1 Einheit"}],
        steps:["Produkt nach Belieben zubereiten."],
        tags:["Open Food Facts"],
        photo: p.image_url
      })).filter(p=>p.kcal>0);
      setApiRecipes(results);
    }catch(e){console.error("OFF Recipe Error:", e); notify("Fehler bei der Rezeptsuche", "error");}
    setApiLoading(false);
  };

  useEffect(()=>{
    if(searchMode==="api"&&search.length>=3){
      const t=setTimeout(()=>searchOpenFoodRecipes(search),600);
      return()=>clearTimeout(t);
    }
  },[search,searchMode]);
  
  const [checkedItems,setCheckedItems]=useState({});
  const [newRecipe,setNewRecipe]=useState({name:"",kcal:"",protein:"",carbs:"",fat:"",time:"",category:"Frühstück",ingredients:[{name:"",amount:""}],steps:[""],tags:""});

  useEffect(()=>localStorage.setItem("ff_recipes",JSON.stringify(recipes)),[recipes]);

  const cats=["Alle","Frühstück","Mittagessen","Abendessen","Snack"];
  const filtered=searchMode==="api"?apiRecipes:recipes.filter(r=>{
    const matchCat = filterCat==="Alle"||r.category===filterCat;
    const matchSearch = r.name.toLowerCase().includes(search.toLowerCase())||(Array.isArray(r.tags)&&r.tags.some(t=>t.toLowerCase().includes(search.toLowerCase())));
    const matchFav = !filterFav || r.favorite;
    return matchCat && matchSearch && matchFav;
  });

  const toggleFav=(id, e)=>{
    if(e) e.stopPropagation();
    setRecipes(prev=>prev.map(r=>r.id===id?{...r,favorite:!r.favorite}:r));
  };

  const addToShopping=(recipe,portions=1)=>{
    const r_ing = Array.isArray(recipe.ingredients)?recipe.ingredients:[];
    const items=r_ing.map(ing=>({id:Date.now()+Math.random(),name:ing.name||"Zutat",amount:ing.amount||"",recipe:recipe.name||"Rezept",checked:false,portions}));
    setShoppingList(l=>{
      const existing=[...l];
      items.forEach(item=>{
        const found=existing.findIndex(e=>e.name.toLowerCase()===item.name.toLowerCase());
        if(found>=0){existing[found]={...existing[found],amount:`${existing[found].amount} + ${item.amount}`};}
        else{existing.push(item);}
      });
      return existing;
    });
    setShowShopping(true);
    notify(`${recipe.name} zur Einkaufsliste hinzugefügt! 🛒`);
  };

  const toggleCheck=id=>setCheckedItems(c=>({...c,[id]:!c[id]}));
  const clearChecked=()=>setShoppingList(l=>l.filter(i=>!checkedItems[i.id]));

  const saveNewRecipe=()=>{
    if(!newRecipe.name)return notify("Name fehlt","error");
    const r={...newRecipe,id:Date.now(),kcal:parseInt(newRecipe.kcal)||0,protein:parseInt(newRecipe.protein)||0,carbs:parseInt(newRecipe.carbs)||0,fat:parseInt(newRecipe.fat)||0,time:parseInt(newRecipe.time)||0,tags:newRecipe.tags?newRecipe.tags.split(",").map(t=>t.trim()):[]};
    setRecipes(prev=>[...prev,r]);
    setShowAdd(false);
    notify("Rezept gespeichert! 🍽️");
  };

  // Detail view
  if(selRecipe){
    const r=selRecipe;
    return(
      <div style={{padding: isMobile ? "10px 10px 80px" : "28px 32px 56px", maxWidth:700, margin:"0 auto"}}>
        <button style={{background:"transparent",border:"none",color:"#888",cursor:"pointer",fontSize:13,padding: isMobile?"10px 0":"0 0 18px",display:"flex",alignItems:"center",gap:6,fontFamily:"'DM Sans',sans-serif"}} onClick={()=>setSelRecipe(null)}>← Zurück</button>
      <div style={{background:"rgba(255,255,255,0.03)", border: isMobile?"none":"1px solid rgba(255,255,255,0.07)", borderRadius:18, overflow:"hidden", backdropFilter:"blur(20px)", WebkitBackdropFilter:"blur(20px)"}}>
          <div style={{background:`linear-gradient(135deg,${CAT_COLORS[r.category]||"#FF6B35"}22,rgba(10,10,15,0.7))`, padding: isMobile?"20px":"28px 28px 20px"}}>
            <div style={{display:"inline-flex", background:CAT_COLORS[r.category]||"#FF6B35", borderRadius:8, padding:"4px 12px", fontSize:10, fontWeight:700, color:"#000", marginBottom:12}}>{r.category}</div>
            <h1 style={{fontFamily:"'DM Sans',sans-serif", fontSize: isMobile?22:28, fontWeight:800, margin:"0 0 8px"}}>{r.name}</h1>
            <div style={{display:"flex", gap: isMobile?10:16, fontSize:12, color:"#666", flexWrap:"wrap"}}>
              <span>⏱ {r.time} Min</span>
              <span>🔥 {r.kcal} kcal</span>
              <span style={{color:"#00D9C0"}}>💪 {r.protein}g P</span>
            </div>
          </div>
          <div style={{padding: isMobile?"0 16px 20px":"0 28px 28px"}}>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:20,marginTop:16}}>
              {(r.tags||[]).map((tag,i)=><span key={i} style={{fontSize:10,background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:6,padding:"2px 8px",color:"#888"}}>{tag}</span>)}
            </div>

                    {checkedItems[item.id]&&<svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="white" strokeWidth="4"><path d="M5 13l4 4L19 7"/></svg>}

  return(
    <div style={{...s.page, padding: isMobile ? "10px 10px 80px" : s.page.padding, maxWidth:940, margin:"0 auto"}}>

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:24, flexDirection: isMobile?"column":"row", gap:16}}>
        <div><h1 style={{fontFamily:"'DM Sans',sans-serif",fontSize: isMobile?26:32,fontWeight:800,margin:0,letterSpacing:"-0.5px"}}>Kochbuch</h1><p style={{color:"#666",fontSize:13,marginTop:4}}>{recipes.length} Rezepte gespeichert</p></div>
        <div style={{display:"flex",gap:8, width: isMobile?"100%":"auto"}}>
          <button style={{background:"rgba(255,255,255,0.04)",border:"1px solid rgba(255,255,255,0.08)",borderRadius:10,padding: isMobile?"10px":"10px 18px",color:"#aaa",fontSize:12,cursor:"pointer",display:"flex",alignItems:"center",gap:7, flex:1, justifyContent:"center"}} onClick={()=>setShowShopping(true)}>

          </button>
          <button style={{background:"#FF6B35",border:"none",borderRadius:10,padding: isMobile?"10px":"10px 18px",color:"#fff",fontSize:12,fontWeight:700,cursor:"pointer", flex:1}} onClick={()=>setShowAdd(o=>!o)}>

        <button style={{background:filterFav?"#FFD166":"rgba(255,255,255,0.04)",border:`1px solid ${filterFav?"#FFD166":"rgba(255,255,255,0.08)"}`,borderRadius:9,padding:"8px 14px",color:filterFav?"#000":"#888",cursor:"pointer",fontSize:12,fontWeight:600,flexShrink:0}} onClick={()=>{setSearchMode("local");setFilterFav(true);setApiRecipes([]);}}>⭐ Favoriten</button>
        <button style={{background:searchMode==="api"?"#FF6B35":"rgba(255,255,255,0.04)",border:`1px solid ${searchMode==="api"?"#FF6B35":"rgba(255,255,255,0.08)"}`,borderRadius:9,padding:"8px 14px",color:searchMode==="api"?"#fff":"#888",cursor:"pointer",fontSize:12,fontWeight:600,flexShrink:0}} onClick={()=>{setSearchMode("api");setFilterFav(false);setApiRecipes([]);}}>🌍 Community</button>
      </div>
      
      <div style={{display:"flex",gap:10,marginBottom:16,flexDirection: isMobile?"column":"row"}}>
        <input style={{...s.inp, flex:1, fontSize:13}} placeholder={searchMode==="api"?"Global suchen...":"Suche..."} value={search} onChange={e=>setSearch(e.target.value)}/>
        {searchMode==="local"&&<div style={{display:"flex",gap:6, overflowX:"auto", msOverflowStyle:"none", scrollbarWidth:"none", paddingBottom: isMobile?4:0}}>
          {cats.map(cat=><button key={cat} style={{background:filterCat===cat?(CAT_COLORS[cat]||"#FF6B35"):"rgba(255,255,255,0.04)",border:`1px solid ${filterCat===cat?(CAT_COLORS[cat]||"#FF6B35"):"rgba(255,255,255,0.08)"}`,borderRadius:9,padding:"8px 12px",color:filterCat===cat?"#000":"#888",cursor:"pointer",fontSize:11,fontWeight:600, flexShrink:0}} onClick={()=>setFilterCat(cat)}>{cat}</button>)}
        </div>}
      </div>

      {searchMode==="api"&&apiLoading&&<div style={{textAlign:"center",padding:"24px",color:"#888",fontSize:13}}>🔍 Durchsuche Datenbank...</div>}

      {/* Add recipe form */}
      {showAdd&&<div style={{...s.card, padding: isMobile?16:22, marginBottom:22}} className="fadeIn">
        <h3 style={{fontFamily:"'DM Sans',sans-serif",fontSize:17,fontWeight:800,margin:"0 0 16px"}}>Neues Rezept erstellen</h3>
        <div style={{display:"grid",gridTemplateColumns: isMobile?"1fr":"2fr 1fr 1fr",gap:11,marginBottom:11}}>
          <div><label style={s.lbl}>Name</label><input style={s.inp} value={newRecipe.name} onChange={e=>setNewRecipe(r=>({...r,name:e.target.value}))} placeholder="z.B. Protein Pancakes"/></div>
          <div><label style={s.lbl}>Kategorie</label><select style={s.inp} value={newRecipe.category} onChange={e=>setNewRecipe(r=>({...r,category:e.target.value}))}>{["Frühstück","Mittagessen","Abendessen","Snack"].map(c=><option key={c}>{c}</option>)}</select></div>
          <div><label style={s.lbl}>Zeit (Min)</label><input type="number" style={s.inp} value={newRecipe.time} onChange={e=>setNewRecipe(r=>({...r,time:e.target.value}))} placeholder="20"/></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns: isMobile?"repeat(2,1fr)":"repeat(4,1fr)",gap:11,marginBottom:14}}>
          {[["Kalorien","kcal","#FF6B35"],["Protein (g)","protein","#00D9C0"],["Carbs (g)","carbs","#FFD166"],["Fett (g)","fat","#A78BFA"]].map(([label,key,color])=>(
            <div key={key}><label style={{...s.lbl, color}}>{label}</label><input type="number" style={s.inp} value={newRecipe[key]} onChange={e=>setNewRecipe(r=>({...r,[key]:e.target.value}))} placeholder="0"/></div>
          ))}
        </div>
        <div style={{display:"flex",gap:10}}>
          <button style={{...s.secBtn, flex:1}} onClick={()=>setShowAdd(false)}>Abbrechen</button>
          <button style={{...s.primaryBtn, flex:1}} onClick={saveNewRecipe}>Speichern</button>
        </div>
      </div>}

      {/* Recipe Grid */}
      <div style={{display:"grid",gridTemplateColumns: isMobile ? "1fr" : "repeat(auto-fill,minmax(270px,1fr))", gap:16}}>
        {filtered.map(r=>(
          <div key={r.id} style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.06)",borderRadius:18,overflow:"hidden",cursor:"pointer",backdropFilter:"blur(15px)",WebkitBackdropFilter:"blur(15px)"}} className="hoverCard" onClick={()=>setSelRecipe(r)}>
            <div style={{background:`linear-gradient(135deg,${CAT_COLORS[r.category]||"#FF6B35"}22,rgba(10,10,15,0.6))`,padding:18,position:"relative"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                <span style={{background:CAT_COLORS[r.category]||"#FF6B35",borderRadius:7,padding:"3px 10px",fontSize:9,fontWeight:800,color:"#000"}}>{r.category}</span>
                <button style={{background:"transparent",border:"none",color:r.favorite?"#FFD166":"#444",cursor:"pointer",padding:0,fontSize:18, transition:"color 0.2s"}} onClick={(e)=>toggleFav(r.id, e)}>
                  {r.favorite?"★":"☆"}
                </button>
              </div>
              <h3 style={{fontFamily:"'DM Sans',sans-serif",fontSize:16,fontWeight:800,margin:"0 0 8px", color:"#F0EDE8"}}>{r.name}</h3>
              <div style={{display:"flex",gap:10,fontSize:11, color:"#888"}}>
                <span style={{color:"#FF6B35", fontWeight:700}}>🔥 {r.kcal} kcal</span>
                <span style={{color:"#00D9C0", fontWeight:700}}>💪 {r.protein}g P</span>
              </div>
            </div>
            <div style={{padding:"14px 18px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <span style={{fontSize:11,color:"#555"}}>⏱ {r.time} Min</span>
                <span style={{fontSize:11,color:"#555"}}>{r.ingredients?.length||0} Zutaten</span>
              </div>
            </div>
          </div>
        ))}
      </div>
      {!filtered.length&&<div style={{textAlign:"center",padding:"60px 20px",color:"#444",background:"rgba(255,255,255,0.02)",borderRadius:16,border:"1px solid rgba(255,255,255,0.06)",marginTop:16}}><div style={{fontSize:40,marginBottom:12}}>🥣</div><div style={{fontSize:13}}>Keine Rezepte gefunden.</div></div>}
    </div>
  );
}

  const year=calDate.getFullYear();
  const month=calDate.getMonth();

  const dim=new Date(year,month+1,0).getDate();
  const today2=todayStr();

  for(let i=0;i<firstDow;i++) calCells.push(null);
  for(let d=1;d<=dim;d++) calCells.push(d);

  const getDotColor=(d)=>{
    if(!d) return null;
    const es=logByDate[getDayStr(d)]||[];

    const pos=es.some(e=>e.points>0);

    <div style={{maxWidth:560,margin:"0 auto",padding:isMobile?"16px 12px":"24px 16px"}}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:24}}>
        <h1 style={{fontFamily:"'DM Sans',sans-serif",fontSize:isMobile?26:32,fontWeight:800,margin:0,letterSpacing:"-0.5px",background:"linear-gradient(135deg,#FF6B35,#FFD166)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Forge Points</h1>

function GoalsPage({user,setUser,data,notify,isMobile}){

    {id:3,title:"100kg Bankdrücken",category:"Kraft",target:100,current:85,unit:"kg",deadline:"2025-12-01",color:"#A78BFA",icon:"🏋️",done:false},
  ];}catch{return[];}});

    {id:1,title:"Neues Gym-Shirt",cost:5000,redeemed:false},
    {id:2,title:"Cheat Meal",cost:2000,redeemed:false}
  ];}catch{return[];}});
  const [showAddReward, setShowAddReward] = useState(false);
  const [newReward, setNewReward] = useState({title:"", cost:""});
  const [showLegend, setShowLegend] = useState(false);

  useEffect(()=>localStorage.setItem("ff_goals",JSON.stringify(goals)),[goals]);
  useEffect(()=>localStorage.setItem("ff_rewards",JSON.stringify(rewards)),[rewards]);

  const fp = user.forgePoints || 0;

  const saveReward = () => {
    if(!newReward.title || !newReward.cost) return notify("Titel und Kosten ausfüllen", "error");
    setRewards(r=>[...r,{...newReward, id:Date.now(), cost: parseInt(newReward.cost)||0, redeemed: false}]);

    if (fp < cost) return notify("Nicht genug Forge Points!", "error");
    setUser(u => ({...u, forgePoints: (u.forgePoints||0) - cost}));
    setRewards(r => r.map(x => x.id === id ? {...x, redeemed: true} : x));
    notify("Belohnung erfolgreich eingelöst! 🎉");
  };
  const deleteReward = id => {
    setRewards(r => r.filter(x => x.id !== id));

    if(!newGoal.title||!newGoal.target)return notify("Titel und Ziel ausfüllen","error");
    if(editId){
      setGoals(g=>g.map(x=>x.id===editId?{...x,...newGoal,target:parseFloat(newGoal.target),current:parseFloat(newGoal.current)||0}:x));

const MUSCLE_GROUPS=["Arme","Rücken","Brust","Schultern","Bauch","Oberschenkel","Unterschenkel","Gesäß"];
const TRAINING_TYPES=["Krafttraining","Entspannung","Cardio","HIIT","Mobility / Beweglichkeit","Stretching / Dehnen"];
const MUSCLE_COLORS={Arme:"#FF6B35",Rücken:"#A78BFA",Brust:"#00D9C0",Schultern:"#4361EE",Bauch:"#EF476F",Oberschenkel:"#FFD166",Unterschenkel:"#06D6A0",Gesäß:"#F72585"};
const TYPE_COLORS={Krafttraining:"#3B82F6",Entspannung:"#10B981",Cardio:"#F59E0B",HIIT:"#EF476F","Mobility / Beweglichkeit":"#CBFF8C","Stretching / Dehnen":"#FF9F1C"};

function LibraryPage({library,setLibrary,notify}){
  const [filterMuscle,setFilterMuscle]=useState([]);
  const [filterType,setFilterType]=useState([]);
  const [search,setSearch]=useState("");
  const [showForm,setShowForm]=useState(false);
  const [editEx,setEditEx]=useState(null);
  const [detailEx,setDetailEx]=useState(null);
  const [showFilters, setShowFilters] = useState(false);

  const filtered=library.filter(ex=>{
    const matchSearch=!search||ex.name.toLowerCase().includes(search.toLowerCase());
    const matchMuscle=!filterMuscle.length||filterMuscle.some(m=>ex.muscles?.includes(m));
    const matchType=!filterType.length||filterType.some(t=>ex.types?.includes(t));
    return matchSearch&&matchMuscle&&matchType;
  });

  const [equipModalEx, setEquipModalEx] = useState(null);
  const [descModalEx, setDescModalEx] = useState(null);

  const delEx=id=>{
    // Tombstone merken, damit ein veralteter Cloud-Snapshot die Löschung nicht rückgängig macht
    try{const t=JSON.parse(localStorage.getItem("ff_lib_deleted")||"[]");if(!t.includes(id)){t.push(id);localStorage.setItem("ff_lib_deleted",JSON.stringify(t.slice(-500)));}}catch(e){}
    setLibrary(l=>l.filter(e=>e.id!==id));notify("Übung gelöscht");
  };
  const saveEx=ex=>{
    // _m = Zuletzt-geändert-Zeitstempel, damit beim Zusammenführen die neuere Version gewinnt
    if(editEx){setLibrary(l=>l.map(e=>e.id===editEx.id?{...editEx,...ex,_m:Date.now()}:e));notify("Übung aktualisiert ✏️");}
    else{setLibrary(l=>[...l,{...ex,id:Date.now(),_m:Date.now()}]);notify("Übung gespeichert! 💪");}
    setShowForm(false);setEditEx(null);
  };

  const toggleArr=(arr,setArr,val)=>setArr(a=>a.includes(val)?a.filter(x=>x!==val):[...a,val]);

  return(
    <div style={s.page}>
      <div style={s.pageHead}>
        <div><h1 style={s.pageTitle}>Bibliothek</h1><p style={s.pageSub}>{library.length} Übungen gespeichert</p></div>
        <button style={s.primaryBtn} onClick={()=>{setEditEx(null);setShowForm(true);}}>{IC.plus} Übung erstellen</button>
      </div>

      {/* Search + Filter */}
      <div style={{background:"rgba(255,255,255,0.03)",border:"1px solid rgba(255,255,255,0.07)",borderRadius:16,padding:20,marginBottom:22,backdropFilter:"blur(15px)",WebkitBackdropFilter:"blur(15px)"}}>
        <div style={{display:"flex",gap:10,marginBottom:18}}>
          <div style={{position:"relative",flex:1}}>
            <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:"#666",display:"flex"}}>{IC.search}</span>
            <input style={{...s.inp,paddingLeft:36}} placeholder="Übung suchen..." value={search} onChange={e=>setSearch(e.target.value)}/>
          </div>
          <button
            style={{...s.iconCircle, width:40, height:40, borderRadius:11, position:"relative", ...(showFilters?s.iconOn:{})}}
            onClick={()=>setShowFilters(!showFilters)}
            title="Filter ein/ausblenden"
          >
            {IC.filter}
            {(filterMuscle.length+filterType.length)>0&&<span style={{position:"absolute",top:-5,right:-5,minWidth:16,height:16,borderRadius:8,background:"linear-gradient(135deg,#FF6B35,#FF8C5A)",color:"#fff",fontSize:9,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center",padding:"0 4px",boxShadow:"0 0 10px rgba(255,107,53,0.5)"}}>{filterMuscle.length+filterType.length}</span>}
          </button>
          {(filterMuscle.length||filterType.length)>0&&<button style={{...s.secBtn,padding:"10px 14px",fontSize:11, borderRadius:9}} onClick={()=>{setFilterMuscle([]);setFilterType([]);}}>✕ Reset</button>}
        </div>

        {showFilters && (
          <div className="dropIn" style={{background:"rgba(255,255,255,0.02)", padding:16, borderRadius:14, border:"1px solid rgba(255,255,255,0.06)", marginBottom:5}}>
            <div style={{marginBottom:18}}>
              <div style={{fontSize:11,fontWeight:700,color:"#666",textTransform:"uppercase",letterSpacing:"1px",marginBottom:10}}>Muskelgruppe</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {MUSCLE_GROUPS.map(m=>(
                  <button key={m} onClick={()=>toggleArr(filterMuscle,setFilterMuscle,m)} style={{background:filterMuscle.includes(m)?MUSCLE_COLORS[m]+"30":"rgba(255,255,255,0.04)",border:`1px solid ${filterMuscle.includes(m)?MUSCLE_COLORS[m]:"rgba(255,255,255,0.08)"}`,borderRadius:20,padding:"6px 14px",color:filterMuscle.includes(m)?MUSCLE_COLORS[m]:"#888",cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"'DM Sans',sans-serif",transition:"all 0.15s"}}>{m}</button>
                ))}
              </div>
            </div>
            <div>
              <div style={{fontSize:11,fontWeight:700,color:"#666",textTransform:"uppercase",letterSpacing:"1px",marginBottom:10}}>Trainingsart</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {TRAINING_TYPES.map(t=>(
                  <button key={t} onClick={()=>toggleArr(filterType,setFilterType,t)} style={{background:filterType.includes(t)?TYPE_COLORS[t]+"30":"rgba(255,255,255,0.04)",border:`1px solid ${filterType.includes(t)?TYPE_COLORS[t]:"rgba(255,255,255,0.08)"}`,borderRadius:20,padding:"6px 14px",color:filterType.includes(t)?TYPE_COLORS[t]:"#888",cursor:"pointer",fontSize:12,fontWeight:600,fontFamily:"'DM Sans',sans-serif",transition:"all 0.15s"}}>{t}</button>
                ))}
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Exercises Grid */}
      {(search||filterMuscle.length>0||filterType.length>0)&&filtered.length>0&&(
        <div style={{fontSize:12,fontWeight:700,color:"#666",marginBottom:12}}>{filtered.length} von {library.length} Übungen</div>
      )}
      {!filtered.length ? (
        <div style={{textAlign:"center",padding:"80px 20px",color:"#555",border:"2px dashed #1E1E24",borderRadius:18}}>
          <div style={{fontSize:48,marginBottom:16}}>🏋️</div>
          <div style={{fontSize:16,fontWeight:600,marginBottom:8,color:"#888"}}>{library.length?'Keine Übungen gefunden':'Noch keine Übungen'}</div>
          <div style={{fontSize:13}}>{library.length?'Filter anpassen':'Erstelle deine erste Übung über den Button oben!'}</div>
        </div>
      ) : (
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(260px,1fr))",gap:16}}>
          {filtered.map(ex => (
            <LibraryCard key={ex.id} ex={ex} setDetailEx={setDetailEx} setEditEx={setEditEx} setShowForm={setShowForm} delEx={delEx} setEquipModalEx={setEquipModalEx} setDescModalEx={setDescModalEx} />
          ))}
        </div>
      )}

      {/* Equipment Picker Modal */}
      {equipModalEx && (
        <EquipmentPickerModal 
          exercise={equipModalEx} 
          onSave={(items) => {
            setLibrary(l => l.map(e => e.id === equipModalEx.id ? { ...e, equipment: items, _m: Date.now() } : e));
            setEquipModalEx(null);
            notify("Geräte aktualisiert! ⚙️");
          }} 
          onClose={() => setEquipModalEx(null)} 
        />
      )}

      {/* Exercise Form Modal */}
      {showForm && <ExerciseFormModal exercise={editEx} onSave={saveEx} onClose={()=>{setShowForm(false);setEditEx(null);}}/>}

      {/* Detail Modal */}
      {detailEx && <ExerciseDetailModal exercise={detailEx} onClose={()=>setDetailEx(null)} onEdit={()=>{setEditEx(detailEx);setDetailEx(null);setShowForm(true);}} onDelete={()=>{delEx(detailEx.id);setDetailEx(null);}}/>}

      {/* Description Edit Modal */}
      {descModalEx && (
        <DescriptionEditModal 
          exercise={descModalEx} 
          onSave={(desc) => {
            setLibrary(l => l.map(e => e.id === descModalEx.id ? { ...e, description: desc, _m: Date.now() } : e));
            setDescModalEx(null);
            notify("Beschreibung aktualisiert! 📝");
          }} 
          onClose={() => setDescModalEx(null)} 
        />
      )}
    </div>
  );
}

function ExerciseFormModal({exercise,onSave,onClose}){
  const [name,setName]=useState(exercise?.name||"");
  const [desc,setDesc]=useState(exercise?.description||"");
  const [sets,setSets]=useState(exercise?.sets||"");
  const [reps,setReps]=useState(exercise?.reps||"");
  const [weight,setWeight]=useState(exercise?.weight||"");
  const [kcal,setKcal]=useState(exercise?.kcal||"");
  const [km,setKm]=useState(exercise?.km||"");
  const [incline,setIncline]=useState(exercise?.incline||"");
  const [tempo,setTempo]=useState(exercise?.tempo||"");
  const [trackSets,setTrackSets]=useState(exercise?.trackSets??true);
  const [trackReps,setTrackReps]=useState(exercise?.trackReps??true);
  const [trackWeight,setTrackWeight]=useState(exercise?.trackWeight??true);
  const [trackKcal,setTrackKcal]=useState(exercise?.trackKcal??false);
  const [trackKm,setTrackKm]=useState(exercise?.trackKm??false);
  const [trackIncline,setTrackIncline]=useState(exercise?.trackIncline??false);
  const [trackTempo,setTrackTempo]=useState(exercise?.trackTempo??false);

  const [muscles,setMuscles]=useState(exercise?.muscles||[]);
  const [types,setTypes]=useState(exercise?.types||[]);
  const [equipment,setEquipment]=useState(exercise?.equipment||[]);
  const [trackGPS,setTrackGPS]=useState(exercise?.trackGPS||false);

  const [hiitEnabled, setHiitEnabled] = useState(exercise?.hiitTimer?.enabled || false);
  const [hiitDuration, setHiitDuration] = useState(exercise?.hiitTimer?.duration || 30);
  const [thumbnail,setThumbnail]=useState(exercise?.thumbnail||null);
  const [uploading,setUploading]=useState(false);
  const fileRef=useRef();

  const toggleArr=(arr,setArr,val)=>setArr(a=>a.includes(val)?a.filter(x=>x!==val):[...a,val]);

  const handleImg=async(file)=>{
    if(!file)return;
    setUploading(true);
    try{
      // Try Firebase Storage first
      const url=await uploadToStorage(file,`exercises/${Date.now()}_${file.name}`);
      setThumbnail(url);
      setUploading(false);
    }catch{
      // Fallback: base64
      if (file.type.includes("video")) {
        readFile(file).then(d=>{ setThumbnail(d); setUploading(false); });
      } else {
        const reader=new FileReader();
        reader.onload=async(e)=>{
          const img=new Image();
          img.onload=()=>{
            const canvas=document.createElement("canvas");
            const MAX=300;
            let w=img.width,h=img.height;
            if(w>h){if(w>MAX){h=h*(MAX/w);w=MAX;}}else{if(h>MAX){w=w*(MAX/h);h=MAX;}}
            canvas.width=w;canvas.height=h;
            canvas.getContext("2d").drawImage(img,0,0,w,h);
            setThumbnail(canvas.toDataURL("image/jpeg",0.75));
            setUploading(false);
          };
          img.src=e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }
  };

  const save=()=>{
    if(!name.trim())return;
    onSave({name:name.trim(),description:desc,sets,reps,weight,kcal,km,incline,tempo,trackSets,trackReps,trackWeight,trackKcal,trackKm,trackIncline,trackTempo,trackGPS,muscles,types,equipment,thumbnail, hiitTimer: { enabled: hiitEnabled, duration: parseInt(hiitDuration) || 30 }});

  };


  return ReactDOM.createPortal(
    <div style={s.overlay2} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div style={{...s.modal,maxWidth:520,maxHeight:"88vh",overflowY:"auto",background:"rgba(16,16,22,0.97)",backdropFilter:"blur(32px) saturate(180%)",WebkitBackdropFilter:"blur(32px) saturate(180%)",border:"1px solid rgba(255,255,255,0.2)",boxShadow:"inset 0 1px 1px rgba(255,255,255,0.1), 0 32px 80px rgba(0,0,0,0.85), 0 0 0 1px rgba(255,255,255,0.05)"}}>
        <h2 style={s.modalTitle}>{exercise?"Übung bearbeiten":"Neue Übung"}</h2>

        <div style={s.fg}><label style={s.lbl}>Name *</label><input style={s.inp} value={name} onChange={e=>setName(e.target.value)} placeholder="z. B. Bankdrücken"/></div>
        
        {/* New Field Grid */}
        {/* Tracking Configuration */}
        <div style={{fontSize:11,fontWeight:700,color:"#888",textTransform:"uppercase",letterSpacing:"1px",marginBottom:10,paddingTop:14,borderTop:"1px solid rgba(255,255,255,0.07)"}}>Angezeigte Felder (Tracken)</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:9,marginBottom:14}}>
          {[
            ["Sets",trackSets,setTrackSets,"#00D9C0"],
            ["Reps",trackReps,setTrackReps,"#FF6B35"],
            ["Weight",trackWeight,setTrackWeight,"#A78BFA"],
            ["kcal",trackKcal,setTrackKcal,"#FF6B6B"],
            ["km",trackKm,setTrackKm,"#4CC9F0"],
            ["Incline",trackIncline,setTrackIncline,"#FFD166"],
            ["km/h",trackTempo,setTrackTempo,"#EF476F"],
            ["GPS Track",trackGPS,setTrackGPS,"#06D6A0"]
          ].map(([label,val,set,color])=>(


            <div key={label} onClick={()=>set(!val)} style={{background:val?color+"15":"rgba(255,255,255,0.04)",border:`1px solid ${val?color:"rgba(255,255,255,0.08)"}`,borderRadius:9,padding:"8px 4px",textAlign:"center",cursor:"pointer",transition:"all 0.2s"}}>
              <div style={{fontSize:9,fontWeight:700,color:val?color:"#666",marginBottom:4}}>{label}</div>
              <div style={{width:16,height:16,borderRadius:4,border:`1px solid ${val?color:"#333"}`,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"center",background:val?color:"transparent"}}>
                {val&&<svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="#fff" strokeWidth="4"><path d="M5 13l4 4L19 7"/></svg>}
              </div>
            </div>
          ))}
        </div>

        {/* Value Inputs (only visible if tracked or always for defaults) */}
